<!doctype html>
<!-- #40 Rumor stamp — 1080x1920 (9:16), 30 fps, 7 s.
     A claim card (source chip + dateline + the claim) gets a verdict stamp slammed onto it:
       variant "0" Unconfirmed — smoked-glass card in the hook band, hollow Leonida-sunset stamp hanging off its bottom edge.
       variant "1" Confirmed   — ink-navy card above the caption zone, Rockstar-style dateline, solid teal seal on its top edge, check draws in.
     bg "plate" shows sample footage (and the stamp shakes it); bg "none" renders the card + stamp on transparency.
     Safe zone: everything sits inside x 72–936, y 230–1480. All content lives in CONFIG. -->
<html lang="en" data-composition-variables='[
  {"id":"variant","type":"enum","label":"Variant","default":"0","options":[{"value":"0","label":"Unconfirmed"},{"value":"1","label":"Confirmed"}]},
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; font-feature-settings: "tnum" 1, "ss01" 1; }
      :root {
        --ink: #0B0B0E; --navy: #1F202B; --paper: #FFFFFF;
        --amber: #FEB747; --teal: #2EC4B6; --r-magenta: #EE08F2;
        --shadow-card: 0 1px 2px rgba(0,0,0,.28), 0 34px 80px -26px rgba(0,0,0,.7);
      }

      /* ---- camera: sample plate (plate mode only), shaken on the stamp impact ---- */
      #cam { position: absolute; inset: -10px; overflow: hidden; }
      .plate { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

      /* ---- overlay ---- */
      #ov { position: absolute; inset: 0; }
      #unit { position: absolute; left: 72px; width: 864px; }
      #unit.top { top: 272px; }
      #unit.bottom { bottom: 548px; }            /* card bottom edge at y 1372 */

      #card { position: relative; border-radius: 28px; padding: 34px 44px 92px; }
      #unit.bottom #card { padding: 120px 44px 42px; }   /* 120 top so the seal clears the chip by ≥ 40 px */
      .smoke #card { background: rgba(14,14,20,.66); -webkit-backdrop-filter: blur(22px) saturate(1.4); backdrop-filter: blur(22px) saturate(1.4);
        box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 1px rgba(255,255,255,.10); color: #fff; }
      .no-plate .smoke #card { background: rgba(14,14,20,.78); }   /* the transparent export has no backdrop to blur */
      .navy #card { background: var(--navy); color: #fff;
        box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 34px 80px -24px rgba(0,0,0,.72), inset 0 1px 0 rgba(255,255,255,.10), inset 0 0 0 1px rgba(255,255,255,.08); }
      .paper #card { background: var(--paper); color: var(--ink);
        box-shadow: 0 2px 4px rgba(0,0,0,.35), 0 34px 80px -24px rgba(0,0,0,.62), inset 0 0 0 1px rgba(0,0,0,.12); }

      /* source chip (the card's header) */
      .chip { display: inline-flex; align-items: center; height: 54px; border-radius: 27px; padding: 0 22px 0 12px; gap: 14px;
        font-size: 28px; line-height: 1; white-space: nowrap; }
      .smoke .chip, .navy .chip { background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
      .paper .chip { background: rgba(11,11,14,.045); box-shadow: inset 0 0 0 1px rgba(11,11,14,.08); }
      .chip .ic { width: 32px; height: 32px; flex: none; display: block; }
      .chip .k { font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .62; }
      .chip .sep { width: 1px; height: 24px; background: currentColor; opacity: .22; }
      .chip .v { font-weight: 600; letter-spacing: -0.01em; }

      /* dateline under the chip: the "evidence" line (mono = data/terminal; rockstar = official date style) */
      .date { margin: 18px 0 0 4px; font-size: 28px; line-height: 1.2; white-space: nowrap; text-transform: uppercase; }
      .date.mono { font-family: "JetBrains Mono", monospace; font-weight: 500; letter-spacing: .04em; opacity: .66; }
      .date.rockstar { font-weight: 600; letter-spacing: .35em; color: #fff;
        text-shadow: 2px 0 0 var(--r-magenta), 0 0 14px rgba(238,8,242,.30); }

      .claim { margin-top: 16px; font-weight: 800; font-size: 80px; line-height: 1.02; letter-spacing: -0.032em; text-wrap: balance; }

      /* ---- the stamp: one construction for both states (20 px radius, inner hairline at 9 px inset) ---- */
      #stamp { position: absolute; transform-origin: 50% 50%; }
      #unit.top #stamp { right: 8px; top: calc(100% - 64px); }   /* stamp edge meets the card edge */
      #unit.bottom #stamp { right: 34px; bottom: calc(100% - 60px); }
      .st-back { position: absolute; inset: 0; border-radius: 20px; }
      .st-ink { position: relative; display: flex; align-items: center; gap: 22px; padding: 16px 34px 14px 30px; border-radius: 20px; }
      /* gradient-capable rules: a filled box with its content box masked out */
      .st-edge, .st-hair { position: absolute; pointer-events: none; background: var(--fill);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
        mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
      .st-edge { inset: 0; border-radius: 20px; padding: 4px; }
      .st-hair { inset: 9px; border-radius: 11px; padding: 1.5px; }
      .st-txt { display: flex; flex-direction: column; }
      .st-kick { font-weight: 600; font-size: 28px; line-height: 1; letter-spacing: .32em; text-transform: uppercase; margin: 4px 0 6px 2px; }
      .st-word { font-family: "Barlow Condensed", sans-serif; font-weight: 900; font-size: 104px; line-height: .9; letter-spacing: .035em;
        text-transform: uppercase; white-space: nowrap; }
      .st-mark { flex: none; width: 92px; height: 92px; display: block; }

      /* outline stamp (rumor): clean sunset-ink rules + sunset word on a smoked backing */
      .s-outline .st-back { background: rgba(14,14,20,.74); -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3);
        box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 24px 60px -20px rgba(0,0,0,.7); }
      .no-plate .s-outline .st-back { background: rgba(14,14,20,.84); }
      .s-outline .st-kick { color: #fff; opacity: .84; }
      .s-outline .st-word { color: var(--sc); }
      .s-outline.grad .st-word { background: var(--fill); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

      /* solid seal (official): teal fill, navy ink, navy inner hairline */
      .s-solid .st-back { background: var(--sc); box-shadow: 0 1px 2px rgba(0,0,0,.32), 0 12px 26px -12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.35); }
      .s-solid .st-ink { color: var(--navy); }
      .s-solid .st-edge { display: none; }
      .s-solid .st-hair { --fill: rgba(31,32,43,.34); padding: 2px; }
      .s-solid .st-kick { opacity: .72; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1080" data-height="1920">
      <!-- sample footage: one framework-owned muted video per variant; the script hides all but the one CONFIG names -->
      <div id="cam">
        <video id="plateA" class="clip plate" src="assets/plates/p01-keys-sign-v.mp4" muted playsinline data-start="0" data-duration="7" data-track-index="0"></video>
        <video id="plateB" class="clip plate" src="assets/plates/p06-lucia-gate-v.mp4" muted playsinline data-start="0" data-duration="7" data-track-index="0"></video>
      </div>

      <div id="ov" class="clip" data-start="0" data-duration="7" data-track-index="1">
        <div id="unit">
          <div id="hit">
            <div id="card">
              <div class="chip" id="chip">
                <svg class="ic" id="chipIc" viewBox="0 0 32 32"></svg>
                <span class="k" id="chipK"></span><span class="sep"></span><span class="v" id="chipV"></span>
              </div>
              <div class="date" id="date"></div>
              <div class="claim" id="claim"></div>
            </div>
          </div>
          <div id="stamp">
            <div class="st-back"></div>
            <div class="st-edge"></div>
            <div class="st-hair"></div>
            <div class="st-ink" id="ink">
              <svg class="st-mark" id="mark" viewBox="0 0 92 92" style="display:none">
                <circle cx="46" cy="46" r="40" fill="none" stroke="currentColor" stroke-width="7" />
                <path id="tick" d="M27 47.5 L40.5 60 L65 33" fill="none" stroke="currentColor" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <div class="st-txt">
                <div class="st-kick" id="kick"></div>
                <div class="st-word" id="word"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const CONFIG = {
        variants: {
          "0": {
            name: "Unconfirmed",
            plate: "assets/plates/p01-keys-sign-v.mp4",
            theme: "smoke",          // "smoke" (smoked glass, white type) | "navy" (ink-navy, white type) | "paper" (white card, ink type)
            placement: "top",        // "top": card in the hook band, stamp hangs off its bottom edge | "bottom": card above the captions, stamp on its top edge
            source: { label: "Source", name: "Unverified X post", icon: "question" },  // icon: "question" | "check"
            date: { text: "Posted · Nov 18, 2026", style: "mono" },   // creator fill: when the claim surfaced. style: "mono" | "rockstar"
            claim: "GTA 6 is coming to PC in 2027",   // creator fill: the rumor you are covering (demo only; no PC date is announced)
            stamp: { kicker: "Rumor / leak", word: "Unconfirmed", style: "outline", color: "#FEB747",
                     gradient: ["#F84FA4", "#FE8E4E", "#FEB747"],   // Leonida sunset (pink → amber); omit for a solid-colour outline
                     rotate: -4, check: false }
          },
          "1": {
            name: "Confirmed",
            plate: "assets/plates/p06-lucia-gate-v.mp4",
            theme: "navy",
            placement: "bottom",
            source: { label: "Source", name: "Rockstar Games", icon: "check" },
            date: { text: "Verified · Nov 18, 2026", style: "rockstar" },   // the day the creator checked it (FACTS.md, checked 2026-11-18)
            claim: "GTA 6 launches November 19, 2026",
            stamp: { kicker: "Official", word: "Confirmed", style: "solid", color: "#2EC4B6", rotate: -3, check: true }
          }
        },
        timing: { cardIn: 0.2, cardDur: 0.32, stamp: 0.40, out: 6.55, end: 7.0 },   // the stamp lands while the card finishes settling
        impact: { scaleFrom: 1.15, settleFrames: 3, shake: 6 }   // stamp appears at full opacity, 1.15 → 1 over 3 frames; footage shake ≤ 8 px
      };

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const vKey = CONFIG.variants[String(VARS.variant)] ? String(VARS.variant) : "0";
        const showPlate = VARS.bg !== "none";
        const V = CONFIG.variants[vKey], T = CONFIG.timing, I = CONFIG.impact, S = V.stamp;
        const F = 1 / 30;
        const $ = (s) => document.querySelector(s);

        document.querySelectorAll("video.plate").forEach((v) => {
          if (!showPlate || v.getAttribute("src") !== V.plate) v.style.display = "none";
        });
        if (!showPlate) { $("#cam").style.display = "none"; $("#root").classList.add("no-plate"); }

        // ---- content ----
        const unit = $("#unit");
        unit.classList.add(V.placement === "bottom" ? "bottom" : "top", ["navy", "paper"].includes(V.theme) ? V.theme : "smoke");
        $("#chipK").textContent = V.source.label;
        $("#chipV").textContent = V.source.name;
        const ic = V.source.icon === "check"
          ? `<circle cx="16" cy="16" r="16" fill="${S.color}"/><path d="M9.5 16.5 L14 21 L22.5 11.5" fill="none" stroke="#1F202B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>`
          : `<circle cx="16" cy="16" r="16" fill="${S.color}"/><path d="M11.8 12.4 C11.8 9.8 13.7 8.2 16.1 8.2 C18.6 8.2 20.3 9.8 20.3 11.9 C20.3 13.8 19.1 14.8 17.7 15.7 C16.6 16.4 16.1 17.1 16.1 18.4 V19" fill="none" stroke="#1F202B" stroke-width="3.1" stroke-linecap="round"/><circle cx="16.1" cy="23.6" r="2" fill="#1F202B"/>`;
        $("#chipIc").innerHTML = ic;
        const date = $("#date");
        if (V.date && V.date.text) { date.textContent = V.date.text; date.classList.add(V.date.style === "rockstar" ? "rockstar" : "mono"); }
        else date.style.display = "none";
        $("#claim").textContent = V.claim;
        $("#kick").textContent = S.kicker;
        $("#word").textContent = S.word;
        const stamp = $("#stamp");
        stamp.classList.add(S.style === "solid" ? "s-solid" : "s-outline");
        stamp.style.setProperty("--sc", S.color);
        const g = Array.isArray(S.gradient) && S.gradient.length > 1 && S.style !== "solid";
        stamp.style.setProperty("--fill", g ? `linear-gradient(90deg, ${S.gradient.join(", ")})` : `linear-gradient(${S.color}, ${S.color})`);
        if (g) stamp.classList.add("grad");
        if (S.check) $("#mark").style.display = "block";

        document.fonts.ready.then(() => {
          // ---- fit: keep the claim ≤ 3 lines and the stamp inside the card width ----
          const claim = $("#claim");
          let fs = 80;
          while (claim.getBoundingClientRect().height > fs * 1.02 * 3 + 2 && fs > 56) { fs -= 2; claim.style.fontSize = fs + "px"; }
          const word = $("#word"), maxW = 864 - 68;
          let ws = 104;
          while (stamp.getBoundingClientRect().width > maxW && ws > 64) { ws -= 4; word.style.fontSize = ws + "px"; }

          const tl = gsap.timeline({ paused: true });
          const dir = V.placement === "bottom" ? 1 : -1;
          const TS = T.stamp;

          // 1) card rises in as one object (y +24 → 0, opacity 0 → 1), its content settles with it
          gsap.set("#card", { opacity: 0, y: 24 });
          tl.fromTo("#card", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: T.cardDur, ease: "expo.out", immediateRender: false }, T.cardIn);
          gsap.set(["#chip", "#date", "#claim"], { opacity: 0, y: 12 });
          tl.fromTo("#chip", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.26, ease: "power3.out", immediateRender: false }, T.cardIn + 0.02);
          tl.fromTo("#date", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.26, ease: "power3.out", immediateRender: false }, T.cardIn + 0.04);
          tl.fromTo("#claim", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.28, ease: "power3.out", immediateRender: false }, T.cardIn + 0.05);

          // 2) the stamp: appears at full opacity on ONE impact frame, scale 1.15 → 1 over 3 frames,
          //    with a footage shake (plate mode) and a card nudge (works with bg:"none" too)
          gsap.set(stamp, { opacity: 0, scale: I.scaleFrom, rotation: S.rotate });
          tl.set(stamp, { opacity: 1 }, TS);
          tl.fromTo(stamp, { scale: I.scaleFrom }, { scale: 1, duration: I.settleFrames * F, ease: "power2.out", immediateRender: false }, TS);
          tl.fromTo("#hit", { y: 0 }, { y: 7 * -dir, duration: F, ease: "none", immediateRender: false }, TS);
          tl.to("#hit", { y: 0, duration: 5 * F, ease: "power3.out" }, TS + F);
          if (showPlate) {
            const s = I.shake;
            [[s, -s * 0.66], [-s * 0.83, s * 0.5], [s * 0.5, -s * 0.33], [-s * 0.25, s * 0.16], [0, 0]].forEach(([x, y], i) => {
              tl.set("#cam", { x: +x.toFixed(2), y: +y.toFixed(2) }, TS + i * F);
            });
          }
          // confirmed: the check draws once the seal has landed
          if (S.check) {
            const tick = $("#tick"), L = tick.getTotalLength();
            gsap.set(tick, { strokeDasharray: L, strokeDashoffset: L });
            tl.fromTo(tick, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.28, ease: "power2.out", immediateRender: false }, TS + 0.1);
          }

          // 3) clear cleanly so it loops
          tl.fromTo("#unit", { opacity: 1, y: 0 }, { opacity: 0, y: 18 * dir, duration: 0.35, ease: "power2.in", immediateRender: false }, T.out);
          tl.set({}, {}, T.end);

          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  </body>
</html>
