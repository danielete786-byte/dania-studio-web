<!doctype html>
<!-- GTA 6 component #49 "Follow CTA" (Calls to action) — 1080x1920 (9:16), 30 fps, 7 s.
     Variables: variant "0" Follow button / "1" Next part card; bg "plate" (sample GTA VI footage underneath) / "none" (transparent overlay).
     Everything is centred on the frame (x 144–936) so it stays inside the 9:16 safe zone (x 72–936, y 230–1480). -->
<html lang="en" data-composition-variables='[
  {"id":"variant","type":"enum","label":"Variant","default":"0","options":[{"value":"0","label":"Follow button"},{"value":"1","label":"Next part card"}]},
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/kit/motion/motion.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; font-feature-settings: "tnum" 1, "ss01" 1; }
      .plate { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ov { position: absolute; inset: 0; }
      /* tokens — see gta6/DESIGN.md */
      :root {
        --ink: #0B0B0E; --paper: #FFFFFF; --navy: #1F202B; --teal: #2EC4B6;
        --smoke: rgba(14,14,20,0.62);
        --sunset: linear-gradient(90deg, #F84FA4 0%, #FE8E4E 50%, #FEB747 100%);
        --hair: rgba(255,255,255,.14);
        --shadow-type: 0 2px 2px rgba(0,0,0,.35), 0 6px 24px rgba(0,0,0,.45);
        --shadow-card: 0 1px 2px rgba(0,0,0,.30), 0 2px 6px rgba(0,0,0,.18), 0 40px 90px -28px rgba(0,0,0,.70);
        --shadow-pill: 0 1px 2px rgba(0,0,0,.25), 0 10px 26px -8px rgba(0,0,0,.45);
      }

      .variant { position: absolute; inset: 0; display: none; }
      .scrim { position: absolute; left: 0; right: 0; top: 0; height: 980px; opacity: 0;
        background: linear-gradient(180deg, rgba(4,4,10,.50) 0%, rgba(4,4,10,.30) 45%, rgba(4,4,10,0) 100%); }

      /* ---- headline block (shared) ---- */
      .head { position: absolute; left: 144px; width: 792px; text-align: center; color: #fff; }
      .kicker { font-weight: 600; font-size: 28px; letter-spacing: .36em; text-transform: uppercase; line-height: 1;
        padding-left: .36em; text-shadow: var(--shadow-type); }
      .hl { margin-top: 26px; font-family: "Barlow Condensed", sans-serif; font-weight: 900; font-size: 104px;
        line-height: .94; letter-spacing: .02em; text-transform: uppercase; }
      .hl .line { display: block; overflow: hidden; padding: 4px 0 6px; }
      .hl .line > span { display: inline-block; text-shadow: var(--shadow-type); }
      .hl .line > span.grad { background: linear-gradient(90deg, #F84FA4 0%, #FE8E4E 25%, #FEB747 50%, #FE8E4E 75%, #F84FA4 100%);
        background-size: 200% 100%; background-position: 0% 50%;
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
        text-shadow: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)) drop-shadow(0 6px 18px rgba(0,0,0,.40)); }

      /* ---- variant 0: profile card with follow button ---- */
      .pcard { position: absolute; left: 144px; width: 792px; padding: 40px; border-radius: 36px; color: #fff;
        background: var(--smoke); -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.16), inset 0 0 0 1px var(--hair), var(--shadow-card); }
      .prow { display: flex; align-items: center; gap: 28px; }
      .avatar { position: relative; flex: 0 0 auto; width: 120px; height: 120px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        background: linear-gradient(160deg, #2C2E3D 0%, #1F202B 70%); box-shadow: inset 0 0 0 2px rgba(255,255,255,.85), 0 8px 24px rgba(0,0,0,.35); }
      .avatar > span { font-weight: 800; font-size: 40px; letter-spacing: -0.02em; }
      /* TikTok-style follow badge on the avatar: white "+" that flips to a teal check on follow */
      .badge { position: absolute; right: -6px; bottom: -6px; width: 44px; height: 44px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px #17171f, 0 4px 10px rgba(0,0,0,.35); }
      .badge svg { width: 22px; height: 22px; }
      .badge-a { background: #fff; color: var(--ink); }
      .badge-b { background: var(--teal); color: var(--ink); opacity: 0; }
      .pmeta { min-width: 0; flex: 1 1 auto; }
      .handle { font-weight: 700; font-size: 40px; letter-spacing: -0.02em; line-height: 1.1; white-space: nowrap; }
      .hwrap { position: relative; display: inline-block; }
      /* second beat: the handle becomes a link (white hairline sweep; the sunset stays on "PART 2" only) */
      .uline { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 1px; background: rgba(255,255,255,.92);
        transform-origin: 0% 50%; transform: scaleX(0); }
      .sub { position: relative; margin-top: 8px; height: 34px; font-weight: 500; font-size: 28px; line-height: 1.2; white-space: nowrap; }
      .sub > span { position: absolute; left: 0; top: 0; }
      .sub .sub-a { color: rgba(255,255,255,.66); }
      .sub .sub-b { color: #fff; font-weight: 600; opacity: 0; }
      .fbtn { position: relative; margin-top: 36px; height: 120px; border-radius: 60px; }
      .fclip { position: absolute; inset: 0; border-radius: 60px; overflow: hidden; }
      .face { position: absolute; inset: 0; border-radius: 60px; display: flex; align-items: center; justify-content: center; gap: 18px;
        font-weight: 800; font-size: 40px; letter-spacing: -0.02em; }
      .face svg { width: 40px; height: 40px; flex: 0 0 auto; }
      .face-a { background: #fff; color: var(--ink); box-shadow: var(--shadow-pill); }
      /* "Following": the app's grey-glass state. Teal only on the check glyph (and the avatar badge). */
      .face-b { background: rgba(255,255,255,.16); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.22);
        clip-path: circle(0px at 50% 50%); }
      .face-b svg { color: var(--teal); }
      .touch { position: absolute; width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 50%; opacity: 0;
        background: rgba(11,11,14,.18); box-shadow: inset 0 0 0 2px #fff, 0 0 0 1px rgba(11,11,14,.22), 0 6px 22px rgba(0,0,0,.35); }
      /* route to Part 2: arrow under the card points down at the creator's handle in the app UI */
      .darrow { position: absolute; left: 508px; width: 64px; height: 64px; opacity: 0; }
      .darrow svg { width: 64px; height: 64px; display: block; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)) drop-shadow(0 6px 16px rgba(0,0,0,.4)); }

      /* ---- variant 1: next-part card ---- */
      .ncard { position: absolute; left: 144px; width: 792px; padding: 18px; border-radius: 36px; color: #fff;
        background: var(--navy); box-shadow: inset 0 1px 0 rgba(255,255,255,.10), inset 0 0 0 1px rgba(255,255,255,.08), var(--shadow-card); }
      .thumb { position: relative; width: 756px; height: 425px; border-radius: 20px; overflow: hidden; background: #0d0d12; }
      .thumb .tv { position: absolute; inset: 0; }
      .thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .thumb::after { content: ""; position: absolute; inset: 0; border-radius: 20px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.10);
        background: linear-gradient(180deg, rgba(0,0,0,.28) 0%, rgba(0,0,0,0) 34%, rgba(0,0,0,0) 70%, rgba(0,0,0,.25) 100%); }
      .chip { position: absolute; left: 22px; top: 22px; z-index: 2; height: 52px; border-radius: 26px; overflow: hidden;
        font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-size: 28px; letter-spacing: .06em; text-transform: uppercase;
        background: rgba(14,14,20,.62); -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 0 0 1px rgba(255,255,255,.14); }
      .chip > span { position: absolute; left: 20px; top: 0; width: max-content; height: 52px; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
      /* Next -> Out now is an opaque wipe + label roll (no crossfade) */
      .chip .chip-bg { position: absolute; inset: 0; border-radius: 26px; background: #fff; clip-path: inset(0 100% 0 0 round 26px); }
      .chip .chip-b { color: var(--ink); transform: translateY(52px); }
      .play { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; z-index: 2; border-radius: 50%;
        background: rgba(14,14,20,.42); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
        box-shadow: 0 10px 30px rgba(0,0,0,.35); }
      .play .ring { position: absolute; inset: 0; width: 120px; height: 120px; transform: rotate(-90deg); }
      .play .ico { position: absolute; left: 38px; top: 38px; width: 44px; height: 44px; }
      .play .ico-play { margin-left: 4px; }
      .nbody { padding: 26px 18px 16px; }
      .nmeta { display: flex; align-items: center; justify-content: space-between; font-size: 28px; line-height: 1; }
      /* handle + route sit at 62% white through the countdown, then light up to 100% when Part 2 reads "Out now" */
      .nmeta .by { font-weight: 600; color: rgba(255,255,255,.62); letter-spacing: -0.01em; }
      .route { display: flex; align-items: center; gap: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.62); }
      .route svg { width: 28px; height: 28px; flex: 0 0 auto; }
      .ntitle { margin-top: 18px; font-weight: 800; font-size: 44px; line-height: 1.14; letter-spacing: -0.025em; }
      .bar { position: relative; margin-top: 28px; height: 12px; border-radius: 6px; background: rgba(255,255,255,.14); overflow: hidden; }
      .bar .fill { position: absolute; inset: 0; border-radius: 6px; background: var(--sunset); transform-origin: 0% 50%; transform: scaleX(0); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1080" data-height="1920">
      <!-- sample footage: one framework-owned muted video per plate; the script hides all but the one the variant names -->
      <video id="plateA" class="clip plate" src="assets/plates/p04-driveby-mural-v.mp4" muted playsinline data-start="0" data-duration="7" data-track-index="0"></video>
      <video id="plateB" class="clip plate" src="assets/plates/p01-keys-sign-v.mp4" muted playsinline data-start="0" data-duration="7" data-track-index="0"></video>

      <div id="ov">
        <!-- ===== Variant 0 · Follow button ===== -->
        <div class="variant" id="v0">
          <div class="scrim" id="scrim0"></div>
          <div class="head" id="head0" style="top: 420px;">
            <div class="kicker" id="kick0"></div>
            <div class="hl">
              <div class="line"><span id="hl0a"></span></div>
              <div class="line"><span id="hl0b" class="grad"></span></div>
            </div>
          </div>
          <div class="pcard" id="pcard" style="top: 772px;">
            <div class="prow">
              <div class="avatar" id="avatar">
                <span id="avatarTxt"></span>
                <div class="badge badge-a" id="badgeA"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M11 4v14M4 11h14"/></svg></div>
                <div class="badge badge-b" id="badgeB"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11.5l4.2 4.2 8.8-9.2"/></svg></div>
              </div>
              <div class="pmeta">
                <div class="handle"><span class="hwrap"><span id="handle0"></span><i class="uline" id="uline0"></i></span></div>

              <div class="fclip" data-layout-allow-overlap>
                <div class="face face-a" id="faceA">
                  <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"><path d="M20 8v24M8 20h24"/></svg>

          </div>

        <!-- ===== Variant 1 · Next part card ===== -->
        <div class="variant" id="v1">
          <div class="scrim" id="scrim1"></div>
          <div class="head" id="head1" style="top: 300px;">
            <div class="kicker" id="kick1"></div>
            <div class="hl">
              <div class="line"><span id="hl1a"></span></div>
              <div class="line"><span id="hl1b"></span></div>
            </div>
          </div>
          <div class="ncard" id="ncard" style="top: 630px;">
            <div class="thumb" id="thumb">
              <div class="tv" id="tv">
                <!-- src is set from CONFIG.variants["1"].thumb by the script -->
                <video id="thumbClip" class="clip" src="assets/plates/p06-lucia-gate-h.mp4" muted playsinline data-start="0" data-duration="7" data-track-index="2"></video>
              </div>
              <div class="chip" id="chip">
                <div class="chip-bg" id="chipBg"></div>
                <span class="chip-a" id="chipA"></span>
                <span class="chip-b" id="chipB"></span>
              </div>
              <div class="play" id="play">
                <!-- static 30% ring: the sunset bar below is the only countdown -->
                <svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="57" fill="none" stroke="rgba(255,255,255,.30)" stroke-width="6"/></svg>
                <svg class="ico ico-play" id="icoPlay" viewBox="0 0 44 44"><path d="M10 5.5v33a2 2 0 0 0 3 1.7l27-16.5a2 2 0 0 0 0-3.4L13 3.8a2 2 0 0 0-3 1.7z" fill="#fff"/></svg>
              </div>
            </div>
            <div class="nbody">
              <div class="nmeta" id="nmeta">
                <span class="by" id="by1"></span>
                <span class="route" id="route"><span id="routeTxt"></span>
                  <svg id="routeArrow" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v19M6 15.5l8 8 8-8"/></svg>
                </span>

              <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const CONFIG = {
        handle: "@everestchris6",          // your channel handle (both variants)
        variants: {
          "0": {                            // Follow button
            plate: "assets/plates/p04-driveby-mural-v.mp4",
            kicker: "Thanks for watching",
            headline: ["Follow for", "Part 2"], // line 2 carries the sunset gradient
            avatar: "EC",                   // monogram in the avatar circle
            sub: "GTA 6 clips, every day",  // pitch under the handle (before the press)
            subDone: "Part 2 drops on my page", // second beat: replaces `sub` after the follow lands
            subDoneAt: 2.6,                 // seconds
            routeAt: 3.2,                   // third beat: handle underline sweeps + arrow under the card starts bobbing
            button: "Follow",
            buttonDone: "Following",
            tap: { x: 0.84, at: 1.5 }       // tap point across the button (0–1, kept right of the label) and press time (s)
          },
          "1": {                            // Next part card
            plate: "assets/plates/p01-keys-sign-v.mp4",
            thumb: "assets/plates/p06-lucia-gate-h.mp4", // preview clip of the next part (set on #thumbClip at load)
            kicker: "End of Part 1",
            headline: ["Part 2 is", "up next"],
            chip: "Next",                   // thumbnail chip while the bar counts down
            chipDone: "Out now",            // chip when the bar completes (white chip, ink text)
            route: "On my page",            // where Part 2 lives; the arrow points down at your handle in the app UI
            title: "Every Vice City spot hidden in the Launch Trailer",
            countFrom: 4,                   // countdown length in seconds (the sunset bar)
            countStart: 0.9                 // seconds
          }
        },
        timing: { in: 0.15, out: 6.55, end: 7.0 }
      };

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const vKey = CONFIG.variants[String(VARS.variant)] ? String(VARS.variant) : "0";
        const showPlate = VARS.bg !== "none";
        const V = CONFIG.variants[vKey], T = CONFIG.timing;
        const $ = (s) => document.querySelector(s);

        document.querySelectorAll("video.plate").forEach((v) => {
          if (!showPlate || v.getAttribute("src") !== V.plate) v.style.display = "none";
        });
        // next-part preview clip comes from CONFIG
        const thumbSrc = CONFIG.variants["1"].thumb, th = $("#thumbClip");
        if (thumbSrc && th.getAttribute("src") !== thumbSrc) th.setAttribute("src", thumbSrc);
        $("#v" + vKey).style.display = "block";

        if (vKey === "0") {
          $("#kick0").textContent = V.kicker;
          $("#hl0a").textContent = V.headline[0];
          $("#hl0b").textContent = V.headline[1];
          $("#avatarTxt").textContent = V.avatar;
          $("#handle0").textContent = CONFIG.handle;
          $("#subA").textContent = V.sub;
          $("#subB").textContent = V.subDone;
          $("#btnTxt").textContent = V.button;
          $("#btnDoneTxt").textContent = V.buttonDone;
        } else {
          $("#kick1").textContent = V.kicker;
          $("#hl1a").textContent = V.headline[0];
          $("#hl1b").textContent = V.headline[1];
          $("#chipA").textContent = V.chip;
          $("#chipB").textContent = V.chipDone;
          $("#by1").textContent = CONFIG.handle;
          $("#routeTxt").textContent = V.route;
          $("#ntitle").textContent = V.title;
        }

        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true });
          const v = "#v" + vKey;
          const head = "#head" + vKey, card = vKey === "0" ? "#pcard" : "#ncard";
          const lines = document.querySelectorAll(v + " .hl .line > span");

          // shared entrance: scrim, kicker, headline lines (masked rise), then the card
          tl.fromTo("#scrim" + vKey, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, T.in);
          tl.fromTo("#kick" + vKey, { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, T.in);
          gsap.set("#kick" + vKey, { opacity: 0 });
          lines.forEach((el, i) => {
            gsap.set(el, { yPercent: 110 });
            tl.fromTo(el, { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: "expo.out", immediateRender: false }, T.in + 0.1 + i * 0.09);
          });
          // card: opacity lands fast (0.18 s) so the card body is solid before its contents arrive; y/scale glide on expo.out
          gsap.set(card, { opacity: 0, y: 90, scale: 0.97 });
          tl.fromTo(card, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out", immediateRender: false }, 0.6);
          tl.fromTo(card, { y: 90, scale: 0.97 }, { y: 0, scale: 1, duration: 0.55, ease: "expo.out", immediateRender: false }, 0.6);

          if (vKey === "0") {
            // sunset sweep drifts across "PART 2" for the whole hold
            tl.fromTo("#hl0b", { backgroundPosition: "0% 50%" }, { backgroundPosition: "100% 50%", duration: T.out - 0.35, ease: "none", immediateRender: false }, 0.35);
            gsap.set("#avatar", { scale: 0.86, opacity: 0 });
            tl.fromTo("#avatar", { scale: 0.86, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.5)", immediateRender: false }, 0.74);
            gsap.set(["#handle0", "#sub0", "#fbtn"], { opacity: 0, y: 14 });
            tl.fromTo("#handle0", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, 0.8);
            tl.fromTo("#sub0", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, 0.86);
            // the button arrives after the profile row, never floating on its own
            tl.fromTo("#fbtn", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, 0.92);

            // tap geometry, measured from layout (card-relative)
            const btn = $("#fbtn"), fw = btn.offsetWidth, fh = btn.offsetHeight;
            const cx = fw * V.tap.x, cy = fh * 0.5;
            gsap.set("#touch", { left: btn.offsetLeft + cx, top: btn.offsetTop + cy });
            const P = V.tap.at;
            const check = $("#checkPath"); const len = Math.ceil(check.getTotalLength()) + 1;
            check.style.strokeDasharray = len; gsap.set(check, { strokeDashoffset: len });

            // finger arrives, presses, releases
            gsap.set("#touch", { opacity: 0, scale: 1.45 });
            tl.fromTo("#touch", { opacity: 0, scale: 1.45 }, { opacity: 1, scale: 1, duration: 0.26, ease: "power3.out", immediateRender: false }, P - 0.34);
            tl.fromTo("#touch", { scale: 1 }, { scale: 0.78, duration: 0.1, ease: "power2.out", immediateRender: false }, P);
            tl.fromTo("#fbtn", { scale: 1 }, { scale: 0.95, duration: 0.1, ease: "power2.out", immediateRender: false }, P);
            // release overshoots into the success settle: 0.95 -> 1.04 -> 1
            tl.fromTo("#fbtn", { scale: 0.95 }, { scale: 1.04, duration: 0.2, ease: "power2.out", immediateRender: false }, P + 0.12);
            tl.fromTo("#fbtn", { scale: 1.04 }, { scale: 1, duration: 0.32, ease: "power2.inOut", immediateRender: false }, P + 0.32);
            tl.fromTo("#touch", { scale: 0.78, opacity: 1 }, { scale: 1.25, opacity: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, P + 0.1);
            // state change: Follow (white) -> Following (grey glass), as ONE opaque wipe from the tap point.
            // Both faces stay at full opacity: the glass face is clipped to a growing circle while the white face is
            // masked out by the same circle, so every pixel shows exactly one face (no translucent ghost, no double label).
            const faceA = $("#faceA"), faceB = $("#faceB");
            const R = Math.ceil(Math.hypot(Math.max(cx, fw - cx), Math.max(cy, fh - cy))) + 8;
            // once the circle has passed the white face's label, hide that label outright (it is fully masked by then)
            const aIco = faceA.querySelector("svg"), aTxt = $("#btnTxt");
            // (SVG has no offsetLeft: the icon's left edge is the label's left minus the 40 px icon and 18 px gap)
            const RL = Math.hypot(cx - (aTxt.offsetLeft - 58), cy - aTxt.offsetTop) + 2;
            const wipe = gsap.parseEase("power3.out");
            const setWipe = (r) => {
              faceB.style.clipPath = "circle(" + (r > 0 ? (r + 1).toFixed(2) : 0) + "px at " + cx.toFixed(1) + "px " + cy.toFixed(1) + "px)";
              const m = r > 0 ? "radial-gradient(circle at " + cx.toFixed(1) + "px " + cy.toFixed(1) + "px, transparent " + r.toFixed(2) + "px, #000 " + (r + 1).toFixed(2) + "px)" : "none";
              faceA.style.webkitMaskImage = m; faceA.style.maskImage = m;
              // "" (not "visible"), so the children inherit the parent's hidden state instead of overriding it
              faceA.style.visibility = r >= R ? "hidden" : "";
              aIco.style.visibility = aTxt.style.visibility = r >= RL ? "hidden" : "";
            };
            setWipe(0);
            KitMotion.drive(tl, P + 0.1, 0.36, (p) => setWipe(wipe(p) * R));
            tl.fromTo(check, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, P + 0.24);
            // avatar badge flips + -> check with the button
            tl.fromTo("#badgeA", { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.6, duration: 0.15, ease: "power2.in", immediateRender: false }, P + 0.2);
            gsap.set("#badgeB", { opacity: 0, scale: 0.6 });
            tl.fromTo("#badgeB", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, P + 0.3);

            // second beat: the pitch becomes the route to Part 2
            const S = V.subDoneAt;
            tl.fromTo("#subA", { opacity: 1, y: 0 }, { opacity: 0, y: -10, duration: 0.18, ease: "power2.in", immediateRender: false }, S - 0.12);
            gsap.set("#subB", { opacity: 0, y: 14 });
            tl.fromTo("#subB", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, S);

            // third beat: the handle becomes a link (white hairline sweep), and an arrow under the card
            // points down at the creator's handle in the app UI, bobbing in pairs through the hold
            const Rt = V.routeAt;
            tl.fromTo("#uline0", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.inOut", immediateRender: false }, Rt);
            const pc = $("#pcard");
            gsap.set("#darrow", { top: pc.offsetTop + pc.offsetHeight + 34, opacity: 0, y: -12 });
            tl.fromTo("#darrow", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, Rt + 0.1);
            const dsvg = $("#darrowSvg"), B0 = Rt + 0.45, BL = T.out - B0;
            KitMotion.drive(tl, B0, BL, (p) => {
              const t = p * BL, cyc = t % 1.6;          // 2 bobs (0.45 s each), then 0.7 s rest
              const y = cyc < 0.9 ? Math.sin(Math.PI * (cyc % 0.45) / 0.45) * 8 : 0;
              dsvg.style.transform = "translateY(" + y.toFixed(2) + "px)";
            });
          } else {
            gsap.set("#thumbClip", { scale: 1.08 });
            tl.fromTo("#thumbClip", { scale: 1.08 }, { scale: 1, duration: 1.0, ease: "power3.out", immediateRender: false }, 0.6);

            // chip width follows its label (Next -> Out now)
            const chipA = $("#chipA"), chipB = $("#chipB");
            const wA = chipA.offsetWidth + 40, wB = chipB.offsetWidth + 40;
            gsap.set("#chip", { width: wA });
            gsap.set(["#chip", "#play"], { scale: 0.86, opacity: 0 });
            tl.fromTo("#chip", { scale: 0.86, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.5)", immediateRender: false }, 0.86);
            tl.fromTo("#play", { scale: 0.86, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.5)", immediateRender: false }, 0.8);
            gsap.set(["#nmeta", "#ntitle", "#bar"], { opacity: 0, y: 14 });
            tl.fromTo("#nmeta", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, 0.72);
            tl.fromTo("#ntitle", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, 0.79);
            tl.fromTo("#bar", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, 0.86);

            // countdown: ONE signal, the 12 px sunset bar, linear over N s (the ring round the play button is a static 30% track)
            const C0 = V.countStart, N = V.countFrom, D = C0 + N;
            tl.fromTo("#fill", { scaleX: 0 }, { scaleX: 1, duration: N, ease: "none", immediateRender: false }, C0);

            // payoff at D: nothing pretends to autoplay. Chip flips NEXT -> OUT NOW (white chip, ink text), the play
            // button keeps its play icon and pulses once, the preview lifts slightly, and the route to Part 2 lights up.
            tl.fromTo("#play", { scale: 1 }, { scale: 1.07, duration: 0.18, ease: "power2.out", immediateRender: false }, D);
            tl.fromTo("#play", { scale: 1.07 }, { scale: 1, duration: 0.4, ease: "power2.inOut", immediateRender: false }, D + 0.18);
            tl.fromTo("#tv", { filter: "brightness(1)" }, { filter: "brightness(1.08)", duration: 0.25, ease: "power1.out", immediateRender: false }, D + 0.05);
            tl.fromTo("#chipA", { y: 0 }, { y: -52, duration: 0.2, ease: "power2.in", immediateRender: false }, D);
            tl.fromTo("#chip", { width: wA }, { width: wB, duration: 0.3, ease: "power3.inOut", immediateRender: false }, D + 0.05);
            tl.fromTo("#chipBg", { clipPath: "inset(0% 100% 0% 0% round 26px)" }, { clipPath: "inset(0% 0% 0% 0% round 26px)", duration: 0.28, ease: "power3.out", immediateRender: false }, D + 0.08);
            gsap.set("#chipB", { y: 52 });
            tl.fromTo("#chipB", { y: 52 }, { y: 0, duration: 0.32, ease: "power3.out", immediateRender: false }, D + 0.16);
            tl.fromTo(["#by1", "#route"], { color: "rgba(255,255,255,0.62)" }, { color: "rgba(255,255,255,1)", duration: 0.3, ease: "power1.out", immediateRender: false }, D + 0.05);
            // the route arrow points down at the handle in the app UI: 2 bobs of 10 px once Part 2 is out
            const arrow = $("#routeArrow"), A0 = D + 0.2;
            KitMotion.drive(tl, A0, 0.9, (p) => {
              const t = p * 0.9, ph = t % 0.45;
              const y = p >= 1 ? 0 : Math.sin(Math.PI * ph / 0.45) * 10;
              arrow.style.transform = "translateY(" + y.toFixed(2) + "px)";
            });
          }

          // clean exit for the loop
          const outEls = vKey === "0" ? [head, card, "#darrow"] : [head, card];
          tl.fromTo(outEls, { opacity: 1, y: 0 }, { opacity: 0, y: -28, duration: 0.35, ease: "power2.in", immediateRender: false }, T.out);
          tl.fromTo("#scrim" + vKey, { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false }, T.out);
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  </body>
</html>
