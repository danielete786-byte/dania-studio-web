<!doctype html>
<!-- GTA 6 component #3: Hook title (craft v2). 1080x1920 (9:16), 30 fps, 7 s.
     The opening hook of a short, in the top third, one keyword accented. It lands on the edit's first cut.
     Variables: variant "0" Boxed lines (TikTok-style merged text slabs with room around each line: a 72 px lead-in tab over
                                        two ~196 px lines; the stack is an object (lit top edge, contact shadow); the keyword's
                                        slab slams 1.12 -> 1 on the cut as it ignites with the sunset, its light screened onto
                                        the footage and bounced onto the paper, and it re-hits on every later cut) /
                "1" Official caps (Rockstar-style wide caps set left in the sky of full-bleed footage; the whole hook reads
                                   by 0.5 s and MISSED lands on the 0.4 s cut with an anamorphic light streak; its bloom
                                   is screened onto the footage, so its light falls on the image);
                bg "plate" (4K trailer shots cut on rhythm + Look finishing) / "none" (transparent overlay, type only).
     Safe zone: all type sits inside x 96-936, y 230-760 (plus the v1 source stamp at y 1384-1423), including the hold
     push and the slam settle. -->
<html lang="en" data-composition-variables='[
  {"id":"variant","type":"enum","label":"Variant","default":"0","options":[{"value":"0","label":"Boxed lines"},{"value":"1","label":"Official caps"}]},
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/kit/look/look.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; color: #fff;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      /* footage stage: full frame for both variants (v2 r07: the letterbox is gone) */
      /* z-index 0 makes the stage its own stacking context: the flash, leak and vignette inside it light the footage only, never the type */
      #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; z-index: 0; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ov { position: absolute; inset: 0; z-index: 10; }
      #scrim { position: absolute; left: 0; top: 0; width: 1080px; height: 1300px; opacity: 0; }
      /* Official caps sky grade: a plum-black top smoke, weighted to the left where the lockup sits. r08: capped so the
         combined darkening peaks at about .45 (the r07 .74 turned every sky grey); the type's lift shadows do the rest */
      #scrim.sky { background:
        radial-gradient(ellipse 60% 16% at 38% 30%, rgba(6,4,16,.2) 0%, rgba(6,4,16,.1) 55%, rgba(6,4,16,0) 100%),
        linear-gradient(180deg, rgba(6,4,16,.45) 0%, rgba(6,4,16,.34) 16%, rgba(6,4,16,.24) 30%, rgba(6,4,16,.12) 46%, rgba(6,4,16,0) 66%); }
      /* MISSED's anamorphic streak: a lens artefact on the payoff cut, so it sits ABOVE everything, screen-blended */
      #flare { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 12; pointer-events: none;
        mix-blend-mode: screen; opacity: 0; overflow: hidden; }
      #flare .st { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; }
      #flare .glow { opacity: 1; }
      #hook { position: absolute; left: 0; top: 0; width: 1080px; }
      /* MISSED's light: a copy of the keyword's glyphs carrying the bloom, ABOVE the stage and BELOW the type, screened
         so the pink light falls on the footage (the type layer is its own stacking context, so it can't blend itself) */
      #light { position: absolute; inset: 0; z-index: 5; pointer-events: none; opacity: 0; }
      #light .lh, #light .lw { position: absolute; inset: 0; }
      #light .lt { position: absolute; white-space: nowrap; }
      #light .lk-mask { overflow: visible; }

      /* ---------- Variant 0: Boxed lines (merged text slabs, each hugging its line) ---------- */
      .row { position: absolute; left: 0; top: 0; }
      .punch { position: relative; transform-origin: 50% 50%; }
      .slab { position: relative; overflow: hidden; }
      /* warm paper (matched to the Leonida sunset light). The stack's one contact shadow is on #hook (drop-shadow), so it
         follows the merged outline, fillets included */
      .slab.paper { background: linear-gradient(180deg, #FFFAF3 0%, #F6EEE4 100%); }
      /* night paper: the same slab under street light, faded in on the night cut so the stack doesn't glare */
      .slab .night { position: absolute; inset: 0; opacity: 0; background: linear-gradient(180deg, #E8E3DA 0%, #DED8CE 100%); }
      /* TikTok-style concave fillet where a narrower slab meets a wider one (paper, with a night layer) */
      .fil { position: absolute; opacity: 0; }
      .fil i { position: absolute; inset: 0; }
      /* the keyword slab is the light source: the sunset fills the slab itself on the cut (wipe) with a hot light edge
         riding the wipe front; the light stays INSIDE the slab (inset glow), and a sheen crosses it */
      .slab .sunfill { position: absolute; inset: 0; box-shadow: inset 0 0 40px rgba(254,183,71,.35); }
      .slab .edge { position: absolute; left: 0; top: 0; height: 100%; opacity: 0; mix-blend-mode: screen;
        background: linear-gradient(90deg, rgba(255,214,170,0) 0%, rgba(255,226,196,.55) 55%, rgba(255,250,240,1) 84%, rgba(255,255,255,0) 100%); }
      .slab .lit { position: absolute; left: 0; top: 0; width: 100%; height: 1px; }
      .slab .glint { position: absolute; left: 0; top: 0; height: 100%;
        background: linear-gradient(105deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.5) 50%, rgba(255,255,255,0) 60%); }
      .txt { position: absolute; left: 0; top: 0; white-space: nowrap; font-family: "Inter", sans-serif; font-weight: 800;
        letter-spacing: -0.042em; font-feature-settings: "kern" 1, "ss01" 1, "cv11" 1; }
      .txt .in { display: inline-block; position: relative; }
      .txt .bl { display: inline-block; width: 0; height: 0; vertical-align: baseline; }

      /* ---------- Variant 1: Official caps (left-aligned lockup in the sky) ---------- */
      .caps { text-align: left; }
      .caps .kick { display: inline-block; font-family: "Archivo", "Inter", sans-serif; font-stretch: 125%; font-weight: 600;
        text-transform: uppercase; white-space: nowrap; line-height: 1.2; color: #fff;
        text-shadow: 2px 0 0 rgba(238,8,242,.85), 0 0 12px rgba(255,255,255,.3), 0 0 34px rgba(238,8,242,.28), 0 2px 10px rgba(0,0,0,.35); }
      .hl { display: block; white-space: nowrap; font-family: "Archivo", "Inter", sans-serif; font-stretch: 125%; font-weight: 800;
        text-transform: uppercase; letter-spacing: .015em; line-height: .92; }
      .caps #l1 { filter: drop-shadow(0 2px 3px rgba(0,0,0,.22)) drop-shadow(0 8px 26px rgba(0,0,0,.42)); }   /* lift only: MISSED is the one line that glows */
      .caps #l2wrap { display: block; }
      .caps #l2 { display: inline-block; filter: drop-shadow(0 2px 4px rgba(0,0,0,.26)); }   /* contact only, so its own light isn't shadowed out */
      /* source stamp under the lockup: the trailer and the timecode of the shot on screen, rolling on each cut.
         One face (Archivo wide 600) for the whole row, with tabular figures so the time doesn't jitter. */
      .stamps { display: flex; align-items: center; gap: 18px; transform-origin: 0% 50%; }
      .stamps .r { display: block; width: 48px; height: 2px; background: rgba(255,255,255,.86); flex: none; }
      .stamps .tc { position: relative; display: block; overflow: hidden; }
      .stamps .it { position: absolute; left: 0; top: 0; white-space: nowrap; font-family: "Archivo", "Inter", sans-serif; font-stretch: 125%;
        font-weight: 600; text-transform: uppercase; color: #fff; font-variant-numeric: tabular-nums lining-nums;
        font-feature-settings: "tnum" 1, "lnum" 1; text-shadow: 0 1px 2px rgba(0,0,0,.4), 0 3px 14px rgba(0,0,0,.55); }
      .stamps .it .src { color: rgba(255,255,255,.8); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1080" data-height="1920">
      <div id="stage">
        <div id="shake"><div id="push">
          <!-- Boxed lines (r09): vertical 4K shots, full frame, bright all the way through, cut on the hook's beats (1.1 payoff,
               3.4 and 5.5 re-hits). The payoff shot holds 2.3 s: the 1.87 s sunset dock runs at 0.79x (source 0.02-1.83).
               The near-black s014 night tail is gone: the hook ends on Trailer 2's opening shot, a Keys stilt house under
               open blue sky (assets/clips/s001-stilt-house-v.mp4: cut from the 4K master like the shot library, same grade,
               framed right so the title sits in the sky). -->
          <video id="v0a" class="clip shot v0" src="assets/shots/s011-vice-highway-v.mp4" muted playsinline data-start="0" data-duration="1.1" data-media-start="0.3" data-track-index="0"></video>
          <video id="v0b" class="clip shot v0" src="assets/shots/s027-sunset-dock-v.mp4" muted playsinline data-start="1.1" data-duration="2.3" data-media-start="0.02" data-playback-rate="0.79" data-track-index="0"></video>
          <video id="v0c" class="clip shot v0" src="assets/shots/s012-muscle-beach-v.mp4" muted playsinline data-start="3.4" data-duration="2.1" data-media-start="0.5" data-track-index="0"></video>
          <video id="v0d" class="clip shot v0" src="assets/clips/s001-stilt-house-v.mp4" muted playsinline data-start="5.5" data-duration="1.5" data-media-start="0" data-track-index="0"></video>
          <!-- Official caps (r08): bright day to golden hour, every shot with open sky top-left for the lockup (checked frame
               by frame). Highway (Trailer 2) / CUT 0.4 payoff: skydive over Vice City (Features Trailer) / 1.9 "The Keys"
               sign under power lines (Launch Trailer; in at 0.3 as the trailer clears, out at 0.9 before the sign's top edge
               rises to MISSED) / 2.5 jetski under open blue sky (Trailer 2; out at 0.65, before the riders' heads reach
               the lockup) / 3.15 muscle beach palms (Trailer 2) / 5.5 sunset pier (Trailer 2) -->
          <video id="v1a" class="clip shot v1" src="assets/shots/s011-vice-highway-v.mp4" muted playsinline data-start="0" data-duration="0.4" data-media-start="1.3" data-track-index="2"></video>
          <video id="v1b" class="clip shot v1" src="assets/shots/s135-skydive-city-v.mp4" muted playsinline data-start="0.4" data-duration="1.5" data-media-start="0" data-track-index="2"></video>
          <video id="v1c" class="clip shot v1" src="assets/shots/s074-keys-sign-v.mp4" muted playsinline data-start="1.9" data-duration="0.6" data-media-start="0.3" data-track-index="2"></video>
          <video id="v1d" class="clip shot v1" src="assets/shots/s064-jetski-v.mp4" muted playsinline data-start="2.5" data-duration="0.65" data-media-start="0" data-track-index="2"></video>
          <video id="v1e" class="clip shot v1" src="assets/shots/s012-muscle-beach-v.mp4" muted playsinline data-start="3.15" data-duration="2.35" data-media-start="0.3" data-track-index="2"></video>
          <video id="v1f" class="clip shot v1" src="assets/shots/s026-sunset-pier-v.mp4" muted playsinline data-start="5.5" data-duration="1.5" data-media-start="0" data-track-index="2"></video>
        </div></div>
      </div>
      <div id="light"><div class="lh"><div class="lw"></div></div></div>
      <div id="flare"></div>
      <div id="ov" class="clip" data-start="0" data-duration="7" data-track-index="1">
        <div id="scrim"></div>
        <div id="hook"></div>
      </div>
    </div>

    <script>
      /* ===================== CONFIG: all content, styling and timing for both variants ===================== */
      const CONFIG = {
        duration: 7,
        accent: "linear-gradient(100deg, #F84FA4 0%, #FE78A6 24%, #FE8E4E 62%, #FEB747 100%)",   // Leonida sunset, keyword only
        variants: {
          // Boxed lines: the TikTok text-box format, made an object (r09). Warm paper slabs with room around the ink, a
          // lit top edge and one soft contact shadow under the merged stack. On the first cut the keyword's slab SLAMS
          // 1.12 -> 1 as it fills with the Leonida sunset and becomes the light source: its pink/amber bloom is screened
          // onto the footage, it bounces onto the paper next to it, and it re-hits on every later cut. Shots: <video class="v0">.
          "0": {
            style: "boxed",
            shots: ["s011-vice-highway", "s027-sunset-dock", "s012-muscle-beach", "clips/s001-stilt-house"],
            lines: [
              { text: "GTA 6 details", size: 72, padX: 26, padY: 14 },   // the lead-in: a small tab on top of the stack
              { text: "nobody", size: 200 },
              { text: "noticed", size: 200 }
            ],
            keyword: "nobody",          // the line whose slab ignites in sunset ("" = no accent)
            maxWidth: 772,              // a slab never gets wider than this: a long line shrinks from its size to fit, and at
                                        // 772 the stack stays inside x 936 through the hold push (Inter 800 display)
            top: 232,                   // y of the first slab
            centerX: 540,
            padX: 40, padY: 24,         // every slab gives its line room: 40 px each side of the INK, 24 px above the
                                        // cap/ascender and below the baseline (or the descender); a line can override both
            radius: 14,                 // corner radius; where a narrower slab meets a wider one the inner corner gets a concave
            snap: 4,                    // fillet (TikTok's merged text background). Neighbours closer than snap x radius snap equal.
            inkText: "#0B0B0E",         // type on every slab, paper and sunset
            shadow: [0, 24, 48, 0.38],  // the stack's soft contact shadow: [x, y, blur, alpha] in plum-black (10,4,20)
            contact: [0, 2, 4, 0.18],   // plus a tight one where the stack meets the image
            edge: 0.6,                  // 1 px lit top edge on every slab (white alpha)
            slam: 1.12, slamDur: 0.32,  // the keyword slab lands 1.12 -> 1 (expo.out) on the cut
            impact: { flash: 0.5, zoom: 1.04, amp: 9, color: "#FFF0DE" },   // footage hit on the cut (plate only)
            // the lit slab's light, screened onto the footage (plate) around the slab: pink on the left, amber on the right.
            // peak on the cut, settling to "hold"; re-hits lift it to "rehit". strength scales every layer.
            bloom: { colors: ["#F84FA4", "#FEB747"], strength: 1.3, hold: 0.55, rehit: 0.95, none: 0.5,
              // plus a plain pink bloom (Look.bloom's layers, normal blend) on the payoff shot only: on the bright sunset
              // sky a screened light barely shows, so this one paints the pink onto it; it leaves on the "until" cut
              tint: { color: "#F84FA4", strength: 0.45, until: 3.4 } },
            bounce: 0.2,                // the lit slab's light on the paper above and below it (0 = off)
            holdPush: 1.02,             // the whole stack pushes in linearly across the hold
            grain: 0.14,
            // night: from this cut on, the paper takes the street light (dimmer, cooler) and a deeper shadow; null = off.
            // r09: the sample has no night shot any more, so it's off (set { at: <your night cut>, shadowAlpha: 0.5 }).
            night: null,
            timing: { in: 0.0, stagger: 0.11, hit: 1.1, ignite: 1.08, sheen: 1.38, rehits: [3.4, 5.5], leak: 1.1, leakDur: 1.2, out: 6.3 }
          },
          // Official caps: Rockstar's own card language (wide caps, a tracked kicker with the magenta offset), set
          // LEFT in the sky of full-bleed footage like Rockstar's own date and feature cards. MISSED's pink bloom is
          // screened onto the image. Shots: the <video class="v1"> tags.
          "1": {
            style: "caps",
            shots: ["s011-vice-highway", "s135-skydive-city", "s074-keys-sign", "s064-jetski", "s012-muscle-beach", "s026-sunset-pier"],
            kicker: "GTA 6 · Every trailer",     // the sample shots come from Trailer 2, the Features and the Launch Trailer (see stamps)
            kickerSize: 30, kickerTrack: 0.34,   // same 30 px as the stamp row: the frame keeps three sizes, one family
            lines: ["What you", "missed"],       // line 2 is the hero keyword line
            keyword: "missed",
            left: 96,                             // left edge of the lockup (ink-aligned)
            width: 784,                           // both hero lines' INK is fitted to this measure, so the right edge squares off
            maxSize: 160,                         // and MISSED (about 153 px) is the hero: as wide as WHAT YOU, half again as tall
            top: 262,                             // y of the kicker (the lockup ends at y ~550, above the skydiver's head)
            gapKick: 24, gapLines: 4,
            slam: 1.06,                           // MISSED slams in from its left edge (1.06 keeps the right edge inside x 936)
            // MISSED's light, screened onto the footage. Each glyph's bloom takes the colour of its own part of the sunset
            // fill (pink M -> amber D); "color" is the fallback. Screened onto the graded sky, Look.bloom .55 only moved
            // the footage by about +5 in red, so the light layer runs at 1.15.
            bloom: { color: "#F84FA4", strength: 1.15, matchFill: true },
            // the payoff light: an anamorphic streak through MISSED on the cut (plate only); peak opacity, length, colours
            // r09: it TRAVELS (x from travel[0] to travel[1] in travelDur), rides "above" px over MISSED's cap line (not
            // through its x-height, where it read as a strike-through) and is gone by "gone" s
            flare: { peak: 0.9, length: 1500, colors: ["#F84FA4", "#FFF4EA", "#FEB747"], above: 18, travel: [-260, 200], travelDur: 0.22, gone: 0.95 },
            scrim: 1, scrimNone: 0.45,            // sky grade over footage / top smoke baked into a transparent export (0 = none)
            // r09: an extra top smoke (.lk-scrim-top) on the two palest skies only (s011, s135), down to y "to", off at "until"
            topScrim: { alpha: 0.35, to: 640, until: 1.9 },
            grain: 0.12,
            // source stamps, one per sample shot from the payoff on: [trailer, time, cut]. The row enters on the first
            // cut; each roll fires 0.07 s BEFORE its cut so the new source is in on the cut's first frame.
            // Times are each shot's source time (gta6/_shared/shots/shots.json) + its data-media-start.
            // The row sits bottom-left (y 1384) over a soft bottom smoke, clear of every subject.
            // "spot": a soft plum-black ellipse behind the row (peak alpha), so the 30 px label reads over white spray too
            stamps: { size: 30, track: 0.3, top: 1384, smoke: 0.62, spot: 0.5, showNone: false, lead: 0.07,
              items: [["Features trailer", "0:43", 0.4], ["Launch trailer", "0:02", 1.9], ["Trailer 2", "2:20", 2.5],
                      ["Trailer 2", "0:38", 3.15], ["Trailer 2", "1:21", 5.5]] },
            // sheen 0.86 -> 1.46: the light moment stays on the payoff, and the hold shows the clean sunset fill
            timing: { kick: 0.0, l1: 0.06, l2: 0.28, hit: 0.4, sheen: 0.86, sheenDur: 0.6, leak: 1.75, out: 6.3 }
          }
        }
      };

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const vKey = CONFIG.variants[String(VARS.variant)] ? String(VARS.variant) : "0";
        const plate = VARS.bg !== "none";
        const V = CONFIG.variants[vKey], T = V.timing, D = CONFIG.duration;
        const root = document.getElementById("root"), stage = document.getElementById("stage"), hook = document.getElementById("hook");

        document.querySelectorAll("video.shot").forEach((v) => {
          if (!plate || !v.classList.contains("v" + vKey)) v.style.display = "none";
        });
        if (!plate) stage.style.display = "none";

        // Build only once the faces that will PAINT are loaded (v1 lesson: the renderer injects its own Inter face, and
        // fonts.ready can resolve before it loads, so layout was measured with a different face than the one drawn).
        const stampText = V.stamps ? V.stamps.items.map((s) => s[0] + " " + s[1]).join(" ") : "";
        const allText = [V.lines.map((l) => (typeof l === "string" ? l : l.text)).join(" "), V.kicker || "", stampText].join(" ");
        const loads = ["800 100px Inter", "800 100px Archivo", "600 100px Archivo"].map((f) =>
          document.fonts.load(f, allText + " " + allText.toUpperCase()).catch(() => []));
        Promise.all(loads).then(() => document.fonts.ready).then(() => {
          const tl = gsap.timeline({ paused: true });
          // slow push on the footage
          if (plate) Look.push(tl, "#push", 0, D, { from: 1.0, to: 1.06, origin: "50% 50%" });
          if (V.style === "boxed") buildBoxed(tl); else buildCaps(tl);
          const lk = Look.install(tl, { duration: D, grain: V.grain || 0.14, vignette: 0.5, enabled: plate });
          if (lk) {
            // The kit puts grain + vignette in one z-indexed wrapper. That wrapper is its own stacking context, so the
            // grain's overlay blend sees an empty backdrop and composites as plain grey noise (r05 measured black at
            // Y 33 and the paper slabs at #E0-#EB). Re-parented, the grain blends with the real frame, and the vignette
            // darkens the footage only.
            if (lk.grain) { lk.grain.style.zIndex = "90"; root.appendChild(lk.grain); }
            if (lk.vignette) { lk.vignette.style.zIndex = "50"; stage.appendChild(lk.vignette); }
          }
          tl.set({}, {}, D);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });

        /* ------------------------------------------------------------------------------------------------ */
        // the accent's colour at a fraction f (0..1) of its width, and "r,g,b" of a hex colour
        const ACC = [[0, "#F84FA4"], [0.24, "#FE78A6"], [0.62, "#FE8E4E"], [1, "#FEB747"]];
        const rgbArr = (hx) => hx.replace("#", "").match(/../g).map((q) => parseInt(q, 16));
        const rgbStr = (hx) => rgbArr(hx).join(",");
        const accentAt = (f) => {
          f = Math.max(0, Math.min(1, f)); let i = 0; while (i < ACC.length - 2 && f > ACC[i + 1][0]) i++;
          const [f0, c0] = ACC[i], [f1, c1] = ACC[i + 1], k = (f - f0) / (f1 - f0), a = rgbArr(c0), b = rgbArr(c1);
          return "#" + a.map((v, j) => Math.round(v + (b[j] - v) * k).toString(16).padStart(2, "0")).join("");
        };

        function buildBoxed(tl) {
          const light = document.getElementById("light");
          document.getElementById("flare").style.display = "none";
          const kw = (V.keyword || "").toLowerCase(), R = V.radius;
          const rows = V.lines.map((L) => {
            const isKey = kw && L.text.toLowerCase() === kw;
            const row = document.createElement("div"); row.className = "row";
            const punch = document.createElement("div"); punch.className = "punch";
            const slab = document.createElement("div"); slab.className = "slab paper";
            const night = document.createElement("div"); night.className = "night"; slab.appendChild(night);
            let sunfill = null, glint = null, edge = null;
            if (isKey) {
              sunfill = document.createElement("div"); sunfill.className = "sunfill";
              // r09: the lit slab has volume: a soft gloss from the top and a touch of shade at the bottom, over the sunset
              sunfill.style.background = "linear-gradient(180deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 40%), " +
                "linear-gradient(0deg, rgba(120,16,60,.12) 0%, rgba(120,16,60,0) 34%), " + CONFIG.accent;
              glint = document.createElement("div"); glint.className = "glint"; sunfill.appendChild(glint); slab.appendChild(sunfill);
              edge = document.createElement("div"); edge.className = "edge"; slab.appendChild(edge);
              row.style.zIndex = "2";   // the lit slab sits on top, so its slam overlaps the paper above and below
            }
            // r09: a 1 px lit top edge on every slab (reads on the sunset slab; on the paper it's a hairline of light)
            const lit = document.createElement("div"); lit.className = "lit";

          // split now (the reveals below), then read the geometry the light layer has to copy
          // r08 timing: the WHOLE hook reads by 0.5 s. WHAT YOU rises from 0.06 s; MISSED rises from 0.28 s and lands
          // on the 0.4 s cut (r07 showed only the kicker until 0.6 s and MISSED read at about 0.95 s)
          Look.reveal(tl, l1, T.l1, { by: "chars", stagger: 0.018, dur: 0.42 });
          const h = T.hit;
          Look.reveal(tl, l2, T.l2, { by: "chars", stagger: 0.012, dur: 0.36 });
          const hookR = hook.getBoundingClientRect(), wrapR = l2wrap.getBoundingClientRect(), l2R = l2.getBoundingClientRect();
          const hookO = [V.left, hookR.height / 2], wrapO = [0, wrapR.height * 0.6];
          hook.style.transformOrigin = hookO[0] + "px " + hookO[1] + "px";
          l2wrap.style.transformOrigin = wrapO[0] + "px " + wrapO[1] + "px";

          // MISSED's LIGHT: the same glyphs, same split, same transforms, in a layer between the stage and the type.
          // Screen-blended on plate, so the pink bloom brightens the footage around the word like real light.
          const lh = light.querySelector(".lh"), lw = light.querySelector(".lw");
          lh.style.transformOrigin = (hookR.left + hookO[0]) + "px " + (hookR.top + hookO[1]) + "px";
          lw.style.transformOrigin = (wrapR.left + wrapO[0]) + "px " + (wrapR.top + wrapO[1]) + "px";
          const lt = document.createElement("div"); lt.className = "hl lt"; lt.textContent = V.lines[1];
          lt.style.fontSize = s2 + "px"; lt.style.left = l2R.left + "px"; lt.style.top = l2R.top + "px"; lt.style.color = V.bloom.color;
          lw.appendChild(lt);
          Look.split(lt, { by: "chars", mask: true });
          // each glyph's light takes the colour of its own part of the sunset fill (pink M ... amber D)
          const stops = [[0, "#F84FA4"], [0.24, "#FE78A6"], [0.62, "#FE8E4E"], [1, "#FEB747"]];
          const rgbOf = (hx) => hx.replace("#", "").match(/../g).map((q) => parseInt(q, 16));
          const sample = (f) => {
            f = Math.max(0, Math.min(1, f)); let i = 0; while (i < stops.length - 2 && f > stops[i + 1][0]) i++;
            const [f0, c0] = stops[i], [f1, c1] = stops[i + 1], k = (f - f0) / (f1 - f0), a = rgbOf(c0), b = rgbOf(c1);
            return "#" + a.map((v, j) => Math.round(v + (b[j] - v) * k).toString(16).padStart(2, "0")).join("");
          };
          const ltR = lt.getBoundingClientRect();
          lt.querySelectorAll(".lk-c").forEach((c) => {
            const r = c.getBoundingClientRect(), col = V.bloom.matchFill ? sample((r.left + r.width / 2 - ltR.left) / ltR.width) : V.bloom.color;
            c.style.color = col; Look.bloom(c, { color: col, strength: V.bloom.strength, core: false });
          });
          if (plate) light.style.mixBlendMode = "screen";

          // kicker focuses in from frame 0 (already half-lit and soft at t = 0, so the first frame carries type)
          const kFrom = { opacity: 0.5, scale: 1.05, filter: "blur(6px)" };
          kick.style.transformOrigin = "0% 50%";
          gsap.set(kick, kFrom);
          tl.fromTo(kick, kFrom, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out", immediateRender: false }, T.kick);
          tl.set(kick, { filter: "none" }, T.kick + 0.6);

          // PAYOFF on the 0.4 s cut to the skydive over Vice City: MISSED rises through its masks while the line slams
          // 1.06 -> 1 from its left edge, RGB split, exposure flash + shake on the footage and the anamorphic streak; then
          // its light comes up on the sky and a sheen crosses the sunset fill
          const SL = V.slam || 1.06;
          gsap.set([l2wrap, lw], { scale: SL });
          tl.fromTo([l2wrap, lw], { scale: SL }, { scale: 1, duration: 0.7, ease: "expo.out", immediateRender: false }, T.l2 + 0.04);
          Look.chroma(tl, l2wrap, h, 0.36, { px: 16 });
          if (plate) Look.impact(tl, h, { shake: "#shake", amp: 8, flash: 0.45, zoom: 1.04, host: "#stage" });
          gsap.set(light, { opacity: 0 });
          // the light comes up only once every glyph has landed and the RGB split has decayed (h + 0.36): earlier, its
          // static copy of the glyphs showed as a faint ghost above the still-rising chars (r07 self-check at 0.95 s)
          tl.fromTo(light, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out", immediateRender: false }, h + 0.36);
          // THE LIGHT MOMENT: an anamorphic streak on the cut, the way a trailer title catches the lens. A thin hot core
          // with a soft pink-to-amber glow (the word's own colours). r09: it rides 18 px over MISSED's cap line, travels
          // across the word in 0.22 s and is gone by 0.95 s. Screen-blended above everything; plate only.
          if (plate && V.flare) buildFlare(tl, l2R, h, s2);
          Look.fill(l2, CONFIG.accent, { sheen: true });
          Look.sheen(tl, l2, T.sheen, { dur: T.sheenDur || 0.85 });
          // hold: the lockup pushes in from its left edge, the light layer with it
          tl.fromTo([hook, lh], { scale: 1 }, { scale: 1.02, duration: T.out - 1.0, ease: "none", immediateRender: false }, 1.0);
          if (plate) Look.leak(tl, T.leak, 1.3, { host: "#stage", colors: ["#FE8E4E", "#F84FA4"], y: 0.3, size: 1300, opacity: 0.4 });

          // EXIT: the light goes first (so no glyph of it is ever seen bare), the kicker blurs out, the caps drop back up
          // through their masks letter by letter, the stamp blurs out and the sky grade lifts
          tl.fromTo(light, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.in", immediateRender: false }, T.out - 0.05);
          Look.exit(tl, kick, T.out, { to: "blur", dur: 0.38 });
          const c1 = l1.querySelectorAll(".lk-c"), c2 = l2.querySelectorAll(".lk-c");
          tl.fromTo(c1, { yPercent: 0 }, { yPercent: -118, duration: 0.36, ease: "power3.in", stagger: 0.014, immediateRender: false }, T.out + 0.04);
          tl.fromTo(c2, { yPercent: 0 }, { yPercent: -118, duration: 0.38, ease: "power3.in", stagger: 0.016, immediateRender: false }, T.out + 0.1);
          if (stampRow) animateStamps(tl, stampRow);
          if (scrimA > 0) tl.fromTo(scrim, { opacity: scrimA }, { opacity: 0, duration: 0.5, ease: "power2.inOut", immediateRender: false }, T.out + 0.15);
        }

        /* Official caps: the anamorphic streak on the payoff cut */
        function buildFlare(tl, l2R, h, s2) {
          const F = V.flare, fl = document.getElementById("flare");
          // r09: the streak rides F.above px over MISSED's cap line. The cap top is l2R's middle minus 0.366 x size
          // (calibrated on the r08 render: line middle at y 498, M's cap top at y 442 for MISSED at about 153 px)
          const capTop = l2R.top + l2R.height * 0.5 - 0.366 * s2;
          const cy = capTop - (F.above == null ? 18 : F.above), cx = l2R.left + l2R.width * 0.45, L = F.length;
          const [c0, c1, c2] = F.colors, rgb = (hx) => hx.replace("#", "").match(/../g).map((q) => parseInt(q, 16)).join(",");
          const mk = (h0, bg, blur) => {
            const e = document.createElement("div"); e.className = "st";
            e.style.width = L + "px"; e.style.height = h0 + "px"; e.style.left = (cx - L / 2) + "px"; e.style.top = (cy - h0 / 2) + "px";
            e.style.background = bg; if (blur) e.style.filter = "blur(" + blur + "px)"; fl.appendChild(e); return e;
          };
          // wide soft glow, then the hot core line, then a small hotspot where the light is strongest
          const glow = mk(60, "radial-gradient(ellipse 50% 50% at 50% 50%, rgba(" + rgb(c2) + ",.42) 0%, rgba(" + rgb(c0) + ",.2) 40%, rgba(" + rgb(c0) + ",0) 72%)", 6);
          const core = mk(5, "linear-gradient(90deg, rgba(" + rgb(c0) + ",0) 0%, rgba(" + rgb(c0) + ",.75) 22%, rgba(" + rgb(c1) + ",1) 50%, rgba(" + rgb(c2) + ",.75) 78%, rgba(" + rgb(c2) + ",0) 100%)", 1.2);
          const spot = document.createElement("div"); spot.className = "st";
          spot.style.cssText += ";width:200px;height:200px;left:" + (cx - 100) + "px;top:" + (cy - 100) + "px;background:radial-gradient(circle, rgba(" + rgb(c1) + ",.75) 0%, rgba(" + rgb(c2) + ",.28) 22%, rgba(" + rgb(c0) + ",0) 60%)";
          fl.appendChild(spot);
          const parts = [glow, core, spot], tr = F.travel || [-260, 200], td = F.travelDur || 0.22, gone = F.gone || 0.95;
          gsap.set(fl, { opacity: 0 });
          gsap.set([glow, core], { scaleX: 0.15, x: tr[0] }); gsap.set(spot, { scale: 0.4, x: tr[0] });
          tl.fromTo(fl, { opacity: 0 }, { opacity: F.peak, duration: 0.04, ease: "none", immediateRender: false }, h);
          tl.fromTo([glow, core], { scaleX: 0.15 }, { scaleX: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, h);
          tl.fromTo(spot, { scale: 0.4 }, { scale: 1, duration: 0.22, ease: "expo.out", immediateRender: false }, h);
          // it travels across the word's top in td, then drifts on while it decays: it never parks on the type
          tl.fromTo(parts, { x: tr[0] }, { x: tr[1], duration: td, ease: "power3.out", immediateRender: false }, h);
          tl.fromTo(parts, { x: tr[1] }, { x: tr[1] + 120, duration: Math.max(0.05, gone - h - td), ease: "none", immediateRender: false }, h + td);
          // full strength while it travels, then it eases out through the drift and is gone by F.gone
          tl.fromTo(fl, { opacity: F.peak }, { opacity: 0, duration: Math.max(0.05, gone - h - 0.12), ease: "sine.inOut", immediateRender: false }, h + 0.12);
        }

        /* Official caps: the source stamp ("— FEATURES TRAILER · 0:43"), one item per shot from the payoff on */
        function buildStampRow() {
          const S = V.stamps;
          if (!S || !S.items || !S.items.length || (!plate && !S.showNone)) return null;
          const row = document.createElement("div"); row.className = "stamps";
          row.style.position = "absolute"; row.style.left = V.left + "px"; row.style.top = S.top + "px";
          document.getElementById("ov").appendChild(row);
          if (plate && S.smoke > 0) {
            const sm = document.createElement("div"); sm.className = "lk-scrim-bottom";
            sm.style.cssText = "position:absolute;left:0;bottom:0;width:1080px;height:760px;opacity:" + S.smoke;
            stage.appendChild(sm); row.__smoke = sm;
          }
          if (plate && S.spot > 0) {
            // r08: the bottom smoke is only ~10% dark at the row's height, so over the jetski's white spray the label
            // went grey-on-white. A soft ellipse sits behind the row itself (no edge: it's light, not a card).
            const sp = document.createElement("div"), cy = S.top + Math.round(S.size * 0.65), a = S.spot;
            sp.style.cssText = "position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none;background:radial-gradient(ellipse 600px 130px at " +
              (V.left + 380) + "px " + cy + "px, rgba(6,4,16," + a + ") 0%, rgba(6,4,16," + (a * 0.55).toFixed(3) + ") 45%, rgba(6,4,16,0) 100%)";
            stage.appendChild(sp); row.__spot = sp;
          }
          row.innerHTML = '<i class="r"></i><span class="tc"></span>';
          const tc = row.querySelector(".tc");
          const lineH = Math.round(S.size * 1.3);
          tc.style.height = lineH + "px";
          row.__items = S.items.map(([src, time]) => {
            const e = document.createElement("span"); e.className = "it";
            e.style.fontSize = S.size + "px"; e.style.lineHeight = lineH + "px"; e.style.letterSpacing = S.track + "em";
            const a = document.createElement("span"); a.className = "src"; a.textContent = src;
            const dot = document.createElement("span"); dot.className = "src"; dot.textContent = " · ";
            const b = document.createElement("span"); b.className = "t"; b.textContent = time;
            e.appendChild(a); e.appendChild(dot); e.appendChild(b); tc.appendChild(e); return e;
          });
          return row;
        }
        function animateStamps(tl, row) {
          const S = V.stamps, items = row.__items, tc = row.querySelector(".tc"), lead = S.lead == null ? 0.07 : S.lead;
          tc.style.width = Math.ceil(Math.max(...items.map((e) => e.getBoundingClientRect().width))) + "px";
          items.forEach((e, i) => gsap.set(e, { yPercent: i === 0 ? 0 : 110 }));
          // the row enters ON the first stamped cut (the payoff), so no frame shows a stamp over a shot it doesn't name
          Look.enter(tl, row, S.items[0][2], { from: "blur", dur: 0.5, blur: 8, scale: 1.04 });
          for (let i = 1; i < items.length; i++) {
            const t = S.items[i][2] - lead;   // the roll leads the cut, so the new source is in on the cut's first frame
            tl.fromTo(items[i - 1], { yPercent: 0 }, { yPercent: -110, duration: 0.26, ease: "expo.out", immediateRender: false }, t);
            tl.fromTo(items[i], { yPercent: 110 }, { yPercent: 0, duration: 0.26, ease: "expo.out", immediateRender: false }, t);
          }
          Look.exit(tl, row, T.out + 0.06, { to: "blur", dur: 0.38 });
          if (row.__smoke) tl.fromTo(row.__smoke, { opacity: S.smoke }, { opacity: 0, duration: 0.5, ease: "power2.inOut", immediateRender: false }, T.out + 0.15);
          // the spot arrives with the row and leaves with it
          if (row.__spot) {
            gsap.set(row.__spot, { opacity: 0 });
            tl.fromTo(row.__spot, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, S.items[0][2]);
            tl.fromTo(row.__spot, { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.inOut", immediateRender: false }, T.out + 0.1);
          }
        }
      })();
    </script>
  </body>
