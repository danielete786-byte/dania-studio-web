<!-- GTA 6 component #42 — Pre-load progress. 1080x1920 (9:16), 30 fps, 5.0 s.
     A neutral, unbranded launcher-style download card for "Grand Theft Auto VI" that opens at 97%, ticks
     98% -> 99% -> (a held 99) -> 100%, lands "Ready to play" at 2.75 s (numeral slam + light sweep), then Play is
     pressed (a controller-style press, no mouse cursor: the game is console-only at launch) and the card drops away.
     Variables: variant "0" = Bar (smoked-glass card, top third, bar morphs into a Play button)
                variant "1" = Ring (ink-navy glass launcher panel pinned at the top, circular ring, Play pill lights up)
                bg "plate" (sample GTA VI footage underneath) / "none" (transparent overlay).
     Safe zones: both cards are 768 px wide including the 1 px edge (x 156–924) and stay inside x 144–936 at the
     end of the 1.025 push-in; tops sit at y 352 (Bar) and y 230 (Ring). The optional cursor (off by default) stays inside the cards. -->

  {"id":"variant","type":"enum","label":"Variant","default":"0","options":[{"value":"0","label":"Bar"},{"value":"1","label":"Ring"}]},

      /* ---------- Variant 0: Bar ---------- */
      #barPush { position: absolute; left: 157px; top: 352px; width: 766px; }

      #bar { position: absolute; left: 0; right: 0; top: 0; height: 24px; border-radius: 999px; overflow: hidden; background: rgba(255,255,255,.16); }
      #barFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 999px; background: var(--sunset); overflow: hidden; }
      /* live hold: a 140 px highlight sweeps across the fill every 0.9 s (positioned from the timeline in render) */
      #barShine { position: absolute; left: 0; top: 0; bottom: 0; width: 140px; opacity: 0;

      /* a bright leading edge so each tick visibly moves the end of the fill; its glow breathes .6 -> 1 at 1.2 Hz */
      #barTip { position: absolute; right: 0; top: 0; bottom: 0; width: 46px; border-radius: 999px;

      /* the 100% light sweep (and the later ready sheen) across the whole bar / Play button */
      #barSweep { position: absolute; left: 0; top: 0; bottom: 0; width: 240px; opacity: 0;

      /* controller-style press: a quick inner highlight flash, no cursor */

      #barCta { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 18px; opacity: 0;

      #ringPush { position: absolute; left: 157px; top: 230px; width: 766px; transform-origin: 50% 0%; }
      #ringCard { position: relative; width: 766px; border-radius: 36px; padding: 40px;

      .rwrap { position: relative; width: 426px; height: 426px; margin: 0 auto; }

      .rinner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

      /* live hold: a 24° comet highlight runs along the filled arc every 0.9 s */
      #ringComet { background: conic-gradient(from -24deg, rgba(255,255,255,0) 0deg, rgba(255,255,255,.5) 21deg, rgba(255,255,255,0) 24deg, rgba(255,255,255,0) 360deg); }
      /* the 100% light sweep: one 120° band laps the closed ring in 0.35 s */
      #ringSweep { background: conic-gradient(from -120deg, rgba(255,246,234,0) 0deg, rgba(255,246,234,.72) 114deg, rgba(255,246,234,0) 120deg, rgba(255,246,234,0) 360deg); }
      #ringPct { --lh: 206px; --fs: 180px; --mk: 13%; --pc-top: 38px; --pc-ml: 2px; transform: translate(var(--nx), -9px); --nx: 6px; }
      .rstatus { position: relative; height: 56px; margin-top: 16px; }
      .rstatus > div { position: absolute; left: 0; right: 0; top: 0; height: 56px; display: flex; align-items: center; justify-content: center; gap: 16px; }
      /* while downloading: a readable 44 px status with a live ETA (same slot size as the ready line) */
      #ringSt0 { color: rgba(255,255,255,.66); font-weight: 500; font-size: 44px; letter-spacing: -0.02em; text-transform: none; }
      #ringSt1 { font-weight: 700; font-size: 44px; letter-spacing: -0.022em; text-transform: none; }
      #ringSt1 .check { width: 40px; height: 40px; }
      .rpill { position: relative; height: 96px; margin-top: 20px; border-radius: 999px; overflow: hidden; }
      .rpill .face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 18px;
        font-weight: 700; font-size: 44px; letter-spacing: -0.02em; }
      /* while downloading: only a faint empty slot (no label, no greyed-out button) */
      #pillTrack { position: absolute; inset: 0; border-radius: 999px; background: rgba(255,255,255,.035); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
      /* ready: a solid paper pill (white = done, like the check), so the ring stays the frame's only sunset accent */
      #pillLit { position: absolute; inset: 0; border-radius: 999px; background: #fff; opacity: 0; }
      /* controller-style press: a quick ink tint + inner edge flash on the paper pill */

        background: rgba(11,11,14,.08); box-shadow: inset 0 0 0 2px rgba(11,11,14,.22); }
      #pillOn { color: var(--ink); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.0" data-width="1080" data-height="1920">

    <script>
      const CONFIG = {
        // the game on the card; written in our own type, no logo, no store or console branding
        game: { title: "Grand Theft Auto VI", tile: "GTA 6" },
        // percent states: the card enters already showing the first value, then each later value ticks in at timing.ticks[i]
        progress: [97, 98, 99, 100],
        variants: {
          "0": {
            name: "Bar",
            plate: "assets/plates/p01-keys-sign-v.mp4",
            kicker: "Pre-load",
            kickerDone: "Installed",  // the kicker swaps to this at 100%, so it agrees with "Available now"
            sub: "Unlocks Nov 19, 2026",
            subDone: "Available now",   // the date line swaps to this at 100%, so it never contradicts the Play button
            status: "Installing",
            done: "Ready to play",
            cta: "Play",
            speedMBs: 112.4,      // demo download speed shown in the meta row
            etaStart: 3,          // seconds left shown on entrance; counts down to 0:00 as the last tick lands
            // optional mouse cursor (off: GTA 6 launches on PS5 / Xbox Series only). Tip position in card pixels.
            cursor: { show: false, rest: [640, 508], click: [576, 478] }
          },
          "1": {
            name: "Ring",
            plate: "assets/plates/p01-keys-sign-v.mp4",
            sub: "Launches November 19, 2026",
            subDone: "Available now",
            status: "Downloading",    // shown as "Downloading · 0:03 left"; the ETA counts down to 0:00 as the last tick lands
            etaStart: 3,
            done: "Ready to play",
            cta: "Play",
            cursor: { show: false, rest: [650, 850], click: [576, 800] }
          }
        },
        // in: card entrance · ticks: when 98 / 99 / 100 roll in · step: fill ease per tick · live: highlight cycle while downloading
        // done: 100% lands (numeral slam, light sweep, status swap, Play state) · glint: one ready sheen across Play / the ring
        // click: Play is pressed (scale 1 -> .96 -> 1 + inner flash) · move: optional cursor glide · out: card drops away · end: clip end
        timing: { in: 0.12, ticks: [0.42, 1.3, 2.5], step: 0.42, live: 0.9, done: 2.75, glint: 3.45, click: 4.36,
                  move: [3.7, 4.2], out: 4.55, end: 5.0 }
      };

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const vKey = CONFIG.variants[String(VARS.variant)] ? String(VARS.variant) : "0";
        const showPlate = VARS.bg !== "none";
        const V = CONFIG.variants[vKey], T = CONFIG.timing, P = CONFIG.progress, G = CONFIG.game;
        const $ = (s) => document.querySelector(s);
        const isBar = vKey === "0";
        const lastTick = T.ticks[T.ticks.length - 1];
        const useCursor = !!(V.cursor && V.cursor.show);

        document.querySelectorAll("video.plate").forEach((v) => {
          if (!showPlate || v.getAttribute("src") !== V.plate) v.style.display = "none";
        });
        if (!showPlate) $("#scrim").style.display = "none";
        $(isBar ? "#ringPush" : "#barPush").style.display = "none";

        // ---- content ----
        const pre = isBar ? "#bar" : "#ring";
        const stackEl = $(pre + "Stack"), slotEl = $(pre + "Slot");
        P.forEach((n) => {
          const d = document.createElement("div"), a = document.createElement("span");
          a.textContent = String(n);
          [d, a].forEach((e) => { e.setAttribute("data-layout-allow-occlusion", ""); e.setAttribute("data-layout-allow-overlap", ""); });
          d.appendChild(a); stackEl.appendChild(d);
        });
        $(pre + "Tile").textContent = G.tile;
        $(pre + "Title").textContent = G.title;
        $(pre + "SubA").textContent = V.sub;
        $(pre + "SubB").textContent = V.subDone || V.sub;
        if (isBar) $("#barSt0").textContent = V.status; else $("#ringStTxt").textContent = V.status;
        $(pre + "Done").textContent = V.done;
        if (isBar) {
          // tracked caps, but the hyphen and the letter before it keep tight spacing so "PRE-LOAD" doesn't read "P R E - L O A D"
          const kicker = (el, txt) => String(txt || "").split(/(.-)/).forEach((part) => {
            if (!part) return;
            const sp = document.createElement("span"); sp.textContent = part;
            if (/^.-$/.test(part)) sp.style.letterSpacing = "0.02em";
            el.appendChild(sp);
          });
          kicker($("#barKickA"), V.kicker);
          kicker($("#barKickB"), V.kickerDone || V.kicker);
          $("#barCtaTxt").textContent = V.cta;
        } else {
          $("#pillOnTxt").textContent = V.cta;
        }
        const cur = $(pre + "Cursor");
        if (!useCursor) cur.style.display = "none";

        // ---- deterministic model (pure functions of time) ----
        const eStep = gsap.parseEase("power4.out"), eGlide = gsap.parseEase("power3.inOut"), eSweep = gsap.parseEase("power1.inOut");
        function fillAt(t) {
          let v = P[0];
          T.ticks.forEach((t0, i) => { if (t >= t0) v = P[i] + (P[i + 1] - P[i]) * eStep(Math.min(1, (t - t0) / T.step)); });
          return v;
        }
        // ring arc: round caps add one stroke width, so the drawn length is scaled to close exactly at 100%
        const R = 200, SW = 26, C = 2 * Math.PI * R, BAR_W = 670;
        const fillEl = $("#barFill"), arc = $("#ringArc"), shine = $("#barShine"), tip = $("#barTip"), comet = $("#ringComet");
        let lastSpd = "", lastEta = "";
        // live highlight: one pass every T.live seconds while downloading, soft in/out at both ends, gone once 100 lands
        const liveFrom = T.in + 0.2;
        function liveAt(t) {
          if (t < liveFrom) return { p: 0, o: 0 };
          const p = ((t - liveFrom) % T.live) / T.live;
          const env = Math.max(0, Math.min(1, p / 0.14, (1 - p) / 0.14));
          const gate = Math.max(0, Math.min(1, (t - liveFrom) / 0.2, 1 - (t - lastTick) / 0.16));
          return { p: eSweep(p), o: env * gate };
        }
        function cursorAt(t) {
          // optional cursor: idles with a few px of hand drift, then glides on a shallow arc to Play
          const c = V.cursor, k = Math.max(0, Math.min(1, (t - T.move[0]) / (T.move[1] - T.move[0]))), e = eGlide(k);
          const still = 1 - e;
          const dx = still * (3.2 * Math.sin(t * 1.7) + 1.6 * Math.sin(t * 3.1 + 0.6));
          const dy = still * (2.4 * Math.sin(t * 1.3 + 1.1) + 1.2 * Math.sin(t * 2.7));
          return [c.rest[0] + (c.click[0] - c.rest[0]) * e + dx, c.rest[1] + (c.click[1] - c.rest[1]) * e - Math.sin(Math.PI * e) * 34 + dy];
        }
        function render(t) {
          const f = fillAt(t), L = liveAt(t);
          if (isBar) {
            fillEl.style.width = f.toFixed(3) + "%";
            // the 140 px highlight crosses the filled part only (it is clipped by the fill)
            const fpx = BAR_W * f / 100;
            shine.style.transform = "translateX(" + (-140 + (fpx + 140) * L.p).toFixed(1) + "px)";
            shine.style.opacity = L.o.toFixed(3);
            // the leading-edge glow breathes .6 -> 1 at 1.2 Hz, then fades as the bar closes
            const tipGate = Math.max(0, Math.min(1, 1 - (t - (lastTick + 0.1)) / 0.25));
            tip.style.opacity = ((0.8 + 0.2 * Math.sin(2 * Math.PI * 1.2 * t)) * tipGate).toFixed(3);
          } else {
            // once closed, draw the plain circle so the two round caps leave no notch at 12 o'clock
            arc.style.strokeDasharray = f > 99.9 ? "none" : ((C - SW) * f / 100).toFixed(2) + " " + C.toFixed(2);
            // the 24° comet rides the filled arc (head from 24° to the arc's end), then one slow lap of the closed ring as a ready glint
            const endDeg = 360 * ((C - SW) * f / 100) / C;
            let a = 24 + (endDeg - 24) * L.p, o = L.o;
            const g = (t - T.glint) / 0.9;
            if (g >= 0 && g <= 1) { a = 24 + 360 * eSweep(g); o = Math.max(0, Math.min(1, g / 0.14, (1 - g) / 0.14)) * 0.8; }
            comet.style.transform = "rotate(" + a.toFixed(2) + "deg)";
            comet.style.opacity = o.toFixed(3);
          }
          // ETA counts down in real time from the entrance to the last tick
          const k = Math.max(0, Math.min(1, (t - T.in) / (lastTick - T.in)));
          const eta = "0:" + String(Math.max(0, Math.ceil(V.etaStart * (1 - k) - 1e-6))).padStart(2, "0");
          if (isBar) {
            const spd = (V.speedMBs + 5.2 * Math.sin(t * 2.1) + 2.1 * Math.sin(t * 5.3 + 1)).toFixed(1) + " MB/s";
            if (spd !== lastSpd) { $("#barSpeed").textContent = spd; lastSpd = spd; }
            if (eta !== lastEta) { $("#barEta").textContent = eta + " left"; lastEta = eta; }
          } else if (eta !== lastEta) { $("#ringEta").textContent = eta; lastEta = eta; }
          if (useCursor) {
            const p = cursorAt(t);
            gsap.set(cur, { x: p[0], y: p[1] });
          }
        }
        render(0);

        document.fonts.ready.then(() => {
          const K = window.KitMotion;
          const tl = gsap.timeline({ paused: true });
          const push = pre + "Push", card = pre + "Card";

          // odometer slot width follows the value, so the static % slides over when 100 needs a third digit
          const widths = Array.from(stackEl.children).map((d) => Math.ceil(d.firstChild.getBoundingClientRect().width) + 2);
          gsap.set(slotEl, { width: widths[0] });

          // master driver: fill / ring arc, live highlights, speed, ETA and the optional cursor are a pure function of time
          K.drive(tl, 0, T.end, (p) => render(p * T.end), "linear");

          // entrance: card rises through a soft blur already at 97%, then a slow "camera" push-in for the hold
          tl.fromTo(card, { opacity: 0, y: 36, scale: 0.965, filter: "blur(8px)" },
            { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out", immediateRender: true }, T.in);
          tl.set(card, { filter: "none" }, T.in + 0.46);
          tl.fromTo(push, { scale: 1 }, { scale: 1.025, duration: T.out - T.in, ease: "sine.inOut", immediateRender: true }, T.in);
          if (useCursor) tl.fromTo(cur, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: true }, T.in + 0.12);

          // percent odometer: each new value rolls up from below through the soft mask
          const lineH = parseFloat(getComputedStyle(slotEl).height);
          const lines = Array.from(stackEl.children);
          T.ticks.forEach((t0, i) => {
            tl.fromTo(stackEl, { y: -lineH * i }, { y: -lineH * (i + 1), duration: 0.36, ease: "expo.out", immediateRender: false }, t0);
            // the outgoing value also fades as it leaves, so nothing of it lingers at the top of the slot
            tl.fromTo(lines[i], { opacity: 1 }, { opacity: 0, duration: 0.05, ease: "power1.in", immediateRender: false }, t0);
            tl.fromTo(lines[i + 1], { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out", immediateRender: false }, t0);
            if (widths[i + 1] !== widths[i])
              tl.fromTo(slotEl, { width: widths[i] }, { width: widths[i + 1], duration: 0.36, ease: "expo.out", immediateRender: false }, t0);
          });

          // completion: the bar's glow pulses as the fill closes
          const tClose = lastTick + 0.1;
          if (isBar) {
            tl.fromTo("#barGlow", { opacity: 0 }, { opacity: 0.75, duration: 0.18, ease: "power2.out", immediateRender: false }, tClose);
            tl.to("#barGlow", { opacity: 0, duration: 0.6, ease: "power2.out" }, tClose + 0.2);
          }

          // ---- the 100% beat (T.done): the numeral slams 1.12 -> 1 in 3 frames and one light sweep crosses the bar / laps the ring ----
          // the slam starts on a frame boundary (30 fps) so one rendered frame really shows the 1.12 peak
          const pctEl = isBar ? "#barPct" : "#ringInner", slamAt = Math.round(T.done * 30) / 30 - 0.001;
          tl.fromTo(pctEl, { scale: 1.12 }, { scale: 1, duration: 0.1, ease: "power3.out", immediateRender: false, transformOrigin: "50% 55%" }, slamAt);
          if (isBar) {
            tl.fromTo("#barSweep", { x: -240, opacity: 1 }, { x: BAR_W, duration: 0.35, ease: "power1.inOut", immediateRender: false }, T.done);
            tl.set("#barSweep", { opacity: 0 }, T.done + 0.36);
          } else {
            tl.fromTo("#ringSweep", { rotation: 0 }, { rotation: 360, duration: 0.35, ease: "power1.inOut", immediateRender: false }, T.done);
            tl.fromTo("#ringSweep", { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "power1.out", immediateRender: false }, T.done);
            tl.to("#ringSweep", { opacity: 0, duration: 0.13, ease: "power1.in" }, T.done + 0.22);
          }

          // status swap and drawn check; the ready label starts only after the old one has fully gone (no double exposure)
          const st0 = pre + "St0", st1 = pre + "St1", chk = pre + "Check";
          const len = $(chk).getTotalLength();
          gsap.set(chk, { strokeDasharray: len, strokeDashoffset: len });
          tl.fromTo(st0, { opacity: 1, y: 0 }, { opacity: 0, y: -8, duration: 0.15, ease: "power2.in", immediateRender: false }, T.done);
          tl.fromTo(st1, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.32, ease: "expo.out", immediateRender: false }, T.done + 0.16);
          tl.fromTo(chk, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, T.done + 0.22);
          // the date line becomes "Available now" (and the Bar kicker "INSTALLED") on the same beat
          const swaps = [[pre + "SubA", pre + "SubB"]];
          if (isBar) swaps.push(["#barKickA", "#barKickB"]);
          swaps.forEach(([a, b]) => {
            tl.fromTo(a, { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power2.in", immediateRender: false }, T.done);
            tl.fromTo(b, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.32, ease: "expo.out", immediateRender: false }, T.done + 0.16);
          });

          // the Play state
          const btn = isBar ? "#bar" : "#ringPill", press = isBar ? "#barPress" : "#pillPress";
          if (isBar) {
            // the finished bar grows into the Play button
            tl.fromTo("#barMeta", { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power2.in", immediateRender: false }, T.done - 0.02);
            tl.fromTo("#bar", { height: 24 }, { height: 96, duration: 0.42, ease: "expo.out", immediateRender: false }, T.done + 0.1);
            tl.fromTo("#barCta", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out", immediateRender: false }, T.done + 0.26);
            // one ready sheen across the Play button keeps the hold alive
            tl.fromTo("#barSweep", { x: -240, opacity: 0.6 }, { x: BAR_W, duration: 0.7, ease: "power1.inOut", immediateRender: false }, T.glint);
            tl.set("#barSweep", { opacity: 0 }, T.glint + 0.71);
          } else {
            // ring payoff: the ring pops 1 -> 1.04 -> 1 and the empty slot lights up as a paper Play button (crossfade + settle)
            tl.fromTo("#rwrap", { scale: 1 }, { scale: 1.04, duration: 0.1, ease: "power2.out", immediateRender: false }, T.done);
            tl.to("#rwrap", { scale: 1, duration: 0.3, ease: "power3.out" }, T.done + 0.1);
            tl.fromTo("#pillTrack", { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "power2.in", immediateRender: false }, T.done + 0.04);
            // the paper lights in ~2 frames so it never sits half-faded (a half-faded white pill reads as a grey disabled button)
            tl.fromTo("#pillLit", { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "power2.out", immediateRender: false }, T.done + 0.06);
            tl.fromTo("#ringPill", { scale: 0.97 }, { scale: 1, duration: 0.22, ease: "power2.out", immediateRender: false }, T.done + 0.06);
            tl.fromTo("#pillOn", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.24, ease: "power2.out", immediateRender: false }, T.done + 0.13);
          }

          // the press: Play scales 1 -> .96 -> 1 over 140 ms with an inner highlight flash (a controller press, no cursor needed)
          tl.fromTo(btn, { scale: 1 }, { scale: 0.96, duration: 0.06, ease: "power2.in", immediateRender: false }, T.click);
          tl.to(btn, { scale: 1, duration: 0.08, ease: "power2.out" }, T.click + 0.06);
          tl.fromTo(press, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "power1.out", immediateRender: false }, T.click);
          tl.to(press, { opacity: 0, duration: 0.2, ease: "power2.out" }, T.click + 0.08);
          if (useCursor) {
            tl.fromTo(cur, { scale: 1 }, { scale: 0.86, duration: 0.06, ease: "power2.in", immediateRender: false }, T.click);
            tl.to(cur, { scale: 1, duration: 0.12, ease: "power2.out" }, T.click + 0.06);
          }

          // exit: the card drops away (scale 1 -> .97, opacity 0, expo.in) right after the press
          const leaving = useCursor ? [card, cur] : [card];
          tl.to(leaving, { opacity: 0, duration: 0.35, ease: "expo.in" }, T.out);
          tl.to(card, { scale: 0.97, duration: 0.35, ease: "expo.in" }, T.out);
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>

  </body>
</html>
