<!doctype html>
<!-- #27 Top 3 podium (Compilation scaffolding) — 1080x1920, 30 fps, 6.0 s.
     A Three.js podium for a top-3 reveal: one stepped podium (heights 1.00 / 0.70 / 0.50, the winner's step 1.15x wider).
     Third, second, then first grow straight up out of the floor (always opaque), each carrying its clip as a card standing
     on top; the "1" slams, the winner's sunset rim ignites, and the camera pushes in and settles square on the winner.
     Exit: the cards fold back and fade, then the steps sink into the floor, so the last frame is clear for a loop.
     Full-frame component: it always shows footage. Every clip path, in-point and speed comes from CONFIG (mirrored on the
     <video> tags); every <video> the active variant does not use is hidden. bg "none" drops only the blurred backdrop.
     3D: blocks, extruded numerals, ground shadows and light are WebGL; the clip cards are DOM, pinned every frame to their
     3D quads with a projective matrix3d so type stays crisp. Everything is a pure function of timeline time. -->
<html lang="en" data-composition-variables='[
  {"id":"variant","type":"enum","label":"Variant","default":"0","options":[{"value":"0","label":"Podium"},{"value":"1","label":"Winner spotlight"}]},
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Blurred clip backdrop"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; font-feature-settings: "tnum" 1, "ss01" 1; }
      :root { --shadow-type: 0 2px 2px rgba(0,0,0,.35), 0 6px 24px rgba(0,0,0,.45); }

      /* ---------- blurred backdrop: the winner's clip, enlarged, blurred, with a soft sunset haze ---------- */
      #bgwrap { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
      .bgvid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
        transform: scale(1.18); filter: blur(34px) contrast(.7) brightness(1.2); }   /* flattened: the clip gives soft light and shade, the sky gives colour */
      /* Rockstar's feature-card sky (#9C7AA8 → #FFC88F) IS the backdrop: a colour blend keeps only the clip's light and shade,
         so the frame reads as one clean sunset instead of a muddy blurred plate */
      #haze { position: absolute; inset: 0; z-index: 1; mix-blend-mode: color; opacity: .85;
        background: linear-gradient(180deg, #9C7AA8 0%, #D689A1 38%, #FAA08D 62%, #FFC88F 82%, #FFC88F 100%); }
      #glow { position: absolute; inset: 0; z-index: 1; mix-blend-mode: screen;
        background: radial-gradient(62% 26% at 47% 74%, rgba(250,160,141,.5) 0%, rgba(214,137,161,.2) 50%, rgba(156,122,168,0) 100%); }   /* sunset floor glow under the podium */
      #shade { position: absolute; inset: 0; z-index: 1;
        background: linear-gradient(180deg, rgba(8,8,12,.62) 0%, rgba(8,8,12,.2) 30%, rgba(8,8,12,.04) 55%, rgba(8,8,12,.1) 76%, rgba(8,8,12,.3) 100%); }
      #dim { position: absolute; inset: 0; z-index: 1; background: radial-gradient(110% 62% at 47% 48%, rgba(6,6,10,.45) 0%, rgba(6,6,10,.86) 100%); opacity: 0; }

      /* ---------- WebGL podium ---------- */
      #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 2; display: block; }

      /* ---------- clip cards: DOM pinned to 3D quads (transform set every frame; sizes set from the camera) ---------- */
      .card { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform, opacity; opacity: 0;
        overflow: hidden; background: #0d0d12; z-index: 3;
        box-shadow: 0 1px 2px rgba(0,0,0,.5), 0 6px 10px rgba(0,0,0,.55), 0 0 26px rgba(0,0,0,.3); }
      .card video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .card .dimmer { position: absolute; inset: 0; background: #07070b; opacity: 0; }
      .card .scrim { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(8,8,12,.88) 0%, rgba(8,8,12,.55) 28%, rgba(8,8,12,0) 56%); }
      .card .edge { position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.16), inset 0 2px 0 rgba(255,255,255,.22); }
      .card .sheen { position: absolute; top: -20%; bottom: -20%; width: 46%; left: -60%;
        background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.26) 50%, rgba(255,255,255,0) 100%); transform: skewX(-14deg); }
      .card .lab { position: absolute; color: #fff; }
      .card .name { font-family: "Barlow Condensed", sans-serif; font-weight: 800; line-height: .9;
        text-transform: uppercase; letter-spacing: .015em; text-shadow: 0 2px 10px rgba(0,0,0,.4); text-wrap: balance; }
      .card .meta { font-weight: 600; letter-spacing: -0.01em; color: rgba(255,255,255,.88); font-variant-numeric: tabular-nums; white-space: nowrap; }
      /* spotlight variant: the beam landing on the top of the winner's card (screen blend inside the card) */
      .card .kiss { position: absolute; inset: 0; opacity: 0; mix-blend-mode: screen;
        background: radial-gradient(70% 46% at 50% -6%, rgba(255,241,226,.6) 0%, rgba(255,228,206,.2) 55%, rgba(255,228,206,0) 100%); }
      .card .pill { position: absolute; border-radius: 999px; white-space: nowrap; opacity: 0; color: #fff; font-weight: 600; letter-spacing: -0.005em;
        background: rgba(14,14,20,.62); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
        box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.18); font-variant-numeric: tabular-nums; }

      /* ---------- title block (screen space, upper third) ---------- */
      #ov { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
      #title { position: absolute; left: 72px; width: 864px; top: 262px; text-align: center; color: #fff; }
      #kicker { font-weight: 600; font-size: 32px; letter-spacing: .34em; text-transform: uppercase; color: rgba(255,255,255,.86);
        text-shadow: var(--shadow-type); padding-left: .34em; }
      #head { margin-top: 18px; font-weight: 800; font-size: 108px; line-height: .94; text-wrap: balance; font-feature-settings: "case" 1;
        letter-spacing: -0.025em; text-transform: uppercase; text-shadow: var(--shadow-type); }
    </style>
  </head>
  <body>

      <div class="card" id="card1">

    <script>
      const CONFIG = {
        variants: {
          // "Podium": third, second, first rise out of the floor; the "1" slams and the camera pushes in and settles on the winner.
          // Demo: the creator's top 3 moments from Trailer 2. `meta` is optional (e.g. your own timestamp or note);
          // the demo leaves it empty because those details are the creator's to fill in.
          "0": {
            style: "podium",
            backdrop: { src: "assets/clips/bg-p06-v-043.mp4", in: 0, rate: 1 },  /* p06 2.7 s on, pre-slowed 0.43x with frame blending */  // blurred full-frame backdrop: use your #1 clip
            kicker: "GTA 6 · Trailer 2",
            title: "Top 3 moments",
            entries: [ // rank 1, 2, 3. Card clips are pre-slowed with frame blending (assets/clips/card-*.mp4, see DECISIONS round 6) and play at rate 1; a live playbackRate under 1 judders.
              { name: "Lucia at the gate", meta: "", clip: { src: "assets/clips/card-p06-v-054.mp4",    in: 0, rate: 1 } },
              // the drive-by: source 0–1.9 s only (the mural and the police), before the car's A-pillar crosses the frame at ~2.0 s
              // pos: the card's crop (CSS object-position) sits low, below the car's sun visor, on the mural and the police
              { name: "The drive-by",      meta: "", clip: { src: "assets/clips/card-p04-v-035.mp4",  in: 0, rate: 1, pos: "50% 88%" } },
              // the horizontal plate, cropped left of centre (pos "30% 50%"), keeps Jason in the card for its whole window;
              // the vertical plate's centre crop loses him off the left edge as he turns to the door
              { name: "Jason at the door", meta: "", clip: { src: "assets/clips/card-p03-h-050.mp4",     in: 0, rate: 1, pos: "30% 50%" } }
            ]
          },
          // "Winner spotlight": the house lights are already low; after the slam a spotlight beam lands on #1, its number
          // counts up and a record chip pops in. The runners-up dim but keep their names and numbers.
          // Real numbers: Rockstar Games YouTube views as of 2026-11-18 (research/gta6/FACTS.md).
          "1": {
            style: "spotlight",
            backdrop: { src: "assets/clips/t1-beach-v-bg.mp4", in: 0, rate: 1 },   // t1-beach-v.mp4 0.6-3.3 s pre-slowed to 0.43x with frame blending (smooth 30 fps; a 0.17x live rate stepped at 5 fps)
            kicker: "GTA 6 · YouTube views",
            title: "Most-viewed trailers",
            entries: [
              { name: "Trailer 1",      count: 305.4, unit: "M views", clip: { src: "assets/clips/card-t1-v-043.mp4",        in: 0, rate: 1 }, chip: "90M+ in 24h" },
              { name: "Trailer 2",      count: 189.6, unit: "M views", clip: { src: "assets/clips/card-p06-v-050.mp4", in: 0, rate: 1 } },
              // pos "50% 85%": the crop sits low on the source, so the sign's lettering lands in the card's upper half, clear of the label
              { name: "Launch Trailer", count: 82.0,  unit: "M views", clip: { src: "assets/clips/card-p01-v-032.mp4",  in: 0, rate: 1, pos: "50% 85%" } }
            ]
          }
        },
        // on-screen type sizes (px) at the settled framing: three sizes per frame (title 108, names, small)
        type: { name: 52, small: 32, radius: 28 },
        // seconds. rise[r] = when place r starts rising (the clip <video> data-start matches it). The build is done by 1.6 s.
        // push = the "Podium" camera push-in after the slam; dimMore = when the spotlight variant dims the runners-up further.
        timing: { titleIn: 0.1, rise: { 3: 0.25, 2: 0.6, 1: 0.95 }, riseDur: 0.45, riseDur1: 0.5,
                  slam: 1.45, push: 1.2, spotlight: 1.6, dimMore: 2.4, out: 5.6, end: 6.0 }
      };

      // Barlow Condensed Black outlines for 1, 2, 3 (font units /1000, y down), extruded into real 3D numerals.
      const GLYPH = {"1":"M86 -697Q95 -700 104 -700L268 -700Q275 -700 279 -696Q283 -692 283 -685L283 -15Q283 -8 279 -4Q275 0 268 0L110 0Q103 0 99 -4Q95 -8 95 -15L95 -523Q95 -529 89 -529L23 -529Q16 -529 12 -533Q8 -537 8 -544L8 -660Q8 -673 20 -677L86 -697Z","2":"M249 -168Q246 -166 247 -163Q248 -161 252 -161L438 -161Q445 -161 449 -157Q453 -153 453 -146L453 -15Q453 -8 449 -4Q445 0 438 0L33 0Q26 0 22 -4Q18 -8 18 -15L18 -150Q18 -161 25 -169L86 -237Q136 -292 163 -323Q189 -354 210 -385Q257 -453 257 -505Q257 -547 231 -547Q219 -547 212 -537Q204 -528 204 -512L204 -470Q204 -463 200 -459Q196 -455 189 -455L29 -455Q22 -455 18 -459Q14 -463 14 -470L14 -520Q18 -576 48 -618Q77 -661 127 -684Q177 -708 240 -708Q301 -708 348 -682Q395 -657 421 -610Q447 -564 447 -504Q447 -448 431 -404Q415 -361 378 -312Q345 -268 301 -221Q256 -175 249 -168Z","3":"M422 -700Q429 -700 433 -696Q437 -692 437 -685L437 -551Q437 -540 430 -532L327 -424Q325 -422 326 -419Q326 -417 330 -417Q376 -413 407 -372Q437 -332 437 -276L437 -172Q437 -120 411 -79Q384 -38 337 -15Q290 8 230 8Q167 8 118 -15Q69 -38 42 -79Q14 -120 14 -172L14 -217Q14 -224 18 -228Q22 -232 29 -232L187 -232Q194 -232 198 -228Q202 -224 202 -217L202 -190Q202 -173 210 -163Q217 -153 230 -153Q243 -153 251 -163Q259 -174 259 -190L259 -303Q259 -319 251 -329Q243 -340 230 -340Q214 -340 195 -323Q188 -318 184 -318Q179 -318 174 -323L94 -406Q90 -410 90 -416Q90 -423 95 -427L205 -533Q208 -535 207 -537Q206 -540 202 -540L45 -540Q38 -540 34 -544Q30 -548 30 -555L30 -685Q30 -692 34 -696Q38 -700 45 -700L422 -700Z"};

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const vKey = CONFIG.variants[String(VARS.variant)] ? String(VARS.variant) : "0";
        const showBg = VARS.bg !== "none";
        const V = CONFIG.variants[vKey], T = CONFIG.timing, TY = CONFIG.type, SPOT = V.style === "spotlight";
        const $ = (s) => document.querySelector(s);

        // ---------- footage: keep only the clips this variant uses ----------
        document.querySelectorAll("video.bgvid").forEach((v) => { if (!showBg || v.getAttribute("src") !== V.backdrop.src) v.style.display = "none"; });
        if (!showBg) ["#shade", "#dim", "#haze", "#glow"].forEach((s) => { $(s).style.display = "none"; });
        [1, 2, 3].forEach((r) => {
          const E = V.entries[r - 1], card = $("#card" + r);
          card.querySelectorAll("video").forEach((v) => { if (v.getAttribute("src") !== E.clip.src) v.style.display = "none"; else if (E.clip.pos) v.style.objectPosition = E.clip.pos; });
          card.querySelector(".name").textContent = E.name;
          const metaEl = card.querySelector(".meta");
          metaEl.textContent = E.count != null ? E.count.toFixed(1) + E.unit : (E.meta || "");
          if (!metaEl.textContent) metaEl.style.display = "none";   // no meta: the name sits on the card's bottom inset
          const chip = card.querySelector(".chip");
          if (E.chip) chip.textContent = E.chip; else chip.style.display = "none";
          if (!(SPOT && r === 1)) card.querySelector(".kiss").style.display = "none";
        });
        $("#kicker").textContent = V.kicker;
        $("#head").textContent = V.title;

        // ---------- 3D scene (world units; ~280 px per unit at the settled framing) ----------
        const W = 1080, H = 1920;
        const GX = -0.133;                       // centres the podium on the safe zone (x 72–936 → 504), not the frame
        const BD = 0.9, BEV = 0.06, SEAM = 0.012;
        // A real stepped podium: one joined object, heights 1.00 / 0.70 / 0.50, the winner's step 1.15x wider.
        const W1 = 1.15, WS = 1.0;
        const BLOCK = { 1: { x: 0, w: W1, h: 1.6 },
                        2: { x: -(W1 / 2 + SEAM + WS / 2), w: WS, h: 1.12 },
                        3: { x:  (W1 / 2 + SEAM + WS / 2), w: WS, h: 0.8 } };
        // cards are sized to their step, inset so neighbours keep a ~16 px gutter and never overlap
        const INSET = 0.03;
        const CARD = { 1: { w: W1 - 2 * INSET, h: 1.45 }, 2: { w: WS - 2 * INSET, h: 1.22 }, 3: { w: WS - 2 * INSET, h: 1.22 } };
        // numeral glyph heights: the "1" is ~60% of its step (~270 px); "2"/"3" are near-matched (~185 / ~170 px on screen),
        // so the pair reads as a set and only the gradient "1" is the hero. The "3" fills its short step's face (0.60 of 0.80)
        // with ~11 px of clear face above and below it.
        const NUMH = { 1: 0.96, 2: 0.66, 3: 0.60 };
        const NUMD = { 1: 0.12, 2: 0.09, 3: 0.09 }; // extrusion depth: "2"/"3" slightly shallower than the "1"
        const NUMCAP = 0.8;                          // a numeral is never taller than 80% of the visible step
        const CARD_TILT = 0.105;                     // cards lean back ~6deg, matching the camera's downward pitch
        const ZC = 0.30;                             // cards stand on the front part of each step top (step depth ±0.45)
        const DOMPX = 270;                           // DOM px per world unit for the cards
        const canvas = $("#gl");
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true, premultipliedAlpha: true });
        renderer.setPixelRatio(1);
        renderer.setSize(W, H, false);
        renderer.setClearColor(0x000000, 0);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
        const world = new THREE.Group(); world.position.x = GX; scene.add(world);

        // ---------- environment: a neutral ink-navy studio (slate sky, a white softbox, two cool-white strip lights) ----------
        // Restraint like Rockstar's dark VI: the steps stay ink-navy; the only warm light is the winner's thin sunset rim.
        function canvasEl(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); return c; }
        const envCanvas = canvasEl(1024, 512, (g) => {
          let gr = g.createLinearGradient(0, 0, 0, 256);
          gr.addColorStop(0, "#0d0e15"); gr.addColorStop(.45, "#1d1f2b"); gr.addColorStop(.8, "#33354a"); gr.addColorStop(1, "#4a4c60");
          g.fillStyle = gr; g.fillRect(0, 0, 1024, 256);
          gr = g.createLinearGradient(0, 256, 0, 512); gr.addColorStop(0, "#262838"); gr.addColorStop(.14, "#10111a"); gr.addColorStop(1, "#07070b");
          g.fillStyle = gr; g.fillRect(0, 256, 1024, 256);
          g.filter = "blur(12px)";
          g.fillStyle = "#ffffff"; g.fillRect(650, 120, 240, 110);   // softbox behind the camera: gloss on the front faces
          g.fillStyle = "#9da3c4"; g.fillRect(84, 170, 100, 70);     // back-left cool strip
          g.fillStyle = "#a9adc4"; g.fillRect(340, 170, 100, 70);    // back-right cool strip
          g.filter = "none";
        });
        const envTex = new THREE.CanvasTexture(envCanvas); envTex.mapping = THREE.EquirectangularReflectionMapping; envTex.colorSpace = THREE.SRGBColorSpace;
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromEquirectangular(envTex).texture;

        // ---------- lights ----------
        const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(-4, 6, 8); scene.add(key);
        // cool-neutral rims, low and to the side so they edge the side walls without tinting the step tops
        const RIM = 2.2;
        const rimL = new THREE.DirectionalLight(0xC9CCEA, RIM); rimL.position.set(-6, 1.1, -2.2); scene.add(rimL);
        const rimR = new THREE.DirectionalLight(0xD9D6E6, RIM); rimR.position.set(6, 1.1, -2.2); scene.add(rimR);
        const sun = new THREE.DirectionalLight(0xffffff, 0.35);   // shadow caster: high and behind, so shadows fall toward camera
        sun.position.set(0.9, 9, -3.4); sun.target.position.set(0, 0, 0.3); world.add(sun); world.add(sun.target);
        sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
        Object.assign(sun.shadow.camera, { left: -3.4, right: 3.4, top: 3.4, bottom: -3.4, near: 1, far: 20 });
        sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02;
        // the spotlight (v1): straight down onto the winner's step, a little forward so its front edge catches it
        const SPOT_TOP = 7.4, SPOT_R = 0.72;
        const spot = new THREE.SpotLight(0xfff1e2, 0, 0, Math.atan(SPOT_R * 1.15 / (SPOT_TOP - BLOCK[1].h)), 0.5, 0);
        spot.position.set(0, SPOT_TOP, 0.55); spot.target.position.set(0, BLOCK[1].h, 0.25); world.add(spot); world.add(spot.target);

        // ---------- ground ----------
        function canvasTex(w, h, draw) { const t = new THREE.CanvasTexture(canvasEl(w, h, draw)); t.colorSpace = THREE.SRGBColorSpace; return t; }
        const floorTex = canvasTex(512, 512, (g, w, h) => { const r = g.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);

            let cs = TY.small;
            while (cs > 26 && chip.offsetWidth > c.clientWidth - 36 / k) { cs -= 1; chip.style.fontSize = px(cs); }
            chip.style.left = ((c.clientWidth - chip.offsetWidth) / 2).toFixed(2) + "px";
            // fit the name to at most two lines (never below 44 px on screen), and the meta to one line
            let fs = TY.name; name.style.fontSize = px(fs);
            while (fs > 44 && (name.scrollHeight > (fs / k) * 0.9 * 2 + 4 || name.scrollWidth > name.clientWidth + 1)) { fs -= 2; name.style.fontSize = px(fs); }
            let ms = TY.small;
            if (V.entries[r - 1].count != null) meta.textContent = V.entries[r - 1].count.toFixed(1) + V.entries[r - 1].unit;
            while (ms > 28 && meta.scrollWidth > lab.clientWidth + 1) { ms -= 1; meta.style.fontSize = px(ms); }
          });
        }

        function renderAt(t) {
          cameraAt(t);
          const outK = 1 - E.p2i(prog(t, T.out, T.end - T.out - 0.05));
          const spotK = SPOT ? E.p2io(prog(t, T.spotlight, 0.5)) : 0;

          // lights: in the spotlight variant the house lights are low from the start and dip a little more when the beam fires
          key.intensity = SPOT ? lerp(1.7, 1.2, spotK) : 2.4;
          rimL.intensity = rimR.intensity = SPOT ? RIM * lerp(0.85, 0.65, spotK) : RIM;
          spot.intensity = 9.0 * spotK;
          // the beam goes first: it is gone (5.45 → 5.65 s) before the cards start fading at T.out, so it never stands alone as a column
          const beamK = 1 - E.p2o(prog(t, T.out - 0.15, 0.2));
          coneMat.uniforms.uOpacity.value = 0.22 * spotK * beamK;
          pool.material.color.setScalar(0.6 * spotK * beamK);
          cone.visible = pool.visible = spotK > 0.001;
          // house lights: 0.42 on the first AND the last frame (only the beam's extra 0.14 fades out), so the loop never flashes
          $("#dim").style.opacity = SPOT ? (0.42 + 0.14 * spotK * outK).toFixed(3) : "0";
          ground.material.opacity = cl(prog(t, T.rise[3] - 0.2, 0.4)) * outK;

          // exit: the cards fold back onto their steps and fade first, then the steps sink into the floor (#3, #2, then #1)
          const cardOut = E.p2i(prog(t, T.out, 0.18));
          const SY = {};
          [3, 2, 1].forEach((r) => {
            const B = BLOCK[r], t0 = T.rise[r], dur = r === 1 ? T.riseDur1 : T.riseDur;
            // rise: the step grows straight up out of the floor (height 0 → 1, power3.out). It is fully opaque the whole time
            // and never passes below the floor, so nothing is see-through and nothing is sliced.
            const up = E.p3o(prog(t, t0, dur));
            const down = E.p3i(prog(t, T.out + 0.04 + (3 - r) * 0.03, 0.24));
            const sy = up * (1 - down); SY[r] = sy;
            blocks[r].visible = sy > 0.004;
            blocks[r].scale.set(1, Math.max(sy, 0.004), 1);
            // the numeral rides its step at true proportions and is never taller than 80% of the visible step
            const sn = Math.min(1, sy * B.h * NUMCAP / NUMH[r]);
            const slam = r === 1 && t >= T.slam ? lerp(1.15, 1, E.p2o(prog(t, T.slam, 3 / 30))) : 1;   // the "1" slam: 1.15 → 1 in 3 frames
            const ns = sn * slam;
            nums[r].visible = sn > 0.02;
            nums[r].scale.set(ns, ns / Math.max(sy, 0.004), ns);
            const env = SPOT && r !== 1 ? lerp(0.85, 0.6, spotK) : 1;
            mats[r].block.envMapIntensity = env;
            if (mats[r].face) {
              mats[r].face.envMapIntensity = 0.8 * env; mats[r].face.emissiveIntensity = FACE_LIFT * env;
              mats[r].wall.envMapIntensity = env; mats[r].wall.userData.hi.value = TOP_HI * env;
            }
            gloss[r].material.color.setScalar(env);
            contacts[r].material.opacity = 0.6 * cl(sy * 1.6);

            // clip card hinges up from the top face once the step is nearly up
            const cs = t0 + dur * 0.45;
            const ck = E.expo(prog(t, cs, 0.5));
            const c = cards[r];
            const q = cardQuad(r, B.h * sy, lerp(lerp(1.35, CARD_TILT, ck), 1.35, cardOut), 0.05 * (1 - ck));
            pin(c, CARD[r].w * DOMPX, CARD[r].h * DOMPX, q[0], q[1], q[2], q[3]);
            const cardOp = cl(prog(t, cs, 0.15)) * (1 - cardOut);
            c.style.opacity = cardOp.toFixed(3);
            seats[r].material.opacity = 0.55 * cl(prog(t, cs + 0.1, 0.25)) * (1 - cardOut);   // the card's contact shadow on the step top
            // runners-up under the spotlight: the footage drops into shadow (saturate .65, brightness .8, plus a dark dimmer
            // of 0.25, then 0.35 once the chip lands) instead of a milky veil; the name and number stay
            const dimK = SPOT && r !== 1 ? spotK : 0;
            const dimMore = SPOT && r !== 1 ? E.p2io(prog(t, T.dimMore, 0.4)) : 0;
            c.querySelector(".dimmer").style.opacity = (0.25 * dimK + 0.1 * dimMore).toFixed(3);
            if (SPOT && r !== 1) vids[r].style.filter = dimK > 0 ? "saturate(" + (1 - 0.35 * dimK).toFixed(3) + ") brightness(" + (1 - 0.2 * dimK).toFixed(3) + ")" : "none";
            const lk = E.p3o(prog(t, cs + 0.2, 0.35));
            const lab = c.querySelector(".lab");
            lab.style.opacity = (lk * (1 - 0.12 * dimK)).toFixed(3); lab.style.transform = "translateY(" + ((1 - lk) * 22).toFixed(2) + "px)";
            const En = V.entries[r - 1];
            if (En.count != null) {
              const rk2 = E.p2o(prog(t, cs + 0.2, r === 1 ? 1.5 : 0.7));
              c.querySelector(".meta").textContent = (En.count * rk2).toFixed(1) + En.unit;
            }
          });

          // the slam: one sunset sweep crosses the "1", and the winner's sunset rim ignites (and goes out as its step sinks)
          faceMat1.uniforms.uSweep.value = lerp(-0.25, 1.3, E.p2io(prog(t, T.slam + 0.02, 0.5)));
          rimMat.uniforms.uGlow.value = E.expo(prog(t, T.slam, 0.4)) * cl(SY[1] * 1.5 - 0.5);
          // spotlight variant: the beam lands with a 0.3 s bloom on the "1"
          faceMat1.uniforms.uBloom.value = SPOT ? Math.sin(Math.PI * prog(t, T.spotlight + 0.3, 0.3)) : 0;

          // the beam lands on the top of #1's card (spotlight variant)
          if (SPOT) cards[1].querySelector(".kiss").style.opacity = spotK.toFixed(3);

          // #1 card sheen once the camera has settled
          const shk = E.p2io(prog(t, CAM_HOLD + 0.15, 0.7));
          cards[1].querySelector(".sheen").style.left = lerp(-60, 125, shk).toFixed(2) + "%";

          // record chip on #1 (spotlight variant)
          if (V.entries[0].chip) {
            const chk = E.p3o(prog(t, T.spotlight + 0.9, 0.35));
            const chip = cards[1].querySelector(".chip");
            chip.style.opacity = chk.toFixed(3); chip.style.transform = "translateY(" + ((1 - chk) * -12).toFixed(2) + "px)";
          }

          renderer.render(scene, camera);
        }

        document.fonts.ready.then(() => {
          layoutCards();
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#kicker", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, T.titleIn);
          tl.fromTo("#head", { y: 34, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, T.titleIn + 0.1);
          tl.to("#ov", { opacity: 0, duration: 0.35, ease: "power2.in" }, T.out);
          // the 3D scene + pinned DOM: one proxy whose setter renders the frame for the timeline's time (seek-safe)
          const clock = { _t: 0 };
          Object.defineProperty(clock, "t", { get() { return this._t; }, set(v) { this._t = v; renderAt(v); } });
          tl.fromTo(clock, { t: 0 }, { t: T.end, duration: T.end, ease: "none", immediateRender: true }, 0);
          tl.set({}, {}, T.end);
          window.addEventListener("hf-seek", (e) => { if (e && e.detail && typeof e.detail.time === "number") renderAt(e.detail.time); });
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
          renderAt(0);
        });
      })();
    </script>
  </body>
</html>
