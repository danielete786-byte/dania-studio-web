     Variant "1" Thread: a handset rises, Lucia types, you reply, she answers.

     bg "plate" shows sample GTA VI footage; bg "none" renders a transparent overlay.
     Safe zone: every word sits inside x 72–936, y 230–1480. -->

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1080" data-height="1920">

    <script>
      const CONFIG = {
        contact: {
          name: "Lucia",
          subtitle: "Vice City",                       // line under the name in the thread header
          avatar: "assets/avatar/lucia.jpg",           // square image; "" falls back to a monogram
          initial: "L",
          carrier: "Leonida"                           // fictional in-world network tag (shown in caps); "" hides it
        },
        variants: {
          // 0, Notification: each text drops in as its own banner; older ones step back into a stack
          "0": {
            plate: "assets/plates/p03-jason-door-v.mp4",
            time: "now",
            messages: [
              "Pre-load's done. You ready for tomorrow?",
              "Nov 19. Vice City. Just you and me.",
              "I'm outside. Don't keep me waiting."
            ]
          },
          // 1, Thread: the handset rises, Lucia texts, you reply, she answers
          "1": {
            plate: "assets/plates/p07-convertible-v.mp4",
            statusTime: "11:58",
            stamp: "Wed, Nov 18 · 11:58 PM",
            placeholder: "Message",
            delivered: "Delivered",
            typingAfter: true,                       // she starts typing again during the final hold
            messages: [
              { from: "them", text: "You still up?" },
              { from: "them", text: "Pre-load's done." },
              { from: "me",   text: "Tomorrow. Vice City." },
              { from: "them", text: "Don't keep me waiting." }
            ]
          }
        },
        timing: {
          in: 0.08,          // first motion
          second: 2.0,       // Notification: second banner lands
          next: 1.8,         // Notification: gap before each later banner
          typingAt: 0.30,    // Thread: first "typing..." bubble
          typing: 0.35,      // Thread: how long "typing..." shows before each of her texts
          read: 0.55,        // Thread: pause after each of her texts
          cps: 20,           // Thread: your typing speed
          out: 6.5,          // start of the exit
          end: 7.0
        }
      };

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const vKey = CONFIG.variants[String(VARS.variant)] ? String(VARS.variant) : "0";
        const showPlate = VARS.bg !== "none";
        const V = CONFIG.variants[vKey], T = CONFIG.timing, C = CONFIG.contact;
        const $ = (s) => document.querySelector(s);

        document.querySelectorAll("video.plate").forEach((v) => {
          if (!showPlate || v.getAttribute("src") !== V.plate) v.style.display = "none";
        });

        function avatar(size) {
          if (C.avatar) { const img = document.createElement("img"); img.src = C.avatar; img.alt = C.name; return img; }
          const m = document.createElement("div"); m.className = "mono"; m.textContent = C.initial || C.name.charAt(0); return m;
        }

        const builders = [];

        // ---------------- Variant 0: notification ----------------
        if (vKey === "0") {
          const wrap = $("#notifWrap"), tpl = $("#ntTpl");
          wrap.classList.remove("hidden");
          tpl.removeAttribute("id");
          tpl.remove();
          const tag = [C.carrier, V.time].filter(Boolean).join(" · ");
          // one banner per text, newest on top
          const cards = V.messages.map((text, i) => {
            const c = tpl.cloneNode(true);
            c.id = "nt" + i;
            c.style.zIndex = String(10 + i);
            c.querySelector(".nt-av").insertBefore(avatar(), c.querySelector(".nt-app"));
            c.querySelector(".nt-name").textContent = C.name;
            c.querySelector(".nt-tag").textContent = tag;
            c.querySelector(".nt-msg").textContent = text;
            wrap.appendChild(c);
            return c;
          });
          builders.push((tl) => {
            const F = 1 / 30;
            const onFrame = (t) => Math.round(t * 30) / 30;
            // stack depths: front card, first stack edge (34 px lip), second edge, gone
            const DEPTH = [
              { y: 0,  scale: 1,    opacity: 1 },
              { y: 34, scale: 0.94, opacity: 0.72 },
              { y: 62, scale: 0.88, opacity: 0.42 },
              { y: 82, scale: 0.84, opacity: 0 }
            ];
            cards.forEach((c) => gsap.set(c, { transformOrigin: "50% 100%", x: 0, y: -60, scale: 1, opacity: 0 }));
            // a 2-cycle haptic nudge (±6 px), frame-aligned so every rendered frame lands on a peak
            const nudge = (el, t0) => {
              let t = onFrame(t0), prev = 0;
              [6, -6, 6, -6, 0].forEach((x) => { tl.fromTo(el, { x: prev }, { x: x, duration: F, ease: "power2.inOut", immediateRender: false }, t); t += F; prev = x; });
            };
            // the first banner drops in from the top edge
            tl.fromTo(cards[0], { opacity: 0, y: -90, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, T.in);
            nudge(cards[0], T.in + 0.42);
            for (let k = 1; k < cards.length; k++) {
              const t2 = onFrame(T.second + (k - 1) * T.next);
              // the current front card clears its content just before the new banner lands,
              // so its text is gone on the frame the new card first appears
              // (frame-aligned: its last visible frame is t2, the new card's first is t2 + 1 frame, so no frame is empty or doubled)
              tl.fromTo(cards[k - 1].querySelectorAll(".nt-av, .nt-main"), { opacity: 1 }, { opacity: 0, duration: 3 * F, ease: "none", immediateRender: false }, t2 - 2 * F);
              // every older card steps one level back into the stack
              for (let j = 0; j < k; j++) {
                const from = Math.min(k - 1 - j, 3), to = Math.min(k - j, 3);
                if (from === to) continue;
                tl.fromTo(cards[j], { ...DEPTH[from] }, { ...DEPTH[to], duration: 0.38, ease: "expo.out", immediateRender: false }, t2);
                if (from === 0) tl.fromTo(cards[j].querySelector(".nt-veil"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, t2);
              }
              // the new banner drops in on top
              tl.fromTo(cards[k], { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.38, ease: "expo.out", immediateRender: false }, t2);
              nudge(cards[k], t2 + 0.3);
            }
            tl.fromTo(wrap, { opacity: 1, y: 0 }, { opacity: 0, y: -70, duration: 0.38, ease: "power3.in", immediateRender: false }, T.out);
          });
        }

        // ---------------- Variant 1: thread ----------------
        if (vKey === "1") {
          $("#phone").classList.remove("hidden");
          $("#hdAv").replaceWith(avatar());
          $("#hdName").textContent = C.name;
          $("#hdSub").textContent = C.subtitle;
          $("#sbTime").textContent = V.statusTime;
          $("#sbCarrier").textContent = C.carrier || "";
          $("#chip").textContent = V.stamp;
          $("#ph").textContent = V.placeholder;
          const msgs = $("#msgs");
          const rows = V.messages.map((m, i) => {
            const next = V.messages[i + 1], prev = V.messages[i - 1];
            const row = document.createElement("div");
            row.className = "row " + m.from + (!next || next.from !== m.from ? " tail" : "") + (prev && prev.from !== m.from ? " gap" : "");
            const b = document.createElement("div"); b.className = "bub"; b.textContent = m.text; row.appendChild(b);
            let typing = null;
            if (m.from === "them") { typing = document.createElement("div"); typing.className = "typing"; typing.innerHTML = "<i></i><i></i><i></i>"; row.appendChild(typing); }
            msgs.appendChild(row);
            let dlv = null;
            if (m.from === "me" && V.delivered && !V.messages.slice(i + 1).some((x) => x.from === "me")) {
              dlv = document.createElement("div"); dlv.className = "dlv lbl"; dlv.textContent = V.delivered; msgs.appendChild(dlv);
            }
            return { m, row, b, typing, dlv };
          });
          // a trailing "typing..." row so the last beat keeps breathing until the exit
          let tail = null;
          if (V.typingAfter) {
            const row = document.createElement("div"); row.className = "row them";
            tail = document.createElement("div"); tail.className = "typing"; tail.innerHTML = "<i></i><i></i><i></i>";
            row.appendChild(tail); msgs.appendChild(row);
          }

          builders.push((tl) => {
            const K = window.KitMotion;
            gsap.set("#phone", { opacity: 0, y: 260 });
            gsap.set("#chip", { opacity: 0 });
            rows.forEach((r) => { gsap.set(r.b, { opacity: 0 }); if (r.typing) gsap.set(r.typing, { opacity: 0, scale: 0.6, transformOrigin: "0% 100%" }); if (r.dlv) gsap.set(r.dlv, { opacity: 0 }); });
            gsap.set("#send", { scale: 0, opacity: 0 });

            // the handset rises into frame
            tl.fromTo("#phone", { opacity: 0, y: 260, rotation: 3 }, { opacity: 1, y: 0, rotation: 0, duration: 0.6, ease: "expo.out", immediateRender: false }, T.in);
            K.fadeUp(tl, "#chip", T.in + 0.1, { distance: 10 });

            const dots = (el, t0, t1) => {
              const ds = el.querySelectorAll("i");
              K.drive(tl, t0, t1 - t0, (p) => {
                const tt = (t1 - t0) * p;
                ds.forEach((d, i) => {
                  const s = 0.5 + 0.5 * Math.sin((tt * 2.6 - i * 0.2) * 2 * Math.PI - Math.PI / 2);
                  d.style.opacity = (0.35 + 0.6 * s).toFixed(3);
                  d.style.transform = "translateY(" + (-5 * s).toFixed(2) + "px)";
                });
              });
            };

            let t = T.typingAt;
            rows.forEach((r, i) => {
              if (r.m.from === "them") {
                const tIn = t, tMsg = t + T.typing;
                tl.fromTo(r.typing, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(1.4)", immediateRender: false }, tIn);
                dots(r.typing, tIn, tMsg);
                tl.fromTo(r.typing, { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "power1.out", immediateRender: false }, tMsg);
                tl.fromTo(r.b, { opacity: 0, scale: 0.86, y: 8, transformOrigin: "0% 100%" }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(1.2)", immediateRender: false }, tMsg);
                t = tMsg + T.read;
              } else {
                const tType = t;
                tl.fromTo("#send", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.26, ease: "back.out(1.6)", immediateRender: false }, tType + 0.02);
                const tSend = tType + (r.m.text.length - 1) / T.cps + 0.28;   // typeText's last key lands at tType + (n-1)/cps
                K.typeText(tl, "#draft", r.m.text, tType, { cps: T.cps, caretUntil: tSend });
                tl.fromTo("#phWrap", { opacity: 1 }, { opacity: 0, duration: 0.01, ease: "none", immediateRender: false }, tType);
                // press send; the draft leaves the field and lands as a bubble
                tl.fromTo("#send", { scale: 1 }, { scale: 0.86, duration: 0.07, ease: "power2.out", immediateRender: false }, tSend - 0.08);
                tl.fromTo("#send", { scale: 0.86, opacity: 1 }, { scale: 0, opacity: 0, duration: 0.22, ease: "power2.in", immediateRender: false }, tSend);
                tl.fromTo("#draftWrap", { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "none", immediateRender: false }, tSend);
                tl.fromTo("#phWrap", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none", immediateRender: false }, tSend + 0.15);
                tl.fromTo(r.b, { opacity: 0, scale: 0.9, y: 90, transformOrigin: "100% 100%" }, { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "expo.out", immediateRender: false }, tSend);
                if (r.dlv) tl.fromTo(r.dlv, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out", immediateRender: false }, tSend + 0.4);
                t = tSend + 0.62;
              }
            });

            if (tail) {
              const tIn = t + 0.35;
              gsap.set(tail, { opacity: 0, scale: 0.6, transformOrigin: "0% 100%" });
              tl.fromTo(tail, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(1.4)", immediateRender: false }, tIn);
              dots(tail, tIn, T.out + 0.42);
            }

            // the handset drops away to loop clean
            tl.fromTo("#phone", { opacity: 1, y: 0 }, { opacity: 0, y: 220, duration: 0.42, ease: "power3.in", immediateRender: false }, T.out);
          });
        }

        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true });
          builders.forEach((b) => b(tl));
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  </body>
</html>
