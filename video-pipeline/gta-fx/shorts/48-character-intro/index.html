<!doctype html>
<!-- #48 Character intro — GTA 6 component, 1080x1920 (9:16), 30 fps, 5.5 s. FULL-FRAME: always shows footage.
     Variant 0 "Freeze + name": the clip plays, freezes on the character, and a big two-line name with a role line lands.
       The freeze is built from framework-owned media only (arbitrary mid-source freeze is not a HyperFrames primitive):
         play    data-media-start = clipStart, until freezeAt
         hold    a chain of 0.3 s clips (last one 0.1 s), each data-media-start = clipStart + freezeAt, data-playback-rate 0.1 (one frame each)
         resume  data-media-start = clipStart + freezeAt, from resumeAt to the end (so the loop starts on moving footage)
     Variant 1 "Switch wheel": a character switch wheel opens over slowed footage on PLAYING AS / JASON, the selection travels to
       SWITCH TO / LUCIA, the plate punches out, hard-cuts on a warm 2-frame flash to the new character, and the selected portrait
       flies up into a "PLAYING AS" HUD chip.
     Clip paths live in CONFIG; they must match the src of the <video data-cfg="..."> tags (the script re-applies them).
     Safe zone: every text element sits inside x 72–936, y 230–1480. -->
<html lang="en" data-composition-variables='[
  {"id":"variant","type":"enum","label":"Variant","default":"0","options":[{"value":"0","label":"Freeze + name"},{"value":"1","label":"Switch wheel"}]},
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Footage (CONFIG clips)"},{"value":"none","label":"Footage (full-frame: always on)"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      /* ===================== CONFIG: all content for both variants ===================== */
      const CONFIG = {
        duration: 5.5,         // must match data-duration on #root and #ov

        /* Variant 0 — Freeze + name */
        freeze: {
          clip: "assets/plates/p06-lucia-gate-v.mp4",   // must match every <video data-cfg="freeze"> src
          clipStart: 2.6,      // seconds into the clip where playback starts (= data-media-start of #v0play)
          freezeAt: 1.1,       // composition second the picture freezes  -> frozen source frame = 2.6 + 1.1 = 3.7 s
          resumeAt: 3.9,       // composition second the picture plays again (2.8 s hold; overlay is gone by 4.35)
          index: "01 / 02",
          first: "LUCIA",
          last: "CAMINOS",     // gets the Leonida sunset gradient (the one accent)
          role: "PROTAGONIST · LEONIDA",
          nameSize: 236,       // px; auto-shrinks to fit maxWidth
          maxWidth: 864,       // x 72 → 936
          top: 900,            // y of the index row; the name block runs to ~y 1450
          pushOrigin: "30% 24%" // punch-in target on the frozen frame (the face)
        },

        /* Variant 1 — Switch wheel */
        wheel: {
          open: 0.30,          // wheel opens on the current character, footage drops to slow motion (rate set on #v1jB)
          select: 1.10,        // selection travels from `from` to `to`, kicker rolls PLAYING AS -> SWITCH TO
          confirm: 2.60,       // switch: plate punches out; hard cut + flash at confirm + 0.3 (keep that on a frame: 2.9 = frame 87)
          out: 5.05,           // HUD chip clears (gone by 5.4)
          playing: "PLAYING AS", // kicker while the current character is selected, and the HUD chip label after the switch
          kicker: "SWITCH TO",   // kicker once the selector reaches the new character
          from: {
            first: "JASON", last: "DUVAL",
            plate: "assets/plates/p03-jason-door-v.mp4",     // #v1jA / #v1jB
            portrait: { clip: "assets/plates/p03-jason-door-v.mp4", fx: 275, fy: 300, span: 440 } // face centre + crop width in source px (1080x1920); sunlit door shot, source 0.15 s
          },
          to: {
            first: "LUCIA", last: "CAMINOS",
            plate: "assets/plates/p06-lucia-gate-v.mp4",     // #v1lu
            portrait: { clip: "assets/plates/p06-lucia-gate-v.mp4", fx: 290, fy: 430, span: 560 }
          }
        }
      };
    </script>
    <style>
      @font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 900; font-display: block; src: url("assets/fonts/BarlowCondensed-Black.ttf") format("truetype"); }
      @font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: block; src: url("assets/fonts/Inter-normal.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 100 800; font-display: block; src: url("assets/fonts/JetBrainsMono-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0B0B0E; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; color: #fff;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; font-feature-settings: "tnum" 1, "ss01" 1; background: #0B0B0E; }

      }

      /* ---------- footage stages ---------- */
      .stage { position: absolute; inset: 0; overflow: hidden; }
      .stage-in { position: absolute; inset: 0; will-change: transform, filter; }
      .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #s0in { transform-origin: 30% 24%; }

      #flash { position: absolute; inset: 0; background: #FFC88F; opacity: 0; }

      /* ---------- Variant 0: freeze + name ---------- */
      #scrim0 { position: absolute; inset: 0; opacity: 0;
        background: linear-gradient(180deg, rgba(11,11,14,0) 38%, rgba(11,11,14,.28) 50%, rgba(11,11,14,.66) 66%, rgba(11,11,14,.80) 82%, rgba(11,11,14,.70) 100%); }
      #intro { position: absolute; left: 72px; top: 900px; width: 864px; }
      #kick { display: flex; align-items: center; gap: 22px; height: 34px; opacity: 0;

        text-shadow: var(--shadow-type); }

        box-shadow: 0 1px 3px rgba(0,0,0,.35); }

      .ln { display: inline-block; font-family: "Barlow Condensed", sans-serif; font-weight: 900; font-size: 200px; line-height: 0.84;
        letter-spacing: 0.006em; text-transform: uppercase; white-space: nowrap; color: #fff; text-shadow: var(--shadow-type); }

        background-size: 250% 100%, 100% 100%; background-position: var(--sx) 50%, 0% 50%; background-repeat: no-repeat;

      #role { margin-top: 22px; font-weight: 600; font-size: 28px; line-height: 34px; letter-spacing: 0.42em; text-transform: uppercase;
        color: rgba(255,255,255,.94); text-shadow: var(--shadow-type); white-space: nowrap; opacity: 0; }

      /* ---------- Variant 1: switch wheel ---------- */
      #vig1 { position: absolute; inset: 0; opacity: 0;
        background: radial-gradient(640px 640px at 504px 1120px, rgba(8,8,12,.42) 0%, rgba(8,8,12,.22) 55%, rgba(8,8,12,0) 100%),
                    linear-gradient(180deg, rgba(8,8,12,.18), rgba(8,8,12,.05) 40%, rgba(8,8,12,.30)); }
      #wheel { position: absolute; left: 204px; top: 820px; width: 600px; height: 600px; border-radius: 50%; opacity: 0;

        -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 0 0 2px rgba(255,255,255,.16), 0 0 0 1px rgba(0,0,0,.28),
                    0 2px 4px rgba(0,0,0,.3), 0 40px 90px -30px rgba(0,0,0,.75); }
      #wheel .tick { position: absolute; left: 299px; width: 2px; height: 16px; background: rgba(255,255,255,.42); border-radius: 1px; }
      #wheel .tick.t { top: 14px; } #wheel .tick.b { bottom: 14px; }
      #ctr { position: absolute; left: 100px; top: 199px; width: 400px; text-align: center; }
      #kWin { height: 36px; }
      #kWin span { font-weight: 600; font-size: 30px; line-height: 36px; letter-spacing: 0.42em; padding-left: 0.42em; color: rgba(255,255,255,.92); }
      .win { position: relative; overflow: hidden; }

      #snWin { height: 36px; margin-top: 8px; }
      #snWin span { font-weight: 600; font-size: 30px; line-height: 36px; letter-spacing: 0.42em; padding-left: 0.42em; color: rgba(255,255,255,.92); }
      #selWrap { position: absolute; left: 194px; top: 810px; width: 620px; height: 620px; opacity: 0; transform: rotate(130deg); }

        box-shadow: 0 2px 4px rgba(0,0,0,.35), 0 26px 60px -14px rgba(0,0,0,.75); }

        white-space: nowrap; clip-path: inset(0 0 0 100%); }
    </style>
  </head>
  <body>

          <video id="v0hold00" data-cfg="freeze" class="clip" data-layout-allow-overflow src="assets/plates/p06-lucia-gate-v.mp4" muted playsinline data-start="1.1" data-duration="0.3" data-media-start="3.7" data-playback-rate="0.1" data-track-index="0"></video>
          <video id="v0hold01" data-cfg="freeze" class="clip" data-layout-allow-overflow src="assets/plates/p06-lucia-gate-v.mp4" muted playsinline data-start="1.4" data-duration="0.3" data-media-start="3.7" data-playback-rate="0.1" data-track-index="0"></video>
          <video id="v0hold02" data-cfg="freeze" class="clip" data-layout-allow-overflow src="assets/plates/p06-lucia-gate-v.mp4" muted playsinline data-start="1.7" data-duration="0.3" data-media-start="3.7" data-playback-rate="0.1" data-track-index="0"></video>
          <video id="v0hold03" data-cfg="freeze" class="clip" data-layout-allow-overflow src="assets/plates/p06-lucia-gate-v.mp4" muted playsinline data-start="2" data-duration="0.3" data-media-start="3.7" data-playback-rate="0.1" data-track-index="0"></video>
          <video id="v0hold04" data-cfg="freeze" class="clip" data-layout-allow-overflow src="assets/plates/p06-lucia-gate-v.mp4" muted playsinline data-start="2.3" data-duration="0.3" data-media-start="3.7" data-playback-rate="0.1" data-track-index="0"></video>
          <video id="v0hold05" data-cfg="freeze" class="clip" data-layout-allow-overflow src="assets/plates/p06-lucia-gate-v.mp4" muted playsinline data-start="2.6" data-duration="0.3" data-media-start="3.7" data-playback-rate="0.1" data-track-index="0"></video>
          <video id="v0hold06" data-cfg="freeze" class="clip" data-layout-allow-overflow src="assets/plates/p06-lucia-gate-v.mp4" muted playsinline data-start="2.9" data-duration="0.3" data-media-start="3.7" data-playback-rate="0.1" data-track-index="0"></video>
          <video id="v0hold07" data-cfg="freeze" class="clip" data-layout-allow-overflow src="assets/plates/p06-lucia-gate-v.mp4" muted playsinline data-start="3.2" data-duration="0.3" data-media-start="3.7" data-playback-rate="0.1" data-track-index="0"></video>
          <video id="v0hold08" data-cfg="freeze" class="clip" data-layout-allow-overflow src="assets/plates/p06-lucia-gate-v.mp4" muted playsinline data-start="3.5" data-duration="0.3" data-media-start="3.7" data-playback-rate="0.1" data-track-index="0"></video>
          <video id="v0hold09" data-cfg="freeze" class="clip" data-layout-allow-overflow src="assets/plates/p06-lucia-gate-v.mp4" muted playsinline data-start="3.8" data-duration="0.1" data-media-start="3.7" data-playback-rate="0.1" data-track-index="0"></video>
          <video id="v0resume" data-cfg="freeze" class="clip" data-layout-allow-overflow src="assets/plates/p06-lucia-gate-v.mp4" muted playsinline data-start="3.9" data-duration="1.6" data-media-start="3.7" data-track-index="0"></video>
        </div>
      </div>

      <!-- ===== Variant 1 footage: the current character (real speed → slow-mo while the wheel is open) ===== -->
      <div id="stage1a" class="stage" data-v="1">
        <div id="s1a" class="stage-in" data-layout-allow-overflow>
          <video id="v1jA" data-cfg="from" class="clip" data-layout-allow-overflow src="assets/plates/p03-jason-door-v.mp4" muted playsinline data-start="0" data-duration="0.3" data-media-start="4" data-track-index="1"></video>

        <!-- ===== Variant 1 overlay ===== -->
        <div id="o1" class="layer" data-v="1">
          <div id="vig1"></div>

            <i class="tick t"></i><i class="tick b"></i>

          </div>

      </div>

    <script>
      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const vKey = String(VARS.variant) === "1" ? "1" : "0";
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => Array.from(document.querySelectorAll(s));
        const F = CONFIG.freeze, W = CONFIG.wheel;

        // Footage always shows (full-frame component). Clip paths come from CONFIG.
        const SRC = { freeze: F.clip, from: W.from.plate, to: W.to.plate, fromPortrait: W.from.portrait.clip, toPortrait: W.to.portrait.clip };
        $$("video[data-cfg]").forEach((v) => {
          const want = SRC[v.dataset.cfg];
          if (want && v.getAttribute("src") !== want) { v.setAttribute("src", want); console.warn("[character-intro] src taken from CONFIG for", v.id); }
        });
        $$("[data-v]").forEach((el) => { if (el.dataset.v !== vKey) el.style.display = "none"; });

        // ---- content from CONFIG ----
        $("#kIdx").textContent = F.index;
        $("#ln1").textContent = F.first;
        $("#ln2").textContent = F.last;
        $("#role").textContent = F.role;
        $("#intro").style.top = F.top + "px";
        $("#s0in").style.transformOrigin = F.pushOrigin;
        $("#kA").textContent = W.playing; $("#kB").textContent = W.kicker;
        $("#nmA").textContent = W.from.first; $("#nmB").textContent = W.to.first;
        $("#snA").textContent = W.from.last;  $("#snB").textContent = W.to.last;
        $("#chipLab").textContent = W.playing;
        $("#chipName").textContent = W.to.first + " " + W.to.last;

        // portrait framing: crop the 1080x1920 clip around the face (fx, fy) at `span` source px across the 220 px face
        function framePortrait(v, p) {
          const D = 220, s = D / p.span;
          Object.assign(v.style, { width: 1080 * s + "px", height: 1920 * s + "px", left: (D / 2 - p.fx * s) + "px", top: (D / 2 - p.fy * s) + "px" });
        }
        framePortrait($("#v1pj"), W.from.portrait);
        framePortrait($("#v1pl"), W.to.portrait);

        document.fonts.ready.then(() => {
          // fit the freeze name inside the safe width
          let fs = F.nameSize;
          $$(".ln").forEach((el) => (el.style.fontSize = fs + "px"));
          const wMax = Math.max(...$$(".ln").map((el) => el.offsetWidth));
          if (wMax > F.maxWidth) { fs = Math.floor(fs * F.maxWidth / wMax); $$(".ln").forEach((el) => (el.style.fontSize = fs + "px")); }
          // fit the wheel centre name inside the disc gap
          const nmMax = Math.max(...$$("#nmWin span").map((el) => { el.style.display = "inline-block"; const w = el.offsetWidth; el.style.display = ""; return w; }));
          if (nmMax > 360) $$("#nmWin span").forEach((el) => (el.style.fontSize = Math.floor(112 * 360 / nmMax) + "px"));

          const tl = gsap.timeline({ paused: true });
          const END = CONFIG.duration;

          if (vKey === "0") {
            const T = F.freezeAt, OUT = F.resumeAt, FR = 1 / 30;
            const GRADE0 = "saturate(1) contrast(1) brightness(1)", GRADE1 = "saturate(0.55) contrast(1.18) brightness(0.84)";
            // freeze hit on frame T: warm 2-frame flash (0.35 -> 0.175 -> 0), 4-frame shake (<= 7 px), punch-in toward the face, hard grade
            tl.to("#flash", { opacity: 0.35, duration: FR, ease: "none" }, T - FR);
            tl.to("#flash", { opacity: 0, duration: 2 * FR, ease: "none" }, T);
            tl.fromTo("#stage0", { x: 0, y: 0 }, { x: 7, y: -3, duration: FR, ease: "none" }, T);
            tl.to("#stage0", { x: -5, y: 2, duration: FR, ease: "none" }, T + FR);
            tl.to("#stage0", { x: 3, y: -1, duration: FR, ease: "none" }, T + 2 * FR);
            tl.to("#stage0", { x: 0, y: 0, duration: FR, ease: "none" }, T + 3 * FR);
            tl.fromTo("#s0in", { scale: 1 }, { scale: 1.06, duration: 0.4, ease: "expo.out" }, T);
            // the still keeps moving: 1.06 -> 1.14 across the hold
            tl.to("#s0in", { scale: 1.14, duration: OUT - T - 0.4, ease: "none" }, T + 0.4);
            tl.fromTo("#s0in", { filter: GRADE0 }, { filter: GRADE1, duration: 2 * FR, ease: "none" }, T);
            tl.fromTo("#scrim0", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, T);
            // type lands: index row, name lines (mask up), role line
            tl.fromTo("#kick", { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, T + 0.06);
            tl.fromTo("#kRule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, T + 0.12);
            tl.fromTo("#ln1", { yPercent: 112 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, T + 0.08);
            tl.fromTo("#ln2", { yPercent: 112 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, T + 0.15);
            tl.fromTo("#role", { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, T + 0.28);
            // hold: one sheen pass across CAMINOS (the sunset itself stays put, pink on the C) + a few px of parallax drift
            tl.fromTo("#ln2", { "--sx": "100%" }, { "--sx": "0%", duration: 0.75, ease: "power2.inOut" }, T + 0.4);
            tl.fromTo("#intro", { x: 0 }, { x: -10, duration: OUT - T, ease: "none" }, T);
            // exit + unfreeze (footage resumes at OUT and plays to the end, so the loop restarts on motion)
            tl.to(["#ln1", "#ln2"], { yPercent: -112, duration: 0.3, ease: "power2.in", stagger: 0.05 }, OUT - 0.05);
            tl.to(["#kick", "#role"], { opacity: 0, duration: 0.25, ease: "power2.in" }, OUT - 0.05);
            tl.to("#scrim0", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, OUT + 0.05);
            tl.to("#s0in", { filter: GRADE0, duration: 0.4, ease: "power2.inOut" }, OUT + 0.05);
            tl.to("#s0in", { scale: 1, duration: 0.5, ease: "power2.inOut" }, OUT);
          } else {
            const O = W.open, S = W.select, C = W.confirm, X = W.out, FR = 1 / 30, CUT = C + 0.3;
            const P0 = "saturate(1) brightness(1) blur(0px)", P1 = "saturate(0.55) brightness(0.76) blur(3px)", P2 = "saturate(0.5) brightness(1.1) blur(24px)";
            const FACE_ON = "grayscale(0) brightness(1)", FACE_OFF = "grayscale(0.6) brightness(0.92)";
            gsap.set("#dJ .rg-s", { opacity: 1 });
            gsap.set("#dL .face", { filter: FACE_OFF });
            gsap.set(["#kB", "#nmB", "#snB"], { yPercent: 100 });
            // open: footage dims + slows, glass wheel scales in, portraits pop, selection arc draws on the CURRENT character (PLAYING AS)
            tl.fromTo("#s1a", { filter: P0 }, { filter: P1, duration: 0.4, ease: "power2.out" }, O);
            tl.fromTo("#vig1", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, O);
            tl.fromTo("#wheel", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "expo.out" }, O);
            tl.fromTo("#dJ", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, O + 0.08);
            tl.fromTo("#dL", { scale: 0.5, opacity: 0 }, { scale: 0.8, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, O + 0.14);
            tl.fromTo("#selWrap", { opacity: 0 }, { opacity: 1, duration: 0.01 }, O + 0.22);
            tl.fromTo("#selArc", { strokeDashoffset: 523.6 }, { strokeDashoffset: 0, duration: 0.35, ease: "power3.out" }, O + 0.22);
            tl.fromTo("#chev", { y: -14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, O + 0.3);
            tl.fromTo("#kA", { yPercent: 100 }, { yPercent: 0, duration: 0.4, ease: "expo.out" }, O + 0.1);
            tl.fromTo("#nmA", { yPercent: 100 }, { yPercent: 0, duration: 0.4, ease: "expo.out" }, O + 0.14);
            tl.fromTo("#snA", { yPercent: 100 }, { yPercent: 0, duration: 0.4, ease: "expo.out" }, O + 0.2);
            // select: arc travels over the top of the wheel to the new character, discs swap state, kicker + names roll
            tl.to("#chev", { y: -10, opacity: 0, duration: 0.12, ease: "power2.in" }, S);
            tl.set("#chev", { x: 600, y: -14 }, S + 0.13);
            tl.fromTo("#selWrap", { rotation: 130 }, { rotation: 310, duration: 0.5, ease: "power3.inOut" }, S);
            tl.to("#dJ", { scale: 0.8, duration: 0.3, ease: "power3.out" }, S + 0.05);
            tl.to("#dJ .rg-s", { opacity: 0, duration: 0.25 }, S + 0.05);
            tl.to("#dJ .face", { filter: FACE_OFF, duration: 0.3 }, S + 0.05);
            tl.to("#dL", { scale: 1, duration: 0.42, ease: "back.out(1.4)" }, S + 0.3);
            tl.to("#dL .rg-s", { opacity: 1, duration: 0.25 }, S + 0.32);
            tl.to("#dL .face", { filter: FACE_ON, duration: 0.3 }, S + 0.3);
            tl.to("#chev", { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, S + 0.45);
            tl.to(["#kA", "#nmA", "#snA"], { yPercent: -100, duration: 0.22, ease: "power2.in", stagger: 0.04 }, S + 0.06);
            tl.fromTo("#kB", { yPercent: 100 }, { yPercent: 0, duration: 0.42, ease: "expo.out" }, S + 0.14);
            tl.fromTo("#nmB", { yPercent: 100 }, { yPercent: 0, duration: 0.42, ease: "expo.out" }, S + 0.18);
            tl.fromTo("#snB", { yPercent: 100 }, { yPercent: 0, duration: 0.42, ease: "expo.out" }, S + 0.24);
            // confirm pulse
            tl.to("#dL", { scale: 1.07, duration: 0.1, ease: "power2.out" }, C - 0.22);
            tl.to("#dL", { scale: 1, duration: 0.16, ease: "power2.inOut" }, C - 0.12);
            // switch: the wheel is pulled forward with the plate, which punches 1 -> 1.6 into a 24 px blur ...
            tl.to(["#wheel", "#selWrap", "#chev", "#dJ"], { scale: 1.14, opacity: 0, duration: 0.22, ease: "power2.in" }, C);
            tl.to("#vig1", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, C + 0.1);
            tl.to("#s1a", { scale: 1.6, filter: P2, duration: 0.3, ease: "power2.in" }, C);
            // ... hard cut on frame CUT with a warm 2-frame flash (0.4 -> 0.2 -> 0); the new character lands 1.25 -> 1
            tl.to("#stage1b", { opacity: 1, duration: FR, ease: "none" }, CUT - FR);
            tl.to("#flash", { opacity: 0.4, duration: FR, ease: "none" }, CUT - FR);
            tl.to("#flash", { opacity: 0, duration: 2 * FR, ease: "none" }, CUT);
            tl.fromTo("#s1b", { scale: 1.25, filter: "blur(10px) brightness(1.12)" }, { scale: 1, filter: "blur(0px) brightness(1)", duration: 0.45, ease: "expo.out" }, CUT);
            // the selected portrait flies up into the PLAYING AS HUD chip
            tl.to("#dL", { x: 876 - 804, y: 310 - 1120, scale: 0.5, duration: 0.6, ease: "expo.inOut" }, C + 0.05);
            tl.fromTo("#chipLab", { x: 16, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, C + 0.55);
            tl.fromTo("#chipName", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "expo.out" }, C + 0.62);
            // out
            tl.to(["#chip", "#dL"], { opacity: 0, duration: 0.35, ease: "power2.in" }, X);
          }

          tl.set({}, {}, END);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  </body>
