<!doctype html>
<!-- GTA 6 component #19 — Name tag (craft v2, round 10). 1080x1920 (9:16), 30 fps, 5 s.
     Identifies a character on screen.
     Variant 0 "Leader tag": a lock-on pin tracked to the character's collar, an elbow callout (pin → steep diagonal →
       horizontal leg that ends at the name's left edge), and the name set big in wide caps under the leg (white first
       name, Leonida-sunset surname). Held golden-hour slow-mo with a push. Payoff when the last surname glyph seats: a
       1-frame warm exposure flash from the sun, one warm leak from the sun side, a kick, a light pulse on the pin and a
       sheen across the sunset.
     Variant 1 "Lower third": the name is born in the blast and lands on the cut. Jason on the rooftop as the helicopter
       explodes behind him (s098 at 0.5x, motion-compensated); the surname rises in the fireball and its last glyph seats
       on the cut (1.033 s) to a sharp held profile of him driving (s008 at 1.0x, pushed in). The hit is on that cut: an
       exposure pulse (2 frames at peak), shake and punch, a 6 px RGB split for 0.12 s and a light sweep across the
       surname. A broadcast lower-third structure: small tracked first name over a huge surname, a drawn 2 px sunset
       hairline that leads into the role, set flush to the surname's measure. The type sits above the grain (pure white).
     bg "none": transparent overlay (no footage, no grain/vignette/exposure hit/leak/shake/fire light/bottom burn). Safe zone: x 72–936, y 230–1480. -->
<html lang="en" data-composition-variables='[
  {"id":"variant","type":"enum","label":"Variant","default":"0","options":[{"value":"0","label":"Leader tag"},{"value":"1","label":"Lower third"}]},
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/kit/look/look.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; color: #fff;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      .hide { display: none !important; }
      /* footage: #shake takes the payoff kick, #push the slow push */
      #frame { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      /* the payoff light: a warm additive exposure hit centred on the scene's light source (sun / fire). It sits over the
         footage and under the type, so it lights the image instead of greying the frame. */
      #xhit { position: absolute; inset: -60px; pointer-events: none; mix-blend-mode: screen; opacity: 0; }
      /* the leak lives over the footage and under the tag, so it lights the scene, never the name */
      #leakhost { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }

      /* ---------- v0: leader tag ---------- */
      #tag { position: absolute; inset: 0; }
      #lines { position: absolute; left: 0; top: 0; overflow: visible;
        filter: drop-shadow(0 0 6px rgba(255,190,120,.55)) drop-shadow(0 1px 2px rgba(0,0,0,.55)); }
      #lines path { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      #pin { position: absolute; left: 0; top: 0; width: 0; height: 0; }
      #pin .core { position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border-radius: 50%; background: #fff;
        box-shadow: 0 0 10px rgba(255,200,140,.85), 0 0 26px rgba(255,170,100,.45), 0 1px 3px rgba(0,0,0,.5); }
      #pin .ring { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%;
        border: 2.5px solid rgba(255,255,255,.95); box-shadow: 0 0 12px rgba(255,190,120,.5), inset 0 0 8px rgba(255,190,120,.25); }
      #pin .pulse { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%;
        border: 2px solid rgba(255,225,190,.9); opacity: 0; }
      /* the pin's light pulse on the hit: a warm point of light that blooms and decays (screen, so it only adds light) */
      #pin .flare { position: absolute; left: -90px; top: -90px; width: 180px; height: 180px; border-radius: 50%; opacity: 0;
        mix-blend-mode: screen; background: radial-gradient(circle, rgba(255,240,214,1) 0%, rgba(255,214,160,.75) 16%, rgba(254,170,90,.32) 38%, rgba(254,142,78,0) 70%); }
      #block0 { position: absolute; white-space: nowrap; }
      #block0 .nm { font-size: 124px; letter-spacing: .005em; }
      #n0a { filter: drop-shadow(0 0 22px rgba(255,190,125,.38)) drop-shadow(0 8px 22px rgba(0,0,0,.45)); }
      #n0b { margin-top: 2px; filter: drop-shadow(0 0 26px rgba(248,79,164,.28)) drop-shadow(0 8px 24px rgba(0,0,0,.5)); }
      #r0 { margin-top: 30px; font-size: 28px; letter-spacing: .34em; color: #fff;
        text-shadow: 0 1px 2px rgba(0,0,0,.6), 0 4px 16px rgba(0,0,0,.5); }
      #scrim0 { position: absolute; left: -200px; width: 1300px; height: 900px; opacity: .8; }

      /* ---------- v1: full-bleed lower third ---------- */
      #lower { position: absolute; inset: 0; }
      /* legibility comes from a bottom scrim plus a soft spot weighted to the lockup (part of the graphic, kept in bg:none) */
      #scrim1 { position: absolute; left: 0; width: 1080px; opacity: 0; }
      #spot1 { position: absolute; opacity: 0;
        background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(5,5,9,.55) 0%, rgba(5,5,9,.3) 50%, rgba(5,5,9,0) 100%); }
      #burn1 { position: absolute; left: 0; width: 1080px; opacity: 0; }
      /* the lockup: every part is placed absolutely from measured metrics (ink edges and baselines), see the v1 script */
      #block1 { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #block1 .ln { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; }
      /* first name: small, wide 600, tracked .22em, inside its own mask (generous padding so the tracking-in never clips) */
      #m1a { position: absolute; overflow: hidden; padding: 16px 140px 26px 16px; }
      #n1a { position: relative; font-size: 64px; font-weight: 600; letter-spacing: .22em; line-height: 1; white-space: nowrap; }
      /* surname: the hero, wide 800, pure white; its light is set per frame (fire glow + dark lift) */
      #n1b { font-size: 190px; letter-spacing: 0; }
      /* light sweep: the wrapper carries the moving band mask (padded so the glow is never cut at the word's ends);
         the copy carries the glow, so light only appears where the band is */
      #sw1 { position: absolute; left: 0; top: 0; padding: 60px; opacity: 0; pointer-events: none;
        -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
      #n1bs { position: relative; white-space: nowrap; line-height: 1; letter-spacing: 0; color: #fff;
        filter: drop-shadow(0 0 2px rgba(255,255,255,1)) drop-shadow(0 0 7px rgba(255,240,214,.95)) drop-shadow(0 0 16px rgba(255,196,128,.5)); }
      /* the one accent: a 2 px sunset hairline, drawn from the left; glow on the wrapper so the clip never cuts it */
      #rule1 { position: absolute; height: 2px; filter: drop-shadow(0 0 2px rgba(255,170,190,.9)) drop-shadow(0 0 7px rgba(248,79,164,.75)) drop-shadow(0 0 18px rgba(254,142,78,.45)); }
      #rule1i { position: absolute; inset: 0; background: linear-gradient(90deg, #F84FA4 0%, #FE78A6 30%, #FE8E4E 68%, #FEB747 100%); }
      /* role: label size, pure white, soft dark lift; ends flush with the surname's right ink edge */
      #r1 { font-size: 26px; letter-spacing: .34em; color: #fff;
        text-shadow: 0 1px 2px rgba(0,0,0,.6), 0 4px 16px rgba(0,0,0,.55); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div id="frame">
        <div id="shake" data-layout-allow-overflow>
          <div id="push">
            <!-- v0 footage: s018 (Lucia at the gate, golden hour) from source frame 6, pre-slowed 1.85x with motion-compensated
                 interpolation (minterpolate mci/aobmc/bidir) into assets/clips/. Mirror any change in CONFIG.variants["0"].shots -->
            <video id="a1" class="clip shot" src="assets/clips/s018-lucia-gate-slow.mp4" muted playsinline
              data-start="0" data-duration="5" data-media-start="0.01" data-track-index="0"></video>
            <!-- v1 footage, two shots cut on the payoff (frame 31, 1.033 s, when the last surname glyph seats):
                 c1 = s098 (rooftop explosion) source frames 2–22 at 0.5x with motion-compensated interpolation (the blast);
                 c2 = s008 (Jason driving, sharp daylight profile) at 1.0x from its first frame, held with a push.
                 Mirror any change in CONFIG.variants["1"].shots -->
            <video id="c1" class="clip shot" src="assets/clips/s098-jason-fireworks-050.mp4" muted playsinline
              data-start="0" data-duration="1.0333" data-media-start="0.01" data-track-index="2"></video>
            <video id="c2" class="clip shot" src="assets/shots/s008-jason-driving-v.mp4" muted playsinline
              data-start="1.0333" data-duration="3.9667" data-media-start="0.01" data-track-index="3"></video>
          </div>
          <div id="xhit"></div>
          <div id="leakhost"></div>
          <!-- v0 tag rides inside #shake so the payoff kick moves footage and tag together -->
          <div id="tag" class="hide">
            <div id="scrim0" class="lk-scrim-spot hide"></div>
            <svg id="lines" width="1080" height="1920" viewBox="0 0 1080 1920">
              <defs>
                <!-- directional motion blur on the drawing head; user-space region so a horizontal (zero-height) path still renders -->
                <filter id="leadblur" filterUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920">
                  <feGaussianBlur id="leadblurG" in="SourceGraphic" stdDeviation="0 0" />
                </filter>
              </defs>
              <path id="leader" d="M0 0" />
            </svg>
            <div id="pin">
              <div class="flare" id="flare"></div>
              <div class="pulse" id="pulse1"></div>
              <div class="pulse" id="pulse2"></div>
              <div class="ring" id="ring"></div>
              <div class="core" id="core"></div>
            </div>
            <div id="block0" data-layout-allow-occlusion data-layout-allow-overflow>
              <div class="nm t-wide" id="n0a" data-layout-allow-occlusion data-layout-allow-overflow></div>
              <div class="nm t-wide" id="n0b" data-layout-allow-occlusion data-layout-allow-overflow></div>
              <div class="t-label-wide" id="r0"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- v1 lower third sits outside #shake: the footage takes the hit, the lockup stays planted -->
      <div id="lower" class="hide">
        <div id="scrim1" class="lk-scrim-bottom"></div>
        <div id="spot1"></div>
        <!-- the hold's bottom burn: from the cut on, the lower frame falls to near-black under the lockup (a graded
             fade, not a box), so white type reads on s008's sunlit tank top -->
        <div id="burn1"></div>
        <div id="block1" data-layout-allow-occlusion data-layout-allow-overflow>
          <div id="m1a" data-layout-allow-overflow><div class="t-wide" id="n1a" data-layout-allow-occlusion data-layout-allow-overflow></div></div>
          <div class="ln t-wide" id="n1b" data-layout-allow-occlusion data-layout-allow-overflow></div>
          <!-- the payoff light sweep: an identical copy of the surname whose glow is masked to a travelling band -->
          <div id="sw1" data-layout-allow-occlusion data-layout-allow-overflow><div class="t-wide" id="n1bs" data-layout-allow-occlusion data-layout-allow-overflow></div></div>
          <div id="rule1"><div id="rule1i"></div></div>
          <div class="ln t-label-wide" id="r1"></div>
        </div>
      </div>
    </div>

    <script>
      const CONFIG = {
        duration: 5,
        variants: {
          // 0 — Leader tag: pin tracked to the subject, an elbow callout (diagonal, then a horizontal leg that ends at the
          // name's left edge), name hung under the leg.
          "0": {
            style: "leader",
            first: "Lucia",                       // white, warm bloom
            last: "Caminos",                      // Leonida sunset fill + sheen at the payoff
            role: "Protagonist",
            shots: [ { id: "a1", src: "assets/clips/s018-lucia-gate-slow.mp4", start: 0, dur: 5, mediaStart: 0.01 } ],
            push: { from: 1.0, to: 1.06, origin: [540, 614] },   // origin in frame px ("50% 32%"), on her face
            // Tracked neckline point on the unpushed clip: [t, x, y] every 0.2 s (template-tracked on the chin/neck/collar,
            // 7-tap smoothed). The pin sits pinDy px below it, on the collar band. For your own clip, replace with your
            // subject's path, or one key for a still subject.
            track: [[0.0,359,869],[0.2,371,833],[0.4,388,811],[0.6,410,828],[0.8,444,861],[1.0,485,847],[1.2,514,833],[1.4,512,851],
                    [1.6,507,854],[1.8,512,852],[2.0,514,871],[2.2,503,907],[2.4,471,906],[2.6,437,877],[2.8,413,874],[3.0,404,867],
                    [3.2,416,866],[3.4,436,881],[3.6,453,886],[3.8,458,875],[4.0,453,875],[4.2,446,885],[4.4,440,891],[4.6,436,890],
                    [4.8,436,890],[5.0,433,889]],
            pinDy: 12,
            // The lockup is anchored by the role's BASELINE (roleBaseline) and builds upward; the callout's horizontal leg
            // sits gap px above the name. left = the name's left edge = where the leg ends.
            // size 124: CAMINOS spans ~770 px (89% of the safe width), ending near x 850 with air on the right
            block: { left: 80, roleBaseline: 1458, gap: 30, size: 124, maxWidth: 780 },
            // the callout: from the ring's edge, a steep diagonal (angle from horizontal) down-left to the elbow, then a
            // horizontal leg left to the name's left edge. minLeg keeps a leg even if the pin drifts far left.
            leader: { angle: 58, ringGap: 27, minLeg: 90, draw: 0.28, blur: 6 },
            sunset: "linear-gradient(100deg, #F84FA4 0%, #FE78A6 22%, #FE8E4E 60%, #FEB747 100%)",
            // reveal: stagger/dur of the masked char rise. hit = when the LAST surname glyph seats (computed from these:
            // last + (chars-1)*stagger + seat*dur), so a longer or shorter surname keeps the payoff on its landing.
            reveal: { stagger: 0.035, dur: 0.6, seat: 0.45 },
            // out: the exit starts; the leader retracts at out+0.25 (0.3 s) and the pin collapses right behind it (done by
            // out+0.7), so the last 0.35 s is clean footage
            timing: { pin: 0.12, leader: 0.22, first: 0.38, last: 0.5, roleAfterHit: 0.12, pulse: 2.7, out: 3.95 },
            // payoff: one light beat when the surname seats (~0.98 s). A warm additive exposure FLASH from the sun (light:
            // centre in frame fractions; full peak for exactly 1 frame, then decay), one warm gold→pink leak from the sun side
            // (top-left, under the tag), a 1.05 kick, a 0.4 s light pulse on the pin, a sheen across the sunset and a warm
            // bloom swell on the surname.
            payoff: { light: { at: [0.15, 0.18], color: "255,231,194", peak: 0.9, decay: 0.28, radius: 1050 },
                      // the leak stays on the sun side: it peaks over the sky and fence at upper left and fades as it reaches her hair
                      leak: { lead: 0.03, dur: 0.6, colors: ["#FEB747", "#F84FA4"], opacity: 0.6, y: 0.14, from: -0.55, to: 0.25, size: 1300 },
                      zoom: 1.05, amp: 4, snap: 1.6, pinPulse: 0.4, sheen: 0.7, bloom: 0.8 }
          },
          // 1 — Lower third: the name is born in the blast and lit by the fire for the whole hold. Broadcast structure:
          // small tracked first name over a huge surname, then a sunset hairline that leads into the role, set flush
          // to the surname's measure.
          "1": {
            style: "lower",
            first: "Jason",                       // small: 64 px wide 600, tracked .22em
            last: "Duval",                        // the hero
            role: "Protagonist",                  // label at the end of the hairline, flush with the surname's right ink edge
            left: 80,                             // the lockup's INK left edge (first name, surname and hairline share it)
            baseline: 1392,                       // the surname's baseline; the first name sits above it, hairline + role below
            size: 190,                            // surname size; shrinks until the surname spans at most maxWidth
            maxWidth: 760,                        // 88% of the safe width (864)
            first1: { size: 64, gap: 24, spread: 10 },     // gap: first-name baseline to surname cap top; spread: tracking-in px/char
            rule: { below: 32, gap: 24, draw: 0.45, min: 160 }, // hairline y = baseline + below; it stops gap px before the role
            // legibility: a bottom scrim + a soft spot on the lockup (part of the graphic, kept in bg:none)
            scrim: { top: 760, opacity: 0.9, spot: 0.85 },
            // the hold's bottom burn (from the cut): top = where it starts; stops = [alpha, % from the bottom]
            burn: { top: 800, stops: [[0.95, 0], [0.88, 43], [0.8, 60], [0.6, 69], [0.3, 82], [0.1, 91], [0, 100]] },
            // two shots, cut on the payoff. push: [from, to] scale over the shot, origin on his face.
            //   c1: the blast. s098 source frames 2–22 at 0.5x (motion-compensated), so the fireball blooms at 0.27–0.55 s.
            //   c2: the hold. s008 at 1.0x (a sharp daylight profile; he smiles from about 3.3 s of the shot).
            shots: [
              { id: "c1", src: "assets/clips/s098-jason-fireworks-050.mp4", start: 0.0, dur: 1.0333, mediaStart: 0.01, push: [1.0, 1.03], origin: "40% 22%", grade: "brightness(1.06) contrast(1.04)" },
              { id: "c2", src: "assets/shots/s008-jason-driving-v.mp4", start: 1.0333, dur: 3.9667, mediaStart: 0.01, push: [1.0, 1.05], origin: "56% 30%",
                lift: [0, 0.15, 0.28, 0.4, 0.51, 0.61, 0.7, 0.79, 0.87, 0.94, 1], grade: "url(#lift-c2) saturate(1.1)" }
            ],
            // seat: the fraction of the last glyph's rise that has run on the cut frame (expo.out at .45: 96% of the way, so
            // it lands into the hit over the next two frames)
            reveal: { stagger: 0.03, dur: 0.55, seat: 0.45 },
            // cut = the payoff frame: the cut to the held shot. The surname's rise is timed backwards from it so its LAST
            // glyph seats on the cut (rise = cut - (chars-1)*stagger - seat*dur, about 0.67 s, in the fireball). The first
            // name tracks in just ahead (first); the hairline draws out of the hit (rule) and the role lands after (role).
            timing: { scrim: 0.2, first: -0.12, cut: 1.0333, rule: 0.04, role: 0.3, out: 4.1 },
            // the hit on the cut: an exposure pulse on the incoming shot (2-frame hold at peak, then decay), a shake and
            // punch, a 6 px RGB split on the lockup for 0.12 s, and a light sweep across the surname.
            payoff: { expose: { peak: 1.7, hold: 2 / 30, dur: 0.38, saturate: 1.12 }, amp: 8, zoom: 1.04, chroma: 6, chromaDur: 0.12,
                      sheen: { dur: 0.6, lead: 0.0 } },
            // fire light on the name: measured mean luma of the fire region (x 600–1080, y 100–800) of the blast clip, one
            // value per frame from t = 0, normalised 0–1 (same scale as r09). After the cut (end) the fire light hands over
            // to a quiet daylight glow (after) over fade s.
            fire: { end: 1.0333, after: 0.12, fade: 0.35, glow: 0.55, luma: [0,.01,.01,.02,.03,.08,.14,.28,.42,.51,.60,.63,.66,.70,.73,.78,.82,.90,.98,.99,1,1,1,.98,.96,.93,.91,.88,.85,.83,.82,.80,.79,.78,.77,.77,.76,.76,.75] },
            // exit: whole masked lines (first name, then surname 0.06 s later) rising out with a 6 px blur
            exit: { dur: 0.42, lineStagger: 0.06, blur: 6 }
          }
        }
      };

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const vKey = CONFIG.variants[String(VARS.variant)] ? String(VARS.variant) : "0";
        const plate = VARS.bg !== "none";
        const V = CONFIG.variants[vKey], T = V.timing, D = CONFIG.duration;
        const $ = (s) => document.querySelector(s);
        const ids = V.shots.map((s) => s.id);
        document.querySelectorAll("video.shot").forEach((v) => { if (!plate || ids.indexOf(v.id) < 0) v.style.display = "none"; });

        Promise.all([
          document.fonts.load('800 expanded 100px "Archivo"', V.first + V.last),
          document.fonts.load('600 expanded 28px "Archivo"', V.role + V.first)
        ]).catch(() => {}).then(() => document.fonts.ready).then(() => {
          const tl = gsap.timeline({ paused: true });
          const clamp = (x) => Math.max(0, Math.min(1, x));
          const eo = gsap.parseEase("expo.out"), p3o = gsap.parseEase("power3.out"), p3i = gsap.parseEase("power3.in");
          const runW = (n) => { const r = document.createRange(); r.selectNodeContents(n); return r.getBoundingClientRect().width; };
          const baselineOf = (line, ref) => {   // y of a line's baseline relative to ref, via a zero-size inline-block marker
            const mk = document.createElement("span"); mk.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline";
            line.appendChild(mk); const y = mk.getBoundingClientRect().top - ref.getBoundingClientRect().top; mk.remove(); return y;
          };
          // ink metrics of a caps string in Archivo wide (canvas): bear = left side bearing (ink starts this far right of
          // the box), right = ink right edge from the box's left, cap = ink height above the baseline
          const ink = (txt, weight, size, track) => {
            const s = txt.toUpperCase();
            try {
              const c = document.createElement("canvas").getContext("2d");
              c.font = `${weight} expanded ${size}px "Archivo"`; if ("fontStretch" in c) c.fontStretch = "expanded";
              if ("letterSpacing" in c) c.letterSpacing = (track || 0) + "px";
              const m = c.measureText(s), bear = -m.actualBoundingBoxLeft;
              return { bear: bear >= 0 && bear < size * 0.2 ? bear : 0, right: m.actualBoundingBoxRight, cap: m.actualBoundingBoxAscent };
            } catch (e) { return { bear: 0, right: 0, cap: size * 0.72 }; }
          };

          // the payoff light: warm additive exposure hit, centred on the scene light. Peak for one frame, then decays.
          const exposureHit = (at, L) => {
            if (!plate) return;
            const el = $("#xhit"), c = L.color;
            // #xhit overhangs the frame by 60 px on every side (so the kick never shows an edge): centre in frame px + 60
            el.style.background = `radial-gradient(circle ${L.radius}px at ${Math.round(L.at[0] * 1080 + 60)}px ${Math.round(L.at[1] * 1920 + 60)}px, ` +
              `rgba(${c},1) 0%, rgba(${c},.62) 14%, rgba(${c},.26) 34%, rgba(${c},.08) 55%, rgba(${c},0) 78%)`;
            // the hit frame shows the full peak; the decay starts half a frame later, so the next frame is already falling
            const f1 = at + 0.5 / Look.FPS;
            Look.drive(tl, 0, D, (p) => {
              const t = p * D;
              el.style.opacity = t < at - 1e-4 ? "0" : t < f1 ? String(L.peak) : (L.peak * (1 - p3o(clamp((t - f1) / L.decay)))).toFixed(4);
            });
          };

          if (V.style === "leader") {
            // ---------------- v0: leader tag ----------------
            $("#tag").classList.remove("hide");
            $("#n0a").textContent = V.first; $("#n0b").textContent = V.last; $("#r0").textContent = V.role;
            const B = V.block, blk = $("#block0"), R = V.reveal, LD = V.leader;
            // fit: the longer line never exceeds maxWidth (x 80 → 936)

            // the fade finishes before the masked rise does, so the glyph feet never sit alone in the mask as a row of
            // dashes (r10: frame 4.6 showed them once the burn lifted off the bright tank top)
            tl.fromTo(mA, { opacity: 1 }, { opacity: 0, duration: X.dur * 0.4, ease: "power2.in", immediateRender: false }, tOutA + X.dur * 0.45);
            tl.fromTo(nB, { opacity: 1 }, { opacity: 0, duration: X.dur * 0.4, ease: "power2.in", immediateRender: false }, tOutB + X.dur * 0.45);
            tl.fromTo(sc, { opacity: V.scrim.opacity }, { opacity: 0, duration: 0.45, ease: "power2.inOut", immediateRender: false }, T.out + 0.3);
            tl.fromTo(sp, { opacity: V.scrim.spot }, { opacity: 0, duration: 0.45, ease: "power2.inOut", immediateRender: false }, T.out + 0.25);

            // per-shot push: each shot pushes in on its own face (the cut resets it, like an editor's per-clip keyframes).
            if (plate) {
              // a shot's lift: a tone curve (SVG table) that opens the shadows and low mids but keeps black at 0, referenced
              // from its grade as url(#lift-<id>). s008's face is a backlit profile (mean luma 19 in the source).
              V.shots.forEach((s) => {
                if (!s.lift) return;
                const NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg");
                svg.setAttribute("width", "0"); svg.setAttribute("height", "0"); svg.style.cssText = "position:absolute;width:0;height:0";
                const f = document.createElementNS(NS, "filter"); f.setAttribute("id", "lift-" + s.id); f.setAttribute("color-interpolation-filters", "sRGB");
                const ct = document.createElementNS(NS, "feComponentTransfer");
                ["feFuncR", "feFuncG", "feFuncB"].forEach((k) => { const fn = document.createElementNS(NS, k); fn.setAttribute("type", "table"); fn.setAttribute("tableValues", s.lift.join(" ")); ct.appendChild(fn); });
                f.appendChild(ct); svg.appendChild(f); document.body.appendChild(svg);
              });
              V.shots.forEach((s) => { if (s.grade) document.getElementById(s.id).style.filter = s.grade; });
              const pe = $("#push"), S = V.shots;
              Look.drive(tl, 0, D, (p) => {
                const t = p * D; let i = 0; while (i < S.length - 1 && t >= S[i + 1].start) i++;
                const sh = S[i], u = clamp((t - sh.start) / sh.dur);
                pe.style.transformOrigin = sh.origin;
                pe.style.transform = `scale(${(sh.push[0] + (sh.push[1] - sh.push[0]) * u).toFixed(5)})`;
              });
            }
          }

          // v1 runs a lighter vignette: its bottom scrim already darkens the frame edge where the lockup sits
          const fin = Look.install(tl, { duration: D, grain: 0.16, vignette: V.style === "lower" ? 0.38 : 0.5, enabled: plate });
          // Grain on every frame. The kit's grain driver picks its frame with floor(p*D*FPS + 1e-6), but GSAP rounds tweened
          // values to 1e-6, so some n/(D*FPS) round down onto the previous frame and the grain (and so the whole frame, on
          // still footage) repeats. Same hash, rounded to the nearest frame.
          // v1 only: the kit gives its overlay wrapper a z-index, which isolates the grain's overlay blend from the picture,
          // so the grain composites as plain grey and lifts the blacks (measured: the car roof's black, 0.6, rendered at
          // 18.6). Dropping the wrapper's z-index (it is the last child of #root, so it still paints over the footage)
          // lets the grain really overlay-blend: blacks stay black. The type sits above it (z 95).
          if (fin && V.style === "lower") fin.el.style.zIndex = "auto";
          if (fin && fin.grain) {
            const g = fin.grain, GS = 384;
            Look.drive(tl, 0, D, (p) => {
              const f = Math.round(p * D * Look.FPS);
              g.style.backgroundPosition = Math.floor(Look.hash(f * 2 + 1) * GS) + "px " + Math.floor(Look.hash(f * 2 + 7919) * GS) + "px";
            });
          }
          tl.set({}, {}, D);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  </body>
