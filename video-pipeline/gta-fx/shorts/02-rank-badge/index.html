<!-- GTA 6 component #2: Rank badge (craft v2). 1080x1920 (9:16), 30 fps, 7.0 s.
     Variant 0 "Hero numeral → dock": full-bleed night montage cut on beats. A giant sunset "#3" in Archivo wide slams in on the cut
       to Jason in front of the fireworks blast (flash + shake + RGB split + light leak + pink bloom). It is set like a film poster:
       face above, the numeral on the dark of his jacket, the title under it, held 1.3 s. The pre-roll is one 0.33 s beat. Then it flies into the top-left corner on
       the next cut (directional motion blur), lands with a sheen and a bloom flare, and lives on as a type-only corner bug with a
       5-segment progress rule.
     Variant 1 "Corner badge": full-bleed police-chase edit, all Inter. A 700 px Inter-display "#2" climbs like a slot reel
       ("#5" blurs in on frame 0, then 4, 3 rush through) and locks on "2" ON the cut to the charging SUV (flash + shake + RGB
       split + leak); the item title, set on the numeral's measure, rises under it and holds 1.2 s. It docks across a punch-in
       cut into a real top-left badge (numeral, hairline, series label, title, progress ticks) that holds over the gameplay clip
       and hits again, with a sheen and bloom, on the SUV's real rollover.
     bg "plate" = sample footage + finishing (grain, vignette, flashes, leak); bg "none" = transparent overlay (no footage, no finishing;
       the soft legibility scrims stay, they are part of the graphic). Safe zone: all text inside x 72–936, y 230–1480. -->
<html lang="en" data-composition-variables='[
  {"id":"variant","type":"enum","label":"Variant","default":"0","options":[{"value":"0","label":"Hero numeral → dock"},{"value":"1","label":"Corner badge"}]},

]'>

             which also carries the blast's camera-shake blur), then ramps to 0.39× for the hold (source 0.57–1.10, sharp), built with
             motion-compensated interpolation), so every frame of the hero hold is new: no playback-rate judder. s014 stops before the
             A-pillar wedge (≈ 2.33 s). s027 ends 0.05 s before its last frame.
             The pre-roll is 0.33 s (s055 media 1.0–1.33): the slam lands on the 0.33 s cut, and the ramp enters at its frame 2 (media
             0.07), the frame the blast erupts at the right edge, so the cut frame carries the explosion's light (frames 0–1 are a dark
             pre-blast Jason that the flash only washed grey). s039 runs 2.02–3.06 (media 0–1.04: its last frames before the hidden cut
             repeat a frame). s014 runs 3.06–5.2 (media 0.06–2.2), s027 5.2–7.0 (media 0.04–1.84).
             v0 is LOCKED at 8 (r08) and must render exactly as r08: do not touch its shots, timing or layout without a v0 defect.
           v1: the renderer shows source frame floor(media × 30). s096 has a foreground pole on frame 12 (0.40) and frame 35 (1.167),
             so it plays media 0.46–1.18 = frames 13–34 only (the green car whips past, then the cruiser drifts in), and cuts at 0.72 s,
             before frame 35 can show. A slow-motion version was tried and rejected: every interpolator (mci/obmc/blend) smears the
             drifting cruiser. The reel locks ON the 0.72 s cut to s119, which enters at media 0.35 (past the smeared opening pan:
             the slam frame is source frame 10 and the 0.9 s hero frame is 15, both sharp); the hero holds over the SUV charging under
             fire to 2.08 s. The dock flies across a 2.26 s punch-in cut on the same take (media continuous at 1.89, framed 1.13×
             tighter), so the SUV's hard flip (media 2.43) lands at 2.8 s; s119 ends at media 4.06 (shot length 4.10). s011 enters at media 0 and the badge exits at 6.15 s, so the airliner (in at the top right

    <script>
      const CONFIG = {
        variants: {
          "0": {
            list: "Top 5 · Trailer moments",      // series label (kicker, then the bug's label)
            rank: 3, total: 5,
            title: "Vice City nights",
            // sample shots (keep in sync with the <video data-v="0"> tags): cut on the beats below
            shots: ["assets/shots/s055-night-truck-v.mp4", "assets/clips/s098-ramp.mp4", "assets/shots/s039-blue-club-v.mp4",
                    "assets/shots/s014-driveby-police-v.mp4", "assets/shots/s027-sunset-dock-v.mp4"],
            // cuts: 0.33 (slam), 2.02 (mid-dock), 3.06, 5.2. The title rises on the slam, is fully legible from ~0.55 s and holds until
            // it drops at 1.78 s (gone by the 2.02 s cut): a 1.23 s read.
            timing: { kicker: 0.03, slam: 0.33, title: 0.33, sheen: 1.03, dock: 1.84, dockDur: 0.45, bug: 2.23, clipEnd: 6.25, out: 6.3, end: 7.0 },
            glow: { rgb: "254,120,166", base: 0.62, peak: 1.5, land: 1.25 }   // bloom in the blast's pink-orange light (#FE78A6)
          },
          "1": {
            list: "Top 5 · Police chases",
            rank: 2, total: 5,
            title: "SUV rollover",
            shots: ["assets/shots/s096-police-street-v.mp4", "assets/shots/s119-gameplay-shootout-v.mp4", "assets/shots/s011-vice-highway-v.mp4"],
            // spin = "#" and "5" blur in together on frame 0 and the reel climbs 5→4→3; slam = it locks on "2" ON the 0.72 s cut
            // (s096 → s119). title = the item name rises on the slam (never over the white cruiser), fully up ≈ 0.85 s, and reads
            // until it drops at 2.02 s (legible ≈ 0.83–2.1 s).
            // cuts: 0.72 (slam), 2.26 (punch-in on the same take, mid-dock), 4.43 (flash).
            // beat = the SUV's hard flip (s119 media 2.43 s) = the payoff: hit, RGB split, sheen, bloom flare, tick.
            timing: { spin: 0.0, slam: 0.72, title: 0.72, dock: 2.08, dockDur: 0.45, bug: 2.48, beat: 2.8, cut2: 4.43, clipEnd: 6.1, out: 6.15, end: 7.0 },
            glow: { rgb: "254,142,78", base: 0.72, peak: 1.5 }    // bloom in the street's warm light (#FE8E4E), matched to v0's
          }
        },
        // Leonida core sunset. v0: diagonal across the Archivo numeral. v1: vertical, so the slot reel reads lit from above.
        gradient: "linear-gradient(118deg, #F84FA4 0%, #FE78A6 26%, #FE8E4E 62%, #FEB747 100%)",
        gradientV: "linear-gradient(180deg, #F84FA4 0%, #FE78A6 30%, #FE8E4E 66%, #FEB747 100%)",
        heroNumeralPx: 580,   // v0 hero numeral font size (figure ink ≈ 0.72 × this)
        dockNumeralPx: 168,   // v0 docked numeral size (the same element, scaled)
        badgeHeroPx: 700,     // v1 hero numeral (Inter display 800), centred; ink ≈ 0.73 × this (≈ 510 px tall, ≈ 620 px wide)
        badgeHeroInkTop: 250, // v1 hero numeral ink top (y): the building band above the SUV's roof
        badgeTitleGap: 42,    // v1 hero title cap top sits this far under the numeral's ink (title fitted to the numeral's ink width)
        badgeDockPx: 150,     // v1 docked numeral size (the same element, scaled)
        badgeTop: 250,        // v1 badge: numeral ink top-left at (72, badgeTop)
        reelPitch: 1.12,      // v1 slot reel: row pitch in window heights (a small gap between figures, like a real reel strip)
        // v1 reel ticks (s): "#5" holds while it blurs in, then quick rolls 5→4 and 4→3 (each figure holds ≈ 2.5 frames), then an
        // accelerating roll that slams onto "2" on the cut (timing.slam)
        reelTicks: [{ at: 0.26, dur: 0.11, ease: "power3.inOut" }, { at: 0.45, dur: 0.09, ease: "power3.inOut" }, { at: 0.62, ease: "power2.in" }],
        settle: 0.97,         // docked badge drifts 1 → settle (linear) across the hold so it never sits frozen
        shakePx: 12,          // impact shake on the payoff (footage only)
        flash: 0.3,           // v0 light on the slam (plate only): the blast's light, peak opacity of the directional burst
        flashColor: "#FFBB95", // white mixed with 60 % #FE8E4E: the even part of that light (at flashEven)
        flashEven: 0.08,      // a thin even warm lift under the burst, so the whole frame registers the hit
        flash1: 0.45,         // v1 exposure flash on the reel stop (white, daylight)
        grain: 0.14
      };

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const vKey = CONFIG.variants[String(VARS.variant)] ? String(VARS.variant) : "0";
        const plate = VARS.bg !== "none";
        const V = CONFIG.variants[vKey], T = V.timing;
        const $ = (s) => document.querySelector(s);
        const root = $("#root");
        root.classList.add("v" + vKey);
        document.querySelectorAll("video.shot").forEach((v) => { if (!plate || v.dataset.v !== vKey) v.style.display = "none"; });
        if (!plate) $("#stage").style.display = "none";

        // ---- text ----
        const figHTML = (r) => '<span class="hash">#</span><span class="fig">' + r + "</span>";
        if (vKey === "0") {
          $("#kicker").textContent = V.list;
          $("#title").textContent = V.title;
          $("#bLabel").textContent = V.list;
          $("#bTitle").textContent = V.title;
          $("#num").innerHTML = figHTML(V.rank);
        } else {
          $("#v1HeroTitle").textContent = V.title;
          $("#v1Label").textContent = V.list;
          $("#v1Title").textContent = V.title;
        }
        function buildSegs(el) {
          const out = [];
          for (let r = V.total; r >= 1; r--) {
            const s = document.createElement("div"); s.className = "seg";
            const b = document.createElement("b"), f = document.createElement("i");
            s.appendChild(b); s.appendChild(f); el.appendChild(s); out.push({ r, b, f });
          }
          return out;
        }

        // ---- ink metrics (canvas) so type aligns on glyph ink, not on line boxes ----
        const cx = document.createElement("canvas").getContext("2d");
        function metrics(weight, px, txt, fam) {
          fam = fam || "Archivo";
          cx.font = weight + " " + px + "px " + fam;
          try { cx.fontStretch = fam === "Archivo" ? "expanded" : "normal"; } catch (e) {}
          const m = cx.measureText(txt);
          return { asc: m.actualBoundingBoxAscent, desc: m.actualBoundingBoxDescent, l: m.actualBoundingBoxLeft, r: m.actualBoundingBoxRight, w: m.width,
                   fa: m.fontBoundingBoxAscent || px * 0.878, fd: m.fontBoundingBoxDescent || px * 0.21 };
        }
        // baseline position from the top of a line box of height L (CSS half-leading model)
        const baseOf = (m, L) => (L - (m.fa + m.fd)) / 2 + m.fa;
        // top of the line box so that the caps' ink top lands at y
        const capTopAt = (m, L, y) => y - (baseOf(m, L) - m.asc);
        // ---- one measure: fit a single-line text's INK width to a target and centre its ink on an axis ----
        // DOM advance of an element's text (letter-spacing is added after every glyph, the last one too)
        function advW(el) { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width; }

              const svg = document.createElementNS(NS, "svg"); svg.setAttribute("width", "0"); svg.setAttribute("height", "0");
              svg.setAttribute("style", "position:absolute;width:0;height:0;overflow:hidden");
              rdefs = document.createElementNS(NS, "defs"); rdefs.id = "rbDefs"; svg.appendChild(rdefs); document.body.appendChild(svg);
            }
            rdefs.appendChild(rf);
            const feather = (k) => {
              if (k <= 0.01) { win.style.webkitMaskImage = "none"; win.style.maskImage = "none"; return; }
              const top = 24 * k, bot = 46 * k;
              const m = "linear-gradient(180deg, transparent 0%, #000 " + top.toFixed(2) + "%, #000 " + (100 - bot).toFixed(2) + "%, " +
                "rgba(0,0,0,.32) " + (100 - bot * 0.42).toFixed(2) + "%, transparent 100%)";
              win.style.webkitMaskImage = m; win.style.maskImage = m;
            };
            const h = 1 / 240;
            gsap.set(reel, { y: 0 });
            Look.drive(tl, T.spin, T.slam - T.spin, (p) => {
              const t = T.spin + p * (T.slam - T.spin);
              gsap.set(reel, { y: -rollPos(t) * P });
              const v = Math.abs(rollPos(Math.min(T.slam, t + h)) - rollPos(Math.max(T.spin, t - h))) / (2 * h);   // rows per second
              const b = p >= 1 ? 0 : 30 * Math.min(1, v / 18);
              if (b < 0.3) reel.style.filter = ""; else { rg.setAttribute("stdDeviation", "0 " + b.toFixed(2)); reel.style.filter = "url(#rbReel)"; }
              if (p < 1) feather(Math.min(1, v / 7));
            });
            Look.drive(tl, T.slam, D - T.slam, (p) => {
              const t = T.slam + p * (D - T.slam);
              if (p <= 0) return;
              if (t < T.slam + 0.14) feather(1 - (t - T.slam) / 0.14);
              else if (t < T.out + 0.06) feather(0);
              else feather(Math.min(1, (t - T.out - 0.06) / 0.1));
            });
            // the stop: a 2-frame recoil and a small punch sell the weight
            tl.to(reel, { y: -(steps - 1) * P + RH * 0.05, duration: 2 / 30, ease: "power2.out" }, T.slam);
            tl.to(reel, { y: -(steps - 1) * P, duration: 0.16, ease: "power3.out" }, T.slam + 2 / 30);
            gsap.set(slam, { scale: 1.06, transformOrigin: "50% 50%" });   // = the punch's start, so a backward seek renders the same
            tl.fromTo(slam, { scale: 1.06 }, { scale: 1, duration: 0.32, ease: "expo.out", immediateRender: false }, T.slam);
            if (plate) {
              Look.impact(tl, T.slam, { shake: "#shake", amp: CONFIG.shakePx * 0.85, flash: CONFIG.flash1, zoom: 1.04 });
              // the one light leak: warm street light sweeping across the landed figure
              Look.leak(tl, T.slam - 0.02, 0.6, { colors: ["#F84FA4", "#FEB747"], y: 0.27, opacity: 0.42 });
            }
            Look.chroma(tl, inner, T.slam, 0.24, { px: 14 });
            // the item title rises into its masks under the numeral, word by word, on the slam
            Look.reveal(tl, hTitle, T.title, { by: "words", stagger: 0.04, dur: 0.4 });
            // hold: the figure breathes in (linear) until the dock
            tl.fromTo(slam, { scale: 1 }, { scale: 1.025, duration: T.dock - (T.slam + 0.32), ease: "none", immediateRender: false }, T.slam + 0.32);

            // ---- dock at 2.05 s, across the 2.27 s punch-in cut: the title drops into its masks, the numeral flies into the corner ----
            tl.fromTo(hTitle.querySelectorAll(".lk-in"), { yPercent: 0 }, { yPercent: 118, duration: 0.2, ease: "power3.in", stagger: 0.03, immediateRender: false }, T.dock - 0.06);
            tl.set("#v1HeroTitleWrap", { opacity: 0 }, T.dock + 0.3);
            tl.to("#v1ScrimHero", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, T.dock);
            tl.fromTo("#v1ScrimTop", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.inOut", immediateRender: true }, T.dock + 0.06);
            gsap.set(fly, { x: 0, y: 0, scale: 1, transformOrigin: "0 0" });
            tl.fromTo(fly, { x: 0, y: 0, scale: 1 }, { x: dx, y: dy, scale: k, duration: T.dockDur, ease: "expo.inOut", immediateRender: false }, T.dock);
            tl.fromTo(slam, { scale: 1.025 }, { scale: 1, duration: T.dockDur, ease: "expo.inOut", immediateRender: false }, T.dock);
            const Ld = Math.hypot(dx, dy);
            speedBlur(tl, fly, T.dock, T.dockDur, "expo.inOut", Math.abs(dx) / Ld, Math.abs(dy) / Ld, 22);
            // the badge builds beside the landed numeral: the hairline draws down, then label, title and ticks rise in
            gsap.set("#v1Text", { opacity: 0 });
            tl.fromTo("#v1Text", { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none", immediateRender: false }, T.bug - 0.02);
            gsap.set(rule, { scaleY: 0 });
            tl.fromTo(rule, { scaleY: 0 }, { scaleY: 1, duration: 0.42, ease: "expo.out", immediateRender: false }, T.bug - 0.02);
            Look.reveal(tl, bL, T.bug + 0.02, { by: "words", stagger: 0.05, dur: 0.55 });
            Look.reveal(tl, bT, T.bug + 0.08, { by: "words", stagger: 0.07, dur: 0.6 });
            // the ticks draw early so the current one is up for the flip's tick pop
            segTimeline(tl, segs, T.bug - 0.04, T.bug + 0.24, T.clipEnd);
            // the docked badge drifts 1 → .97 (linear) from the landing to the exit, so it never sits frozen
            const land = T.dock + T.dockDur;
            gsap.set("#v1Badge", { transformOrigin: "72px " + TOP + "px" });
            tl.fromTo("#v1Badge", { scale: 1 }, { scale: CONFIG.settle, duration: T.out - land, ease: "none", immediateRender: false }, land);

            // ---- payoff: the SUV's real rollover. Hit, RGB split, numeral punch, sheen, bloom flare, the current tick pops ----
            if (plate) Look.impact(tl, T.beat, { shake: "#shake", amp: 8, flash: 0.26, zoom: 1.025 });
            Look.chroma(tl, inner, T.beat, 0.32, { px: 10 });
            tl.fromTo(slam, { scale: 1.09 }, { scale: 1, duration: 0.36, ease: "expo.out", immediateRender: false }, T.beat);
            Look.sheen(tl, inner, T.beat + 0.02, { dur: 0.5, ease: "power2.inOut" });
            const cur = segs.find((s) => s.r === V.rank);
            if (cur) {
              tl.fromTo(cur.b, { backgroundColor: "rgba(255,255,255,1)" }, { backgroundColor: "rgba(255,255,255,.28)", duration: 0.14, ease: "power2.in", immediateRender: false }, T.beat);
              tl.fromTo(cur.b.parentNode, { scaleY: 1.8 }, { scaleY: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, T.beat);
            }
            // ---- the 4.43 s cut to the highway: an exposure flash and a small bloom flare ----
            if (plate) Look.impact(tl, T.cut2, { flash: 0.3 });
            glowDrive(tl, "#v1Lift", V.glow, T.spin, [{ at: T.slam, peak: V.glow.peak }, { at: T.beat, peak: V.glow.peak, decay: 0.32 }, { at: T.cut2, peak: V.glow.peak * 0.7 }], D);

            // ---- exit: the figure spins on up and out of its window, the badge type rises out of its masks ----
            tl.fromTo(reel, { y: -(steps - 1) * P }, { y: -steps * P, duration: 0.34, ease: "power3.in", immediateRender: false }, T.out + 0.06);
            speedBlur(tl, reel, T.out + 0.06, 0.34, "power3.in", 0, 1, 20);
            Look.exit(tl, hashEl, T.out + 0.1, { to: "blur", dur: 0.3, blur: 10 });
            tl.fromTo(bL.querySelectorAll(".lk-in"), { yPercent: 0 }, { yPercent: -118, duration: 0.3, ease: "power3.in", stagger: 0.03, immediateRender: false }, T.out);
            tl.fromTo(bT.querySelectorAll(".lk-in"), { yPercent: 0 }, { yPercent: -118, duration: 0.3, ease: "power3.in", stagger: 0.03, immediateRender: false }, T.out + 0.04);
            tl.fromTo(bS, { opacity: 1 }, { opacity: 0, duration: 0.28, ease: "power2.in", immediateRender: false }, T.out + 0.04);
            tl.fromTo(rule, { scaleY: 1 }, { scaleY: 0, duration: 0.3, ease: "power3.in", immediateRender: false }, T.out + 0.08);
            tl.to("#v1ScrimTop", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.out + 0.05);
            // the sky shade comes in on the 4.43 s cut (under its flash) and leaves with the badge
            tl.fromTo("#v1ScrimTail", { opacity: 0 }, { opacity: 0.35, duration: 0.2, ease: "power2.out", immediateRender: true }, T.cut2);
            tl.to("#v1ScrimTail", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.out + 0.05);
          }

          const fin = Look.install(tl, { duration: D, grain: CONFIG.grain, vignette: 0.5, enabled: plate });
          // True blacks: Look.install puts the grain inside its own z-indexed wrapper, which is an isolated stacking context, so the
          // grain's overlay blend has nothing to blend with and composites as a flat grey layer (measured in r05: black 16→32 luma).
          // Re-parented straight into #root, it overlays the footage for real: the grain texture's mean is 127.5/255, so it is
          // zero-mean, pure black stays black and contrast is untouched.
          if (fin && fin.grain) { fin.grain.style.zIndex = "91"; root.appendChild(fin.grain); }
          tl.set({}, {}, D);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  </body>
</html>
