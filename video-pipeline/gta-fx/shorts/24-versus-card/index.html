<!doctype html>
<!-- GTA 6 component #24 — Versus card (craft v2). 1080x1920 (9:16), 30 fps, 6 s.
     A head-to-head title that opens a comparison segment.
     variant "0" Split  — a fight-night intro: each contender gets one full-frame close-up beat with their name, then the two
                          portraits whip in from opposite edges carrying their names and meet on a steep diagonal blade of
                          sunset light; the VS lands on the blade with an exposure hit and a light leak, on the complete poster.
                          LUCIA flush left above the seam, JASON flush right at the foot of his portrait, both bigger than their
                          intro names. Every shot plays at 1.0x: each pane cuts to a second shot during the hold.
     variant "1" Centre — GTA V vs GTA VI: a full-bleed split on a 12.5-degree seam, cutting together on the beat through four
                          matched pairs (the skyline / welcome sign, the view from the top, the car on the street, the city).
                          Scale tells the upgrade: a small 86%-white GTA V and VS sit on the seam, and GTA VI (the hero, the
                          frame's one accent) slams in big under them on the first matched cut. The panes open from the seam
                          and shut back onto it.
     bg is accepted for library parity, but this is a full-frame component: footage always shows and the Look finishing
     stack is always on.
     Safe zones: all text inside x 72–936, y 230–1480. Content, clips, timing and layout live in CONFIG. -->
<html lang="en" data-composition-variables='[
  {"id":"variant","type":"enum","label":"Variant","default":"0","options":[{"value":"0","label":"Split"},{"value":"1","label":"Centre"}]},
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
        font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      #shake, #push { position: absolute; inset: 0; }
      .layout { position: absolute; inset: 0; display: none; }
      .layout.on { display: block; }
      .full { position: absolute; inset: 0; overflow: hidden; }
      .full video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
      .pane { position: absolute; inset: 0; overflow: hidden; }
      .pbox { position: absolute; }
      .pbox video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .pshade { position: absolute; inset: 0; pointer-events: none; }
      .track { position: absolute; inset: 0; }
      #leakHost { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; mix-blend-mode: screen; }
      /* Centre: two full-canvas panes clipped along a tilted seam; each 16:9 shot fills a 1080x1080 box at its native
         pixels (1920x1080 cover-scaled, framed per shot), the top box on 0-1080 and the bottom box on 840-1920 */
      .cpane { position: absolute; inset: 0; overflow: hidden; }
      .sw { position: absolute; left: 0; width: 1080px; height: 1080px; }
      .sw video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .bscrim { position: absolute; pointer-events: none; }

      /* overlay */
      #ov { position: absolute; inset: 0; z-index: 20; }
      .ovl { position: absolute; inset: 0; display: none; }
      .ovl.on { display: block; }
      .scrim { position: absolute; left: 0; width: 1080px; pointer-events: none; }
      .blk { position: absolute; left: 0; top: 0; white-space: nowrap; }
      .nm { display: block; white-space: nowrap; line-height: 1; letter-spacing: .02em; }
      .nm.dim { color: rgba(255,255,255,.86); }
      .nm.lift { filter: drop-shadow(0 2px 2px rgba(0,0,0,.30)) drop-shadow(0 10px 30px rgba(0,0,0,.42)); }
      .lb { display: block; white-space: nowrap; line-height: 1; color: rgba(255,255,255,.88); font-size: 26px; letter-spacing: .34em;
        text-shadow: 0 1px 2px rgba(0,0,0,.5), 0 4px 16px rgba(0,0,0,.45); }
      .centred { text-align: center; }

      /* the seam: a blade of light that breaks around the VS (Split: a 4 px sunset edge; Centre: a white hairline) */
      #blade { position: absolute; left: 0; top: 0; height: 0; transform-origin: 0 0; pointer-events: none; }
      #blade i { position: absolute; top: -1px; height: 2px; background: #fff; border-radius: 1px;
        box-shadow: 0 0 2px rgba(255,255,255,.9), 0 0 10px rgba(254,183,71,.55), 0 0 28px rgba(248,79,164,.38); }
      #blade b { position: absolute; top: 2px; height: 30px; pointer-events: none;   /* contact shadow: the upper plate lies over the lower one */
        background: linear-gradient(180deg, rgba(0,0,0,.36), rgba(0,0,0,.18) 30%, rgba(0,0,0,.06) 65%, rgba(0,0,0,0)); }

      /* VS: wide Archivo 900. Split: sunset fill + orange bloom. Centre: white in the Rockstar date style (magenta offset + bloom). */
      #vsBox { position: absolute; left: 0; top: 0; }
      #vsSlam { position: relative; transform-origin: 50% 50%; }
      #vsGlow { position: relative; }
      #vsText, #vsBack { display: block; font-family: "Archivo", "Inter", sans-serif; font-stretch: 125%; font-weight: 900; line-height: 1;
        letter-spacing: .02em; white-space: nowrap; color: #fff; }
      #vsBack { position: absolute; left: 0; top: 0; color: #FE8E4E; }   /* Split: an orange copy under the gradient glyphs that carries the bloom */
    </style>
  </head>

    <script>
      const CONFIG = {
        duration: 6,
        variants: {
          // ---- Split: intro beat A, intro beat B, then the two portraits whip in with their names and meet on a diagonal blade (A = top pane, B = bottom) ----
          // Every shot plays at 1.0x (r11): where the hold is longer than a shot, the pane cuts to a second shot (pane2).
          "0": {
            layout: "split",
            vs: "VS",
            a: { name: "Lucia", label: "Caminos",
                 intro: { clip: "assets/shots/s083-duo-convertible-v.mp4", start: 0 },
                 // pane box in canvas px (the clip is laid into it with object-fit: cover). s018 at 1.0x from its first frame:
                 // her head lifts during the whip-in (2.30-2.67 s) and she looks to camera from the hit on
                 pane:  { clip: "assets/shots/s018-lucia-gate-v.mp4", start: 0, box: { x: 0, y: -80, w: 1080, h: 1920 }, origin: "50% 22%", push: 1.06 },
                 // cut on the exit (5.25 s): Lucia on the rooftop at sunset, the brightest, warmest shot to end on
                 pane2: { clip: "assets/shots/s105-lucia-rooftop-v.mp4", start: 0, at: 5.25, box: { x: 0, y: -60, w: 1080, h: 1920 }, origin: "50% 22%", push: 1.04 } },
            b: { name: "Jason", label: "Duval",
                 intro: { clip: "assets/shots/s076-jason-boat-v.mp4", start: 1.35 },
                 // s078 re-cut from the 4K master by make-clips.sh at 1.0x: a window that pans with his face, 1080x1424 (0.742x of 4K).
                 // The pan is baked in; vertically his head rises in the first 0.35 s, so the box follows his eye (clip px) to hold it at eyeY.
                 pane:  { clip: "assets/clips/s078-jason-track-100-v.mp4", start: 0, box: { x: 0, y: 496, w: 1080, h: 1424 }, origin: "57% 52%", push: 1.04,
                          filter: "brightness(1.07) contrast(1.05)",
                          eyeY: 1000, yMax: 700,   // the box may sit between box.y (its foot on the canvas floor) and yMax (its top on the seam's high end)
                          track: [[0, 744], [0.14, 620], [0.28, 531], [0.42, 470], [0.56, 432], [0.70, 409], [0.84, 397], [0.98, 393], [1.12, 392],
                                  [1.40, 393], [1.68, 390], [1.96, 385], [2.10, 385]] },
                 // cut at 4.4 s, as the sheen crosses the VS: s092 (Jason leaning on the car at golden hour) re-cut from the 4K master,
                 // 1080x1220 (0.85x of 4K, a window that pans with the camera's drift), his face right of the VS under the seam, above JASON
                 pane2: { clip: "assets/clips/s092-jason-window-v.mp4", start: 0, at: 4.4, box: { x: 0, y: 700, w: 1080, h: 1220 }, origin: "70% 25%", push: 1.04 } },
            // seam from (0, yLeft) to (1080, yRight): a steep 19° blade between the two portraits
            seam: { yLeft: 1080, yRight: 700 },
            introSize: 146, introMaxW: 760, introBaseline: 1372,   // intro name: lower third, flush left (the setup: smaller than the payoff)
            nameSize: 168, nameMaxW: 804, vsSize: 210, vsX: 530,   // face-off names span 75-86% of the safe width; VS ink centred on the seam at vsX
            nameBBaseline: 1466,  // JASON sits at the foot of his portrait, under his chin, inside the safe zone
            gapVS: 30,            // LUCIA baseline ↔ VS ink top
            seamClear: 24,        // LUCIA's last letter stays this far above the seam
            gapLabel: 22,         // kicker label baseline ↔ name cap top
            bladeGap: 26,         // blade clear of the VS ink
            blade: { width: 4, fill: "linear-gradient(90deg, #F84FA4 0%, #FE78A6 30%, #FE8E4E 66%, #FEB747 100%)", bloom: "#FE8E4E", strength: 0.6 },
            vsBloom: { color: "#FE8E4E", strength: 0.45 },
            leak: { colors: ["#FEB747", "#F84FA4"], opacity: 0.55, dur: 0.55, size: 1100 },
            expose: { peak: 1.6, hold: 3 / 30, dur: 0.34 }   // the payoff light: blows the highlights, keeps the blacks (no white flash)
          },
          // ---- Centre: a full-bleed split on a 12.5° seam; matched pairs cut together on the beat ----
          "1": {
            layout: "centre",
            vs: "VS",
            a: { name: "GTA V",  label: "2013 · Los Santos" },
            b: { name: "GTA VI", label: "2026 · Leonida" },
            // Each 16:9 shot fills a 1080x1080 box at its native pixels (top box 0-1080, bottom box 840-1920): fit.x = object-position x
            // (0-1), fit.s = extra zoom about (fit.x, fit.y). Shots are cast so the lockup lands on the foot of the GTA V shot and the
            // top of the GTA VI shot, never on a face. All at 1.0x.
            cuts: [
              // the skyline and the welcome sign: downtown Los Santos at golden hour / "Welcome to the Keys"
              { at: 0.0,  dur: 1.0,  a: { clip: "assets/shots/g33-gta5-oil-sunset-h.mp4",       start: 0.3, fit: { x: 0.5,  y: 0.5, s: 1 } },
                                     b: { clip: "assets/shots/s074-keys-sign-h.mp4",             start: 0.2, fit: { x: 0.5,  y: 0.5, s: 1 } } },
              // the view from the top (GTA VI slams in here): hikers on the summit / she leaps over Vice City (1.0x, from her stance)
              { at: 1.0,  dur: 1.6,  a: { clip: "assets/shots/g06-gta5-mountain-h.mp4",         start: 0.2, fit: { x: 0.5,  y: 0.5, s: 1 } },
                                     b: { clip: "assets/shots/s135-skydive-city-h.mp4",          start: 0.0, fit: { x: 0.5,  y: 0.5, s: 1 } } },
              // the car on the street: the GTA V red convertible / a Vice City police cruiser on a palm-lined street
              // (s096 from 0.1 s: its first 3 frames are a red car whipping past the lens)
              { at: 2.6,  dur: 1.65, a: { clip: "assets/shots/g07-gta5-red-convertible-h.mp4",  start: 0.3, fit: { x: 0.42, y: 0.5, s: 1 } },
                                     b: { clip: "assets/shots/s096-police-street-h.mp4",          start: 0.1, fit: { x: 0.5,  y: 0.5, s: 1 } } },
              // the city (ends here: the brightest, sharpest pair): Michael over Los Santos / driving into Vice City under the towers
              // (s011 from 1.85 s, once the road signs have dropped 40 px clear of "2026 · LEONIDA")
              { at: 4.25, dur: 1.75, a: { clip: "assets/shots/g16-gta5-michael-skyline-h.mp4",  start: 0.3, fit: { x: 0.72, y: 0.5, s: 1 } },
                                     b: { clip: "assets/shots/s011-vice-highway-h.mp4",           start: 1.85, fit: { x: 0.5,  y: 0.5, s: 1 } } }
            ],
            seam: { yLeft: 840, yRight: 1080 },   // 12.5°, falling to the right
            heroSize: 176, heroMaxW: 770,         // GTA VI: the hero, sunset, ~88% of the safe width
            nameSize: 112, vsSize: 112,           // GTA V (86% white) and the VS share the second size: 3 sizes in the frame (176 / 112 / 26)
            gapVS: 30,          // name ink ↔ VS ink
            seamClear: 26,      // name ink ↔ the seam under / over its nearest letter
            gapLabel: 22,       // label ↔ name, on the ink
            bladeGap: 26,
            blade: { width: 4, color: "#FFFFFF", bloom: "#FFE2C4", strength: 0.55 },
            vsBloom: { color: "#FFE2C4", strength: 0.35 },
            // a soft dark lip on each side of the seam, under the lockup (light, not a box): darkness at the seam and at
            // 28 / 56 / 80% of scrimH; 0 at scrimH
            scrimH: 540, scrim: [0.70, 0.56, 0.34, 0.12],
            sunset: "linear-gradient(100deg, #F84FA4 0%, #FE78A6 24%, #FE8E4E 62%, #FEB747 100%)",
            expose: { peak: 1.6, hold: 3 / 30, dur: 0.34 }
          }
        },
        vsFill: "linear-gradient(100deg, #F84FA4 0%, #FE78A6 26%, #FE8E4E 64%, #FEB747 100%)",
        safe: { left: 72, right: 936, top: 230, bottom: 1480 },
        inkEdge: { left: 96, right: 900 },   // every flush edge is aligned on the glyph ink, inset 24-36 px from the safe limits
        // seconds
        timing: {
          split: { cutB: 1.1, slide: 2.3, cutSplit: 2.6, vsFall: 0.14, labels: 2.72, sheen: 4.0, sheenDur: 0.8, out: 5.3 },
          centre: { open: 0.0, openDur: 0.5, nameA: 0.10, labelA: 0.30, vsIn: 0.36, slam: 1.0, fall: 0.14, labelB: 1.12, sheen: 1.6, out: 5.25, close: 5.55, closeDur: 0.42 }
        }
      };

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const vKey = CONFIG.variants[String(VARS.variant)] ? String(VARS.variant) : "0";
        const V = CONFIG.variants[vKey], D = CONFIG.duration;
        const $ = (s) => document.querySelector(s);
        const setAttr = (el, k, val) => { if (el && el.getAttribute(k) !== String(val)) el.setAttribute(k, String(val)); };
        const isSplit = V.layout === "split";
        $("#L" + (isSplit ? "0" : "1")).classList.add("on");
        $("#O" + (isSplit ? "0" : "1")).classList.add("on");
        // the inactive variant's clips stay hidden
        document.querySelectorAll("#L" + (isSplit ? "1" : "0") + " video").forEach((v) => (v.style.display = "none"));

        // ---------- measuring helpers (ink, not line boxes) ----------
        const ctx = document.createElement("canvas").getContext("2d");
        function ink(text, px, weight, ls) {
          ctx.font = weight + " " + px + "px Archivo"; try { ctx.fontStretch = "expanded"; } catch (e) {}
          try { ctx.letterSpacing = (ls || 0) + "px"; } catch (e) {}
          const m = ctx.measureText(text.toUpperCase());
          return { asc: m.actualBoundingBoxAscent, desc: m.actualBoundingBoxDescent, l: m.actualBoundingBoxLeft, r: m.actualBoundingBoxRight, w: m.width };
        }
        // baseline offset of a single-line element from its top (DOM marker)
        function baselineOf(el) {
          const mk = document.createElement("span"); mk.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline";
          el.appendChild(mk); const b = mk.offsetTop - el.offsetTop; el.removeChild(mk); return b;
        }
        function fit(el, size, maxW) {
          el.style.fontSize = size + "px";
          let s = size; while (el.scrollWidth > maxW && s > 60) { s -= 2; el.style.fontSize = s + "px"; }
          return s;
        }
        // trailing tracking off the last glyph so centred / flush text sits on its ink
        function trimTrack(el) {
          const t = el.textContent; if (t.length < 2) return;
          el.innerHTML = ""; el.appendChild(document.createTextNode(t.slice(0, -1)));
          const l = document.createElement("span"); l.style.letterSpacing = "0"; l.textContent = t.slice(-1); el.appendChild(l);
        }
        // set a label's cap top exactly `gap` px under the element above it (name baseline), measured on the ink
        function stackUnder(above, label, gap, labelCap) {
          const aBase = above.offsetTop + baselineOf(above);
          const capTop = label.offsetTop + baselineOf(label) - labelCap;
          const m = parseFloat(label.style.marginTop) || 0;
          label.style.marginTop = (m + (aBase + gap - capTop)) + "px";
        }
        // place a block so a child's baseline lands on y (block is absolutely positioned at left:0/top:0)
        function placeBaseline(block, child, y) { block.style.top = "0px"; const b = child.offsetTop + baselineOf(child); block.style.top = (y - b) + "px"; }

        // ======================================================================================

        function buildCentre(tl) {

          const clipA = (k) => `polygon(0px ${(yL * k).toFixed(2)}px, 1080px ${(yR * k).toFixed(2)}px, 1080px ${yR}px, 0px ${yL}px)`;
          const clipB = (k) => `polygon(0px ${yL}px, 1080px ${yR}px, 1080px ${(yR + (1920 - yR) * (1 - k)).toFixed(2)}px, 0px ${(yL + (1920 - yL) * (1 - k)).toFixed(2)}px)`;

            background: sc(180), transformOrigin: "50% 0%", transform: `rotate(${ang}rad)` });
          V.cuts.forEach((c, i) => {
            [["A", c.a], ["B", c.b]].forEach(([s, shot]) => {
              const v = $("#v1" + s.toLowerCase() + i), w = $("#sw" + s + i), f = shot.fit, org = (f.x * 100) + "% " + (f.y * 100) + "%";
              setAttr(v, "src", shot.clip); setAttr(v, "data-media-start", shot.start);
              setAttr(v, "data-start", c.at); setAttr(v, "data-duration", c.dur);

          trimTrack($("#cAlab")); trimTrack($("#cBlab"));
          $("#cAn").style.fontSize = V.nameSize + "px";

          ["#cA", "#cB", "#cAlw", "#cBlw"].forEach((b) => Object.assign($(b).style, { left: "0px", width: "1080px" }));
          const kA = ink(A.name, V.nameSize, 800, 0.02 * V.nameSize), kB = ink(B.name, hs, 800, 0.02 * hs), kL = ink("LOS SANTOS", 26, 600);
          // ink span of a centred line (the trailing tracking shifts the ink half a track left)
          const spanOf = (k, ls) => { const o = cx - k.w / 2; return [o - k.l, o + k.r]; };
          const [aL, aR] = spanOf(kA), [bL, bR] = spanOf(kB);
          // VS: pure white wide Archivo 900 with a soft warm bloom, ink centred on the seam
          const vsT = $("#vsText"); vsT.textContent = V.vs.toUpperCase(); vsT.style.fontSize = V.vsSize + "px";
          $("#vsBack").style.display = "none";
          const kV = ink(V.vs, V.vsSize, 900, 0.02 * V.vsSize);
          const vsLeft = cx - (kV.r - kV.l) / 2, vsTop = cy - kV.asc / 2, vsBot = cy + kV.asc / 2;

          const bw = V.blade.width, glow = bloomBox(V.blade.bloom, V.blade.strength);
          const len = Math.hypot(1080, yR - yL) + 80;
          Object.assign($("#blade").style, { left: "-40px", top: (yL - (yR - yL) * (40 / 1080)) + "px", width: len + "px", transform: `rotate(${ang}rad)` });
          const along = (x) => (x + 40) / Math.cos(ang);
          const gL = along(inkL) - V.bladeGap, gR = along(inkR) + V.bladeGap;
          Object.assign($("#segL").style, { left: "0px", width: gL + "px", transformOrigin: "100% 50%" });
          Object.assign($("#segR").style, { left: gR + "px", width: (len - gR) + "px", transformOrigin: "0% 50%" });
          ["#segL", "#segR"].forEach((id) => Object.assign($(id).style, { top: (-bw / 2) + "px", height: bw + "px", borderRadius: (bw / 2) + "px", background: V.blade.color, boxShadow: glow }));
          $("#shadeL").style.display = "none"; $("#shadeR").style.display = "none";

          // GTA V rises char by char; GTA VI is the sunset (the frame's one accent) with a warm bloom, slammed whole
          Look.reveal(tl, "#cAn", T.nameA, { by: "chars", stagger: 0.03, dur: 0.6 });
          Look.fill("#cBn", V.sunset, { sheen: true });
          $("#cBn").style.filter = "drop-shadow(0 2px 3px rgba(0,0,0,.3)) drop-shadow(0 0 22px rgba(248,79,164,.32)) drop-shadow(0 0 60px rgba(254,142,78,.18))";

          // ======================= timeline =======================
          // the panes open from the seam (each starts half open, so frame 0 already shows both shots)
          const eo = gsap.parseEase("expo.out"), ei = gsap.parseEase("power2.in");
          // one driver over the whole card, so every seek (forward or back) sets the panes from absolute time
          const paneK = (t) => t < T.open + T.openDur ? 0.5 * (1 - eo(Math.max(0, t - T.open) / T.openDur)) : (t < T.close ? 0 : ei(Math.min(1, (t - T.close) / T.closeDur)));
          Look.drive(tl, 0, D, (p) => { const k = paneK(p * D); $("#pA").style.clipPath = clipA(k); $("#pB").style.clipPath = clipB(k); });
          gsap.set(["#segL", "#segR"], { scaleX: 0 });
          tl.fromTo(["#segL", "#segR"], { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, T.open + 0.02);
          Look.enter(tl, "#cAlab", T.labelA, { from: "blur", dur: 0.5, blur: 10 });
          // the VS settles onto the seam (a setup, not the hit)
          gsap.set("#vsSlam", { autoAlpha: 0, scale: 1.5, filter: "blur(12px)" });
          tl.fromTo("#vsSlam", { autoAlpha: 0, scale: 1.5, filter: "blur(12px)" },
            { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out", immediateRender: false }, T.vsIn);
          tl.set("#vsSlam", { filter: "none" }, T.vsIn + 0.4);
          // PAYOFF 1.0 s: GTA VI slams in under the VS on the first matched cut, complete and in its final colour on the hit frame;
          // the light is an exposure pulse on the footage (no white flash), RGB split 5 px for 0.16 s on GTA VI only
          const fall = T.slam - T.fall;
          gsap.set("#cBs", { autoAlpha: 0, scale: 1.7, filter: "blur(16px)" });
          tl.fromTo("#cBs", { autoAlpha: 0, scale: 1.7, filter: "blur(16px)" },
            { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: T.fall, ease: "power3.in", immediateRender: false }, fall);
          tl.set("#cBs", { filter: "none" }, T.slam);
          Look.impact(tl, T.slam, { shake: "#shake", amp: 9, flash: 0, zoom: 1.03, dur: 0.34 });
          Look.expose(tl, T.slam, { target: "#shake", peak: V.expose.peak, hold: V.expose.hold, dur: V.expose.dur });
          Look.chroma(tl, "#cBn", T.slam, 0.16, { px: 5 });
          gsap.set("#blade", { filter: "brightness(1)" });
          tl.fromTo("#blade", { filter: "brightness(2)" }, { filter: "brightness(1)", duration: 0.45, ease: "power2.out", immediateRender: false }, T.slam);
          Look.enter(tl, "#cBlab", T.labelB, { from: "blur", dur: 0.5, blur: 10 });
          Look.sheen(tl, "#cBn", T.sheen, { dur: 1.0 });
          // exit
          Look.exit(tl, ["#cAlw", "#cBlw"], T.out, { to: "blur", dur: 0.32, stagger: 0.04 });
          Look.exit(tl, ["#cA", "#cB"], T.out + 0.06, { to: "blur", dur: 0.4, stagger: 0.06, blur: 14 });
          Look.exit(tl, "#vsSlam", T.out + 0.14, { to: "blur", dur: 0.36, blur: 16, scale: 1.12 });
          tl.to(["#segL", "#segR"], { scaleX: 0, duration: 0.4, ease: "power3.in" }, T.out + 0.12);
          // the panes shut back onto the seam from T.close (paneK above): they opened from it
        }
      })();
    </script>
  </body>
</html>
