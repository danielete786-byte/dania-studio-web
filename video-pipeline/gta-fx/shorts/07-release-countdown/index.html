                 hard cut to the sequin dancer under blue flares (a warm additive flash, punch, shake, RGB split, the numeral's
                 bloom spikes and settles into the club's blue, then a sheen), the clock cascades to 23:59:59, and the shot holds

                 The numeral counts 3 -> 2 -> 1 on the cuts, the "S" of DAYS drops out as the 1 lands on the cut to Lucia

                 words' size, "23:59:01 TO GO", and ticks while she holds the lens (a pre-slowed, motion-interpolated clip).

     Safe zone: all type inside x 72-936, y 230-1480. -->

        const SHEEN = "linear-gradient(105deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.85) 50%, rgba(255,255,255,0) 60%)";
        function gradReels(reels, group) {
          const GW = group.offsetWidth;
          reels.forEach((R) => {
            const gx = R.win.offsetLeft;
            R.cells.forEach((c, k) => {
              const oy = "calc(" + (-(R.top + k * R.P)).toFixed(1) + "px - var(--sy, 0px))";
              c.style.backgroundImage = SHEEN + ", " + CONFIG.sunset;
              c.style.backgroundSize = (3 * GW) + "px " + R.H + "px, " + GW + "px " + R.H + "px";
              c.style.backgroundPosition = "calc(var(--shx, " + (1.6 * GW) + "px) - " + gx + "px) " + oy + ", " + (-gx) + "px " + oy;

        const bell = (p) => (p <= 0 || p >= 1) ? 0 : (p < 0.5 ? 4 * p * p : 4 * (1 - p) * (1 - p));       // speed of an inOut roll
        const decay = (p) => (p <= 0 || p >= 1) ? 0 : Math.pow(2, -8 * p) * (1 - p);                      // speed of an expo.out roll
        const rise = (p) => (p <= 0 || p >= 1) ? 0 : Math.min(1, 1.8 * p * p);                              // speed of a power3.in roll
        function roll(tl, R, from, to, t0, dur, ease) {
          ease = ease || "power3.inOut";
          tl.fromTo(R.strip, { y: R.y(from), "--sy": R.y(from) + "px" }, { y: R.y(to), "--sy": R.y(to) + "px", duration: dur, ease, immediateRender: false }, t0);
          // the outgoing digit turns away: slow rolls fade it over 60% of the move; fast-start rolls (expo.out) clear it in the
          // first sixth, before its top can sit in the bottom feather under the landed digit (r05 snapshot: a "2" arc at 2.9 s)

            tl.fromTo(R.blurEl, { attr: { stdDeviation: "0 0" } }, { attr: { stdDeviation: "0 " + sd }, duration: dur,

        // white type catching the scene's light: a bloom as drop-shadows on the line's container (outside the line masks, so

        // on the reel group, outside the reel masks, so the glow follows the glyphs and is never clipped into a band
        const numBloom = (hex, s) => {

        };
        const NUM_GLOW = "drop-shadow(0 0 22px rgba(248,79,164,.32)) drop-shadow(0 0 70px rgba(254,142,78,.16))";   // its own light, before the hit
        // the scene's light on the type, one per-frame driver for the whole clip. Before the payoff the numeral carries its own
        // sunset glow and the white type a faint white bloom. On the payoff the numeral's bloom spikes to `peak` in the light's
        // colour and decays to `rest` (expo.out over `decay` s, default 0.6); the white type flares to `typePeak` (default 1.5)
        // and its fill flushes `tintK` (default 50%) toward the light, settling to pure white over 1.2 s; it keeps a bloom in the

        function sceneLight(tl, o) {

          const colorAt = (t) => { let c = o.keys[0].color; for (let i = 1; i < o.keys.length; i++) if (t >= o.keys[i].at) c = mixHex(c, o.keys[i].color, Math.min(1, (t - o.keys[i].at) / 0.35)); return c; };
          Look.drive(tl, 0, D, (p) => {
            const t = p * D;
            if (t < o.pay) {

              o.tint.forEach((el) => { el.style.color = "#FFFFFF"; });
              return;
            }
            const c = colorAt(t), kN = 1 - eN(Math.min(1, (t - o.pay) / dec)), kT = 1 - eT(Math.min(1, (t - o.pay) / 1.2));

        // the payoff light: a warm additive wash (screen blend) between the footage and the type, brightest around the numeral and
        // falling off to the frame edges, so the hit reads as light and never as a grey veil. 2 frames up (peak on the frame after
        // the cut), 4 frames down. Plate renders only.
        function warmFlash(tl, at, color, peak, cy) {
          if (!plate) return;
          const n = parseInt(color.replace("#", ""), 16), rgb = ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255);
          const fl = document.createElement("div"); fl.className = "wflash";
          fl.style.background = "radial-gradient(ellipse 95% 62% at 50% " + cy + "px, rgba(" + rgb + ",1) 0%, rgba(" + rgb + ",.62) 45%, rgba(" + rgb + ",.26) 100%)";

        // per-shot slow push (each cut starts a fresh move, like an editor's keyframed push-in); `to` may be one value or one per shot
        function pushShots(tl, ids, toAll) {
          ids.forEach((id, i) => {
            const v = document.getElementById(id), s = +v.dataset.start, d = +v.dataset.duration;
            const to = Array.isArray(toAll) ? toAll[i] : toAll;
            const a = (i % 2) ? to : 1.0, b = (i % 2) ? 1.0 + (to - 1) * 0.15 : to;   // alternate push-in / ease-back

        }

        /* ======================= variant 0: Rolling digits (full bleed, the digits own the top of the frame) ======================= */
        function build0(tl) {
          // the countdown owns the top of every shot: a giant sunset day numeral, "DAYS LEFT" under it, then the live clock, over a
          // soft top scrim; the Rockstar date and the platforms sit low in the frame over a floor scrim. The scrims are part of the
          // graphic, so they stay on a transparent export too.
          $("#kick0").style.display = "none"; $("#w02").style.display = "none";
          $("#lift0").style.filter = plate
            ? "drop-shadow(0 2px 6px rgba(0,0,0,.28)) drop-shadow(0 10px 34px rgba(0,0,0,.3))"
            : "drop-shadow(0 3px 10px rgba(0,0,0,.45)) drop-shadow(0 12px 40px rgba(0,0,0,.4))";
          $("#foot0").style.filter = "drop-shadow(0 2px 8px rgba(0,0,0,.5))";

          const d0 = split4(total)[0], dDig = Math.max(1, String(d0).length);
          const digitsAt = (x) => { const g = split4(x); return (String(g[0]).padStart(dDig, "0") + [1, 2, 3].map((i) => String(g[i]).padStart(2, "0")).join("")).split(""); };

          const unitText = ((d0 === 1 ? V.words[0][0] : V.words[0][1]) + " " + V.words[1]).toUpperCase();
          const held = frames[nTicks];                                              // the digits on the hold (e.g. 29 23:59:57)

          /* ---- the day numeral, alone and centred: Archivo Expanded 900, solved so its ink is at most V.width, capped at maxNum ---- */
          function lay(N) {
            const fN = { w: 900, s: N }, MN = dmet(fN), slot = Math.ceil(MN.adv), capN = ink(fN, "H").actualBoundingBoxAscent;
            const inkL = (d) => (slot - tw(fN, d)) / 2 - ink(fN, d).actualBoundingBoxLeft;   // digit ink inside its centred slot
            const inkR = (d) => (slot - tw(fN, d)) / 2 + ink(fN, d).actualBoundingBoxRight;
            const numL = inkL(held[0]), numR = (dDig - 1) * slot + inkR(held[dDig - 1]);

          }
          const N = Math.min(V.maxNum, Math.floor(100 * V.width / lay(100).W));
          const Lk = lay(N), fN = Lk.fN, capN = Lk.capN;
          const capTop = V.capTop, numBase = capTop + capN;

          // ---- the unit line, "DAYS LEFT", centred under the numeral ----
          const fW = { w: V.unit.weight, s: V.unit.size }, capW = ink(fW, "H").actualBoundingBoxAscent;
          const unitCap = Math.round(numBase + V.unit.gap), unitBase = unitCap + capW;
          // ---- the clock, the second voice ----
          const fC = { w: V.clock.weight, s: V.clock.size, fam: "Inter" }, MC = dmet(fC), capC = MC.cap;
          const clockCap = V.clock.capTop;
          const padN = [Math.round(0.2 * capN), Math.min(Math.round(0.12 * capN), Math.floor(V.unit.gap) - 6)];
          const padC = [Math.round(0.3 * capC), Math.round(0.3 * capC)];

          const reels = [];
          const nw = $("#numWrap0"), dgrp = $("#dgrp");
          const numLeft = Math.round(540 - Lk.W / 2 - Lk.numL);
          nw.style.left = numLeft + "px"; nw.style.top = (capTop - padN[0]) + "px";
          for (let r = 0; r < dDig; r++) { const R = makeReel(distinct(frames, r), fN, Object.assign({}, Lk.MN, { cap: capN }), padN, Lk.slot, { grad: true }); dgrp.appendChild(R.win); reels.push(R); }
          nw.style.width = (dDig * Lk.slot) + "px"; nw.style.height = reels[0].H + "px";
          const GW = gradReels(reels.slice(0, dDig), dgrp);
          dgrp.style.filter = NUM_GLOW;
          gsap.set(nw, { transformOrigin: (dDig * Lk.slot / 2) + "px " + (padN[0] + capN / 2) + "px" });   // the punch grows from the numeral's centre

          // DAYS LEFT: one tracked line, every glyph in its own mask (kerned), the line clipped to its cap band with short feathers
          const words = $("#words0"); words.style.left = "0px"; words.style.top = "0px";
          const w1 = $("#w01"), LW = Math.round(fW.s * 1.25), lsPx = V.unit.track * fW.s;
          const mW = ink(fW, "HNOX"); const baseIn = (LW - (mW.fontBoundingBoxAscent + mW.fontBoundingBoxDescent)) / 2 + mW.fontBoundingBoxAscent;

          date.style.textShadow = "1.5px 0 0 " + CONFIG.rockstar + ", 0 0 18px rgba(238,8,242,.28), 0 0 44px rgba(238,8,242,.12)";
          const plat = $("#plat0"); plat.innerHTML = PLATS;
          placeCap(plat, fR, mR.baseline + 24, 0.3); centreTracked(plat, 540, 0.3);

          $("#scrim0t").style.height = (clockCap + capC + 260) + "px";
          $("#scrim0b").style.height = (1920 - (V.footTop - 300)) + "px";
          const dMid = Math.round((V.footTop + mR.baseline + 24 + 19) / 2), dsc = $("#scrim0d");
          dsc.style.left = "0px"; dsc.style.width = "1080px"; dsc.style.top = (dMid - 190) + "px"; dsc.style.height = "380px"; dsc.style.opacity = "0.55";

          /* ---------------- timeline ---------------- */
          const shotIds = ["v0a", "v0b", "v0c", "v0d", "v0e"];
          if (plate) pushShots(tl, shotIds, [1.06, 1.06, 1.06, 1.06, 1.08]);
          tl.fromTo(["#scrim0t", "#scrim0b"], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out", immediateRender: true }, 0);
          tl.fromTo("#scrim0d", { opacity: 0 }, { opacity: 0.55, duration: 0.5, ease: "power2.out", immediateRender: true }, 0.5);

          tl.fromTo(s1.inners, { yPercent: -112 }, { yPercent: 0, duration: 0.5, ease: "expo.out", stagger: 0.03, immediateRender: false }, 0.3);
          reels.slice(dDig).forEach((R, i) => roll(tl, R, R.start, R.land, 0.46 + 0.035 * i, 0.5, "expo.out"));
          colons.forEach((c, k) => tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out", immediateRender: true }, 0.46 + 0.035 * (2 * k + 2) + 0.06));

          if (payAt >= 0) sceneLight(tl, { pay: payAt, keys: V.lights, num: dgrp, peak: 0.7, rest: 0.35, decay: 0.5, type: [words, line2], typeRest: 0.45, typePeak: 1.0, tintK: 0.35, tint: [words] });

          tl.fromTo(s1.inners, { yPercent: 0 }, { yPercent: 112, duration: 0.3, ease: "power3.in", stagger: 0.02, immediateRender: false }, X + 0.06);
          tl.fromTo(s1.inners, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.in", stagger: 0.02, immediateRender: false }, X + 0.06);

          colons.forEach((c, k) => tl.fromTo(c, { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power2.in", immediateRender: false }, X + 0.025 * (dDig + 2 * k + 1)));
          Look.exit(tl, ["#plat0", "#date0"], X, { to: "blur", dur: 0.34, stagger: 0.04 });
          tl.fromTo("#scrim0t", { opacity: payAt >= 0 ? 0.55 : 1 }, { opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false }, X + 0.12);
          tl.fromTo("#scrim0b", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false }, X + 0.12);
          tl.fromTo("#scrim0d", { opacity: 0.55 }, { opacity: 0, duration: 0.35, ease: "power2.in", immediateRender: false }, X + 0.05);
        }

        /* ======================= variant 1: One day left (full bleed, lower title block) ======================= */
        function build1(tl) {
          const x0 = V.x, capTop = V.capTop;
          const count = V.count.map(String), last = V.count[V.count.length - 1];
          // numeral + stacked words, solved from font metrics: the first word's caps align to the numeral's top, the second
          // word's baseline to the numeral's baseline
          const fN = { w: 900, s: V.numSize };
          const MN = dmet(fN);
          const capN = ink(fN, String(last)).actualBoundingBoxAscent;               // the landed numeral's flat cap height
          const capRW = ink({ w: 900, s: 100 }, "DAYLEFT").actualBoundingBoxAscent / 100;
          const gapRatio = 0.26;                                                     // leading between the words, x their cap
          const Fw = Math.round(capN / ((2 + gapRatio) * capRW));
          const fW = { w: 900, s: Fw };
          const capW = ink(fW, "H").actualBoundingBoxAscent;
          const wordA = V.words[0][1].toUpperCase(), wordAone = V.words[0][0].toUpperCase(), wordB = V.words[1].toUpperCase();

          // numeral window: left-aligned cells, slot = widest count digit; the block's left edge is the landed numeral's ink
          const advs = count.map((d) => tw(fN, d)), slot = Math.ceil(Math.max(...advs));
          const inkL = (d) => -ink(fN, d).actualBoundingBoxLeft, inkR = (d) => ink(fN, d).actualBoundingBoxRight;
          const winLeft = Math.round(x0 - inkL(String(last)));
          const padN = [Math.round(0.17 * capN), Math.round(0.17 * capN)];
          const RN = makeReel(count, fN, Object.assign({}, MN, { cap: capN }), padN, slot, { grad: true, align: "left" });
          const nw = $("#numWrap"); nw.appendChild(RN.win);
          nw.style.left = winLeft + "px"; nw.style.top = (capTop - padN[0]) + "px"; nw.style.width = slot + "px"; nw.style.height = RN.H + "px";
          gradReels([RN], nw);
          nw.style.filter = NUM_GLOW;

          // words: left edge sits a fixed gap after the CURRENT numeral's ink, so it re-spaces as 3 -> 2 -> 1
          const GAP = Math.round(0.085 * V.numSize);
          const wordsX = (d) => winLeft + inkR(d) + GAP;
          const words = $("#words1"); words.style.left = "0px"; words.style.top = "0px";
          const w1 = $("#w1"), w2 = $("#w2");
          const capTopW1 = capTop, baseW2 = capTop + capN;
          const L = Math.round(Fw * 1.25);
          const mW = ink(fW, "HNOX"); const baseIn = (L - (mW.fontBoundingBoxAscent + mW.fontBoundingBoxDescent)) / 2 + mW.fontBoundingBoxAscent;
          // each word line is clipped to its own cap band with short feathers, so a letter falling in (or the "S" falling out)
          // never shows over the neighbouring line; 40 px side padding keeps glyph overhangs inside the mask box
          const capInBox = baseIn - capW, fT = Math.round(0.16 * capW), fB = Math.round(0.16 * capW);
          const lineMask = "linear-gradient(180deg, transparent " + (capInBox - fT) + "px, #000 " + (capInBox - 2) + "px, #000 " + (baseIn + 3) + "px, transparent " + (baseIn + fB) + "px)";
          [w1, w2].forEach((w) => { w.style.position = "absolute"; styleF(w, fW); w.style.lineHeight = L + "px"; w.style.height = L + "px"; w.style.left = "0px";
            w.style.padding = "0 40px"; w.style.marginLeft = "-40px"; w.style.webkitMaskImage = w.style.maskImage = lineMask; });
          w1.style.top = (capTopW1 + capW - baseIn).toFixed(1) + "px";
          w2.style.top = (baseW2 - baseIn).toFixed(1) + "px";
          const s1 = kernSplit(w1, wordA, fW, 0), s2 = kernSplit(w2, wordB, fW, 0);
          const sInner = s1.inners[s1.inners.length - 1];                            // the "S" that drops out at 1
          const hasS = wordA !== wordAone;
          gsap.set([s1.inners, s2.inners], { yPercent: -112 });
          gsap.set(words, { x: wordsX(count[0]) });
          $("#lift1").style.filter = "drop-shadow(0 3px 10px rgba(0,0,0,.30)) drop-shadow(0 14px 44px rgba(0,0,0,.36))";
          // DAY / LEFT carry a faint white bloom until the payoff, then catch the golden-hour light (sceneLight below)
          words.style.filter = bloomF("#FFFFFF", 0.3);

          // kicker above: GTA 6 + the date in Rockstar's style
          const kick = $("#kick1"); kick.textContent = V.kicker;
          const fL = { w: 600, s: V.label }, capL = ink(fL, "H").actualBoundingBoxAscent;
          placeCap(kick, fL, capTop - 46 - capL, 0.3); kick.style.left = x0 + "px";
          kick.style.textShadow = "1.5px 0 0 " + CONFIG.rockstar + ", 0 0 16px rgba(238,8,242,.26), 0 2px 10px rgba(0,0,0,.45)";

          /* the live clock, the second voice: HH:MM:SS in Inter 800 at the words' size (so the frame keeps three sizes: numeral,
             words + clock, labels), left-aligned on the block's ink edge under LEFT, with a small TO GO on its baseline */
          const total = Math.max(0, secs(CONFIG.release.at) - secs(V.from)) % 86400;
          const nT = Math.max(0, Math.floor((T.out - 0.1 - V.firstTick) / V.tick) + 1);
          const frames = []; for (let k = 0; k <= nT; k++) { const g = split4(total - k); frames.push([1, 2, 3].map((i) => String(g[i]).padStart(2, "0")).join("").split("")); }
          const fC = { w: 800, s: Fw, fam: "Inter" }, MC = dmet(fC), capC = MC.cap;
          const trk = -0.02 * Fw, slotC = Math.ceil(MC.adv + trk), colW = Math.ceil(tw(fC, ":") + trk);
          const rowGap = Math.round(0.45 * capW), clockCap = capTop + capN + rowGap;
          const padC = [Math.floor(0.45 * rowGap), Math.round(0.24 * capC)];
          const d0 = frames[0][0], inkIn = (slotC - tw(fC, d0)) / 2 - ink(fC, d0).actualBoundingBoxLeft;
          const clock = $("#clock1"); clock.classList.add("ck");
          const clockLeft = Math.round(x0 - inkIn);
          clock.style.left = clockLeft + "px"; clock.style.top = (clockCap - padC[0]) + "px";
          const creels = [], ccol = [];
          for (let g = 0; g < 3; g++) {
            if (g) { const c = makeReel([":"], fC, MC, padC, colW, { colon: true }); clock.appendChild(c.win); ccol.push(c.win); }
            for (let i = 0; i < 2; i++) { const R = makeReel(distinct(frames, g * 2 + i), fC, MC, padC, slotC); clock.appendChild(R.win); creels.push(R); }
          }
          const clockRight = clockLeft + 6 * slotC + 2 * colW - (slotC - tw(fC, "0")) / 2;     // the last digit's ink edge
          const lab = $("#lab1"); lab.textContent = V.clockLabel;
          placeCap(lab, fL, clockCap + capC - capL, 0.3); lab.style.left = Math.round(clockRight + 0.24 * capC) + "px";
          const plat = $("#plat1"); plat.innerHTML = PLATS;
          placeCap(plat, fL, clockCap + capC + 30, 0.3); plat.style.left = x0 + "px";
          clock.style.filter = bloomF("#FFFFFF", 0.3);

          /* ---------------- timeline ---------------- */
          if (plate) pushShots(tl, ["v1a", "v1b", "v1c"], [1.07, 1.07, 1.10]);   // the held portrait pushes further, so the read has motion
          tl.fromTo(["#scrim1", "#scrim1b"], { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out", immediateRender: true }, 0);
          Look.enter(tl, "#kick1", 0.1, { from: "blur", dur: 0.6, blur: 10 });
          // the first count drops in, then the words' letters fall into their lines
          roll(tl, RN, RN.start, RN.land, 0.16, 0.55, "expo.out");
          tl.fromTo(s1.inners, { yPercent: -112 }, { yPercent: 0, duration: 0.55, ease: "expo.out", stagger: 0.035, immediateRender: false }, 0.26);
          tl.fromTo(s2.inners, { yPercent: -112 }, { yPercent: 0, duration: 0.55, ease: "expo.out", stagger: 0.035, immediateRender: false }, 0.34);
          // count down on the cuts; the last step is the payoff
          let cur = RN.land;
          V.cuts.forEach((at, i) => {
            const pay = i === V.cuts.length - 1, next = count[i + 1];
            roll(tl, RN, cur, cur - 1, at, pay ? 0.55 : 0.34, pay ? "expo.out" : "power3.inOut"); cur--;
            tl.fromTo(words, { x: wordsX(count[i]) }, { x: wordsX(next), duration: pay ? 0.55 : 0.34, ease: pay ? "expo.out" : "power3.inOut", immediateRender: false }, at);
            if (pay) {
              if (hasS && Number(next) === 1) {
                // DAYS -> DAY: the "S" drops out of its line and is gone before it reaches the line's bottom feather
                tl.fromTo(sInner, { yPercent: 0 }, { yPercent: 115, duration: 0.2, ease: "power3.in", immediateRender: false }, at);
                tl.fromTo(sInner, { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "none", immediateRender: false }, at);
              }
              if (plate) {
                Look.impact(tl, at, { shake: "#shake1", amp: 12, flash: 0.5, zoom: 1.045 });
                // the leak crosses the warm sky and fence above her, not her dark shirt (r05: a magenta smudge on the fabric)
                Look.leak(tl, at + 0.04, 1.3, { colors: ["#FEB747", "#FE8E4E"], y: 0.30, opacity: 0.28, from: -0.35, to: 1.3 });
              }
              Look.chroma(tl, "#blk1", at, 0.42, { px: 16 });
              // light on the hit: the 1 blooms in the golden-hour light (sceneLight below) and, once the flash has cleared, one
              // sheen crosses it
              tl.fromTo(nw, { "--shx": (1.6 * slot) + "px" }, { "--shx": (-3.2 * slot) + "px", duration: 0.6, ease: "power2.inOut", immediateRender: false }, at + 0.3);
              sceneLight(tl, { pay: at, keys: [{ at: at, color: V.light }], num: nw, peak: 1.1, rest: 0.6, type: [words, clock], typeRest: 0.55, tint: [words] });
            } else if (plate) {
              Look.impact(tl, at, { flash: 0.16 });
            }
          });
          // after the 1 lands: the live clock drops in reel by reel (left to right, motion-blurred), its label and the platforms follow
          creels.forEach((R, i) => roll(tl, R, R.start, R.land, V.clockIn + 0.035 * i, 0.5, "expo.out"));
          // each colon arrives with the digit after it, so no colon ever floats ahead of the digits
          ccol.forEach((c, k) => tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out", immediateRender: true }, V.clockIn + 0.035 * (2 * k + 2) + 0.06));
          Look.enter(tl, "#lab1", V.clockIn + 0.2, { from: "blur", dur: 0.5, blur: 8 });
          Look.enter(tl, "#plat1", V.clockIn + 0.3, { from: "up", dist: 16, dur: 0.6, blur: 6 });
          const cidx = creels.map((R) => R.land);
          for (let t = 1; t <= nT; t++) {
            const at = V.firstTick + (t - 1) * V.tick; let order = 0;
            for (let i = creels.length - 1; i >= 0; i--) {
              if (frames[t][i] === frames[t - 1][i]) continue;
              roll(tl, creels[i], cidx[i], cidx[i] - 1, at + order * 0.04, 0.28, "power3.inOut"); cidx[i]--; order++;
            }
          }
          // a slow second light across the hero numeral during the hold
          tl.fromTo(nw, { "--shx": (1.6 * slot) + "px" }, { "--shx": (-3.2 * slot) + "px", duration: 1.0, ease: "power2.inOut", immediateRender: false }, 5.1);

          // exit: the 1 and the clock reels roll away, the words' letters drop out of their lines, the small lines blur out. The
          // letters fade as they drop, so their top bars never sit on the line's bottom edge as underscores (r05: ~6.75 s)
          const X = T.out;
          Look.exit(tl, ["#plat1", "#lab1", "#kick1"], X, { to: "blur", dur: 0.34, stagger: 0.04 });
          creels.forEach((R, i) => roll(tl, R, 1, 0, X + 0.02 + 0.025 * i, 0.32, "power3.in"));
          ccol.forEach((c, k) => tl.fromTo(c, { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power2.in", immediateRender: false }, X + 0.02 + 0.025 * (2 * k + 1)));
          [[s2.inners, X + 0.06], [hasS ? s1.inners.slice(0, -1) : s1.inners, X + 0.1]].forEach(([els, at]) => {
            tl.fromTo(els, { yPercent: 0 }, { yPercent: 112, duration: 0.3, ease: "power3.in", stagger: 0.025, immediateRender: false }, at);
            tl.fromTo(els, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.in", stagger: 0.025, immediateRender: false }, at);
          });
          roll(tl, RN, 1, 0, X + 0.12, 0.34, "power3.in");
          tl.fromTo(["#scrim1", "#scrim1b"], { opacity: 1 }, { opacity: 0, duration: 0.42, ease: "power2.in", immediateRender: false }, X + 0.12);
        }
      })();
    </script>
  </body>
