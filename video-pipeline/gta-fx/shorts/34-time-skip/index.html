<!doctype html>
<!-- #34 Time skip card — GTA 6 component library, craft v2. 1080x1920 (9:16), 30 fps, 5.8 s.
     Full-frame component: it always shows footage and bridges two scenes.
       V0 "Time skip": full-bleed. The hours pass in cuts (afternoon -> golden hour -> sunset -> night); a big
          numeral counts 1 -> 2 -> 3 on each cut inside a "3 HOURS LATER" lockup and lands in sunset on the night cut.
       V1 "Date card": letterbox. A giant day numeral sits in the top black band, the weekday in Rockstar date style in
          the bottom band; on the cut from a Wednesday night to a Thursday morning the day rolls 18 -> 19.
     Variables: variant "0"/"1"; bg "plate" (finishing stack on) / "none" (footage still shows: this is a full-frame
     component; grain + vignette are off).
     Safe zone: all text inside x 72–936, y 230–1480. -->
<html lang="en" data-composition-variables='[
  {"id":"variant","type":"enum","label":"Variant","default":"0","options":[{"value":"0","label":"Time skip"},{"value":"1","label":"Date card"}]},
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/kit/look/look.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/kit/look/look.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
        font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

      /* ---------- footage: V0 full-bleed stage, V1 16:9 letterbox band (y 656–1264) ---------- */
      #stage0 { position: absolute; inset: 0; overflow: hidden; }
      #band { position: absolute; left: 0; top: 656px; width: 1080px; height: 608px; overflow: hidden; background: #000; }
      #shake0, #push0, #shake1, #push1 { position: absolute; inset: 0; }

      #ov { position: absolute; inset: 0; z-index: 10; }

      /* ---------- V0 · TIME SKIP: numeral + stacked words lockup, low in frame over a soft floor of shadow ---------- */
      #scrim0 { position: absolute; left: 0; right: 0; top: 700px; bottom: 0; opacity: 0; pointer-events: none;
        background:
          radial-gradient(ellipse 620px 300px at 50% 560px, rgba(6,5,10,.30), rgba(6,5,10,0) 100%),
          linear-gradient(180deg, rgba(6,5,10,0) 0%, rgba(6,5,10,.40) 34%, rgba(6,5,10,.60) 62%, rgba(6,5,10,.70) 100%); }
      #lock { position: absolute; left: 146px; top: 990px; width: 776px; height: 440px; }
      /* numeral: a 276px glyph column (+60px each side). The slot is an odometer window clipped to the cap band
         ±10px (Inter caps sit at 60–380px of the 440px line box), so a leaving / arriving digit never shows outside the
         numeral. The glow lives on the wrapper, outside the clip, so it is never cut. */
      #numGlow { position: absolute; left: -60px; top: 0; width: 396px; height: 440px;
        filter: drop-shadow(0 0 22px rgba(255,150,130,.30)) drop-shadow(0 12px 34px rgba(0,0,0,.42)); }
      #numBox { position: absolute; inset: 0; clip-path: inset(50px 0px 50px 0px); }
      #numBox .g { position: absolute; left: 60px; top: 0; width: 276px; height: 440px; text-align: center;
        font-family: "Inter", sans-serif; font-weight: 800; font-size: 440px; line-height: 440px; letter-spacing: -0.04em;
        font-optical-sizing: auto; font-feature-settings: "pnum" 1, "lnum" 1; will-change: transform; }
      #numBox .g.white { color: #fff; }
      /* right column: tracked place + clock, then HOURS / LATER, LATER's baseline on the numeral's baseline */
      #col { position: absolute; left: 290px; bottom: 47px; }
      #clk { font-size: 26px; letter-spacing: .34em; color: rgba(255,255,255,.88); margin: 0 0 30px 6px; white-space: nowrap;
        font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0,0,0,.45), 0 4px 14px rgba(0,0,0,.4); }
      #clk .dot { color: rgba(255,255,255,.74); }
      .odo { position: relative; display: inline-block; overflow: hidden; vertical-align: top; }
      .odo .ph { visibility: hidden; }
      .odo .od { position: absolute; left: 0; top: 0; }
      #words { font-size: 100px; line-height: .92; letter-spacing: .015em; white-space: nowrap;
        text-shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.36); }
      #words .wl { display: block; }

      /* ---------- V1 · DATE CARD: letterbox; day numeral in the top band, Rockstar-style weekday in the bottom band ---------- */
      #date { position: absolute; inset: 0; }
      /* Archivo wide 800 @ 465px, line box 465: baseline at 388px, cap top at 69px -> baseline y 616, cap top y 297 */
      #dayBox { position: absolute; left: 0; top: 228px; width: 1080px; height: 465px; transform-origin: 50% 84%; }
      .dl { position: absolute; top: 0; left: 0; height: 465px; white-space: nowrap;
        font-family: "Archivo", sans-serif; font-stretch: 125%; font-weight: 800; font-size: 465px; line-height: 465px; letter-spacing: -0.01em;
        font-feature-settings: "pnum" 1, "lnum" 1; }
      /* odometer window: clipped to the cap band ±10px (caps sit at 69–388px of the 465px line box), so the window
         ends at y 626, 30px above the footage band, and a rolling digit never shows above or below the line */
      .dl .slot { position: relative; display: inline-block; vertical-align: top; height: 465px; padding: 0 .06em; margin: 0 -.06em;
        clip-path: inset(59px 0px 67px 0px); }
      .dl .dg { display: inline-block; will-change: transform; }
      #dayFrom { color: #fff; filter: drop-shadow(0 0 22px rgba(255,255,255,.22)) drop-shadow(0 12px 40px rgba(0,0,0,.4)); }
      #dayTo { filter: drop-shadow(0 0 20px rgba(248,79,164,.45)) drop-shadow(0 0 70px rgba(254,142,78,.24)); }
      /* weekday: Rockstar date style (white wide-tracked caps, soft magenta offset + bloom). The bloom lives on the
         wrapper, outside the odometer clip, so it is never cut; the words travel 70px, a full window plus a gap. */
      #wkWrap { position: absolute; left: 0; right: 0; top: 1316px; height: 64px;
        filter: drop-shadow(0 0 14px rgba(238,8,242,.30)) drop-shadow(0 0 8px rgba(255,255,255,.14)); }
      /* caps sit at 9.5–53.4px of the 64px line box: the window is that band ±6px */
      #wk { position: absolute; inset: 0; clip-path: inset(3px -60px 5px -60px); }
      .wkl { position: absolute; left: 0; right: 0; top: 0; height: 64px; text-align: center; white-space: nowrap;
        font-family: "Archivo", sans-serif; font-stretch: 125%; font-weight: 700; font-size: 64px; line-height: 64px;
        letter-spacing: .28em; padding-left: .28em; text-transform: uppercase;
        text-shadow: 1.5px 0 0 rgba(238,8,242,.8), 0 0 2px rgba(255,255,255,.35); }
      #mo { position: absolute; left: 0; right: 0; top: 1418px; text-align: center; padding-left: .34em; letter-spacing: .34em;
        font-size: 26px; color: rgba(255,255,255,.86); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.8" data-width="1080" data-height="1920">
      <!-- V0 · Time skip: afternoon -> golden hour -> sunset -> night (full-bleed 9:16 shots, 1.0x, track 0) -->
      <div id="stage0" data-layout-allow-overflow><div id="shake0"><div id="push0">
        <video id="v0a" class="clip shot" data-variant="0" src="assets/shots/s011-vice-highway-v.mp4"  muted playsinline data-start="0"    data-duration="0.6"  data-media-start="0.15" data-track-index="0"></video>
        <video id="v0b" class="clip shot" data-variant="0" src="assets/shots/s026-sunset-pier-v.mp4"   muted playsinline data-start="0.6"  data-duration="0.7333" data-media-start="0.25" data-track-index="0"></video>
        <video id="v0c" class="clip shot" data-variant="0" src="assets/shots/s036-beach-bar-v.mp4"     muted playsinline data-start="1.3333" data-duration="0.7667" data-media-start="0.4" data-track-index="0"></video>
        <video id="v0d" class="clip shot" data-variant="0" src="assets/shots/s098-jason-fireworks-v.mp4" muted playsinline data-start="2.1" data-duration="1.1" data-media-start="0" data-track-index="0"></video>
        <video id="v0e" class="clip shot" data-variant="0" style="filter: brightness(1.16) contrast(1.04) saturate(1.12)" src="assets/shots/s039-blue-club-v.mp4"     muted playsinline data-start="3.2"  data-duration="1.55" data-media-start="1.08" data-track-index="0"></video>
        <video id="v0f" class="clip shot" data-variant="0" style="filter: brightness(1.08) saturate(1.08)" src="assets/shots/s039-blue-club-v.mp4"     muted playsinline data-start="4.75" data-duration="1.05" data-media-start="0"    data-track-index="0"></video>
      </div></div></div>
      <!-- V1 · Date card: Wednesday night -> Thursday morning (16:9 shots in the letterbox band, 1.0x, track 1) -->
      <div id="band" data-layout-allow-overflow><div id="shake1"><div id="push1">
        <video id="v1a" class="clip shot" data-variant="1" src="assets/shots/s039-blue-club-h.mp4"     muted playsinline data-start="0"   data-duration="2.0" data-media-start="0"    data-track-index="1"></video>
        <video id="v1b" class="clip shot" data-variant="1" src="assets/shots/s011-vice-highway-h.mp4"  muted playsinline data-start="2.0" data-duration="2.2" data-media-start="1.35" data-track-index="1"></video>
        <video id="v1c" class="clip shot" data-variant="1" src="assets/shots/s135-skydive-city-h.mp4"  muted playsinline data-start="4.2" data-duration="1.6" data-media-start="0"    data-track-index="1"></video>
      </div></div></div>

      <div id="ov" class="clip" data-start="0" data-duration="5.8" data-track-index="2">
        <!-- V0 -->
        <div id="skip">
          <div id="scrim0"></div>
          <div id="lock">
            <div id="numGlow"><div id="numBox" data-layout-allow-overflow data-layout-allow-occlusion></div></div>
            <div id="col">
              <div id="clk" class="t-label"></div>
              <div id="words" class="t-wide">
                <span class="wl"><span id="wHour" data-layout-allow-overflow></span><span class="lk-mask" id="sMask" data-layout-allow-overflow><span class="lk-in" id="sCh"></span></span></span>
                <span class="wl"><span id="wLater" data-layout-allow-overflow></span></span>
              </div>
            </div>
          </div>
        </div>
        <!-- V1 -->
        <div id="date">
          <div id="dayBox" data-layout-allow-overflow>
            <div class="dl" id="dayFrom"></div>
            <div class="dl" id="dayTo"></div>
          </div>
          <div id="wkWrap"><div id="wk" data-layout-allow-overflow><div class="wkl" id="wkFrom"></div><div class="wkl" id="wkTo"></div></div></div>
          <div id="mo" class="t-label-wide"></div>
        </div>
      </div>
    </div>

    <script>
      const CONFIG = {
        duration: 5.8,
        sunset: "linear-gradient(100deg, #F84FA4 0%, #FE78A6 24%, #FE8E4E 62%, #FEB747 100%)",
        variants: {
          // TIME SKIP. The numeral counts one step per hour cut; the last step is the payoff and lands in sunset.
          // Shots live in the <video> tags (ids v0a..v0f); their data-start values must equal the times below.
          "0": {
            style: "skip",
            count: ["1", "2", "3"],          // shown on cuts[0], cuts[1], cuts[2]
            unit: "Hour", plural: "s",       // the plural "s" rises in on the second step
            later: "Later",
            place: "Vice City",
            clock: ["16:40", "17:40", "18:40", "19:40"], // before, then one per cut (only the hour's last digit may change)
            shots: ["s011-vice-highway-v (afternoon)", "s026-sunset-pier-v (golden hour)", "s036-beach-bar-v (sunset)",
                    "s098-jason-fireworks-v (night, payoff)", "s039-blue-club-v (dancer)", "s039-blue-club-v (crowd)"],
            cuts: [0.6, 1.3333, 2.1],       // hour cuts on frames 18 / 40 / 63; cuts[2] is the payoff hit
            shotStarts: [0, 0.6, 1.3333, 2.1, 3.2, 4.75],
            out: 4.45                        // lockup masks out across the 4.75 cut
          },
          // DATE CARD. Digits that change roll in their own clipped slot; an unchanged digit cross-fades into sunset.
          "1": {
            style: "date",
            day: ["18", "19"],               // [before, after]; the "after" day lands in the sunset gradient
            weekday: ["Wednesday", "Thursday"],
            month: "November", year: "2026", // GTA 6 release: Thursday, November 19, 2026
            shots: ["s039-blue-club-h (Wednesday night)", "s011-vice-highway-h (Thursday morning, payoff)", "s135-skydive-city-h"],
            shotStarts: [0, 2.0, 4.2],
            roll: 2.0,                       // the cut, the roll and the hit
            nudge: -6,                       // optical centring of the day numeral (px)
            out: 5.05
          }
        }
      };

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const vKey = CONFIG.variants[String(VARS.variant)] ? String(VARS.variant) : "0";
        const plate = VARS.bg !== "none";
        const V = CONFIG.variants[vKey], D = CONFIG.duration;
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => Array.from(document.querySelectorAll(s));

        // only this variant's footage is shown (full-frame component: footage shows for bg "none" too)
        $$("video.shot").forEach((v) => { if (v.dataset.variant !== vKey) v.style.display = "none"; });
        if (V.style === "skip") { $("#band").style.display = "none"; $("#date").style.display = "none"; }
        else { $("#stage0").style.display = "none"; $("#skip").style.display = "none"; }

        // ---- build text ----
        if (V.style === "skip") {
          $("#numBox").innerHTML = V.count.map((c, i) => '<span class="g ' + (i === V.count.length - 1 ? "sun" : "white") + '" id="g' + i + '">' + c + "</span>").join("");
          $("#wHour").textContent = V.unit.toUpperCase();
          $("#sCh").textContent = V.plural.toUpperCase();
          $("#wLater").textContent = V.later.toUpperCase();
          // clock: only the last digit of the hour changes, so that one digit is an odometer
          const c0 = V.clock[0];
          const digits = V.clock.map((c) => c.charAt(1));
          $("#clk").innerHTML = V.place.toUpperCase() + ' <span class="dot">·</span> ' + c0.charAt(0) +
            '<span class="odo" data-layout-allow-overflow><span class="ph">' + digits[0] + "</span>" + digits.map((d) => '<span class="od">' + d + "</span>").join("") + "</span>" + c0.slice(2);
        } else {
          const a = V.day[0], b = V.day[V.day.length - 1];
          const slots = (s) => Array.from(s).map((d) => '<span class="slot"><span class="dg">' + d + "</span></span>").join("");
          $("#dayFrom").innerHTML = slots(a); $("#dayTo").innerHTML = slots(b);
          $("#wkFrom").textContent = V.weekday[0].toUpperCase(); $("#wkTo").textContent = V.weekday[V.weekday.length - 1].toUpperCase();
          $("#mo").textContent = V.month.toUpperCase() + " · " + V.year;
        }

        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true });

          if (V.style === "skip") {
            const [c1, c2, c3] = V.cuts;
            // ---------- footage: a slow push per shot (cuts reset it, like a real edit) ----------
            const st = V.shotStarts.concat([D]);
            for (let i = 0; i < st.length - 1; i++) {
              tl.fromTo("#push0", { scale: 1 }, { scale: i === 3 ? 1.07 : 1.045, duration: st[i + 1] - st[i], ease: "none", immediateRender: i === 0 }, st[i]);
            }
            gsap.set("#push0", { transformOrigin: "50% 42%" });

            // ---------- lockup entrance: floor of shadow, place/clock, HOUR / LATER rise; the "1" lands on the first cut ----------
            tl.fromTo("#scrim0", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, 0.1);
            Look.enter(tl, "#clk", 0.16, { from: "blur", dur: 0.5, blur: 8, scale: 1.04 });
            Look.reveal(tl, "#wHour", 0.2, { by: "chars", stagger: 0.03, dur: 0.62 });
            Look.reveal(tl, "#wLater", 0.28, { by: "chars", stagger: 0.03, dur: 0.62 });
            gsap.set("#sCh", { yPercent: 115 });
            const G = V.count.map((_, i) => "#g" + i);
            gsap.set(G, { yPercent: 115 });
            // step i: glyph i rises into the slot, glyph i-1 leaves upward through the clip (never crosses other type)
            const step = (i, at) => {
              tl.fromTo(G[i], { yPercent: 115 }, { yPercent: 0, duration: 0.5, ease: "expo.out", immediateRender: false }, at);
              if (i > 0) tl.fromTo(G[i - 1], { yPercent: 0 }, { yPercent: -115, duration: 0.42, ease: "expo.out", immediateRender: false }, at);
            };
            step(0, c1 - 0.06);
            step(1, c2 - 0.06);
            tl.fromTo("#sCh", { yPercent: 115 }, { yPercent: 0, duration: 0.5, ease: "expo.out", immediateRender: false }, c2 - 0.03);
            step(2, c3 - 0.1);   // lands ~90% in by the first lit frame of the hit
            // clock odometer: one hour per cut
            const od = $$("#clk .od");
            gsap.set(od, { yPercent: 120 }); gsap.set(od[0], { yPercent: 0 });
            [c1, c2, c3].forEach((t, i) => {
              tl.fromTo(od[i], { yPercent: 0 }, { yPercent: -120, duration: 0.36, ease: "expo.out", immediateRender: false }, t - 0.02);
              tl.fromTo(od[i + 1], { yPercent: 120 }, { yPercent: 0, duration: 0.36, ease: "expo.out", immediateRender: false }, t - 0.02);
            });
            // the hour cuts breathe a little light; the night cut is the real hit
            Look.expose(tl, c1, { target: "#shake0", peak: 1.2, dur: 0.22 });
            Look.expose(tl, c2, { target: "#shake0", peak: 1.24, dur: 0.22 });

            // ---------- payoff on the night cut: the "3" lands in sunset, exposure pulse, punch, a whisper of RGB ----------
            Look.fill("#g2", CONFIG.sunset, { sheen: true });
            Look.impact(tl, c3, { shake: "#shake0", flash: 0, amp: 9, zoom: 1.04, dur: 0.34 });
            Look.expose(tl, c3, { target: "#shake0", peak: 2.0, dur: 0.36 });   // night footage is dark: a stronger pulse to read
            Look.chroma(tl, "#numBox", c3, 0.16, { px: 5 });
            Look.sheen(tl, "#g2", c3 + 0.25, { dur: 0.75 });
            // the hold keeps moving: a slow drift of the lockup
            tl.fromTo("#lock", { y: 0 }, { y: -14, duration: V.out - c3, ease: "none", immediateRender: false }, c3);

            // ---------- exit: the numeral leaves up through its slot, the words drop into their masks ----------
            const T = V.out;
            tl.fromTo(G[2], { yPercent: 0 }, { yPercent: -115, duration: 0.42, ease: "power3.in", immediateRender: false }, T);
            const wordChars = $$("#wHour .lk-c").concat([$("#sCh")], $$("#wLater .lk-c"));
            tl.fromTo(wordChars, { yPercent: 0 }, { yPercent: 115, duration: 0.36, ease: "power3.in", stagger: 0.016, immediateRender: false }, T + 0.04);
            Look.exit(tl, "#clk", T, { to: "blur", dur: 0.32, blur: 10 });
            tl.fromTo("#scrim0", { opacity: 1 }, { opacity: 0, duration: 0.55, ease: "power2.inOut", immediateRender: false }, T + 0.2);
          } else {
            const R = V.roll;
            // ---------- footage: the band opens like a shutter, then a slow push per shot ----------
            gsap.set("#band", { clipPath: "inset(36% 0% 36% 0%)" });
            tl.fromTo("#band", { clipPath: "inset(36% 0% 36% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.75, ease: "expo.out", immediateRender: false }, 0);
            const st = V.shotStarts.concat([D]);
            gsap.set("#push1", { transformOrigin: "50% 50%" });
            for (let i = 0; i < st.length - 1; i++) {
              tl.fromTo("#push1", { scale: 1.04 }, { scale: 1.09, duration: st[i + 1] - st[i], ease: "none", immediateRender: i === 0 }, st[i]);
            }

            // ---------- layout: both day layers share one left edge (centred on the "after" day) ----------
            const w = $("#dayTo").offsetWidth;
            // optical centring: the "1" carries a wider left bearing than the "9" right bearing, so the ink sits ~6px
            // right of the box centre; V.nudge pulls it back onto x = 540
            gsap.set(["#dayFrom", "#dayTo"], { left: Math.round((1080 - w) / 2) + (V.nudge || 0) });
            Look.fill("#dayTo", CONFIG.sunset, { sheen: true });

            // ---------- entrance: day rises out of the band edge, weekday chars rise, month blooms in ----------
            const fromD = $$("#dayFrom .dg"), toD = $$("#dayTo .dg");
            gsap.set(fromD, { yPercent: 110 });
            tl.fromTo(fromD, { yPercent: 110 }, { yPercent: 0, duration: 0.8, ease: "expo.out", stagger: 0.07, immediateRender: false }, 0.1);
            Look.reveal(tl, "#wkFrom", 0.26, { by: "chars", stagger: 0.022, dur: 0.6 });
            Look.enter(tl, "#mo", 0.42, { from: "blur", dur: 0.55, blur: 8, scale: 1.04 });
            gsap.set("#wkTo", { y: 70 });

            // ---------- the roll: changed digits travel as one reel in their slot; unchanged ones turn sunset in place ----------
            const a = V.day[0], b = V.day[V.day.length - 1];
            toD.forEach((el, i) => {
              if (a.charAt(i) === b.charAt(i)) {
                gsap.set(el, { yPercent: 0, opacity: 0 });
                tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.inOut", immediateRender: false }, R - 0.05);
                tl.fromTo(fromD[i], { opacity: 1 }, { opacity: 0, duration: 0.02, ease: "none", immediateRender: false }, R + 0.11);
              } else {
                gsap.set(el, { yPercent: 110 });
                tl.fromTo(fromD[i], { yPercent: 0 }, { yPercent: -110, duration: 0.5, ease: "power4.out", immediateRender: false }, R - 0.06);
                tl.fromTo(el, { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: "power4.out", immediateRender: false }, R - 0.06);
              }
            });
            tl.fromTo("#wkFrom", { y: 0 }, { y: -70, duration: 0.5, ease: "power4.out", immediateRender: false }, R - 0.04);
            tl.fromTo("#wkTo", { y: 70 }, { y: 0, duration: 0.5, ease: "power4.out", immediateRender: false }, R - 0.04);

            // ---------- payoff on the morning cut: exposure pulse + punch on the band, RGB whisper on the day, sheen ----------
            Look.impact(tl, R, { shake: "#shake1", flash: 0, amp: 7, zoom: 1.035, dur: 0.32 });
            Look.expose(tl, R, { target: "#shake1", peak: 1.55, dur: 0.34 });
            Look.chroma(tl, "#dayBox", R, 0.16, { px: 5 });
            Look.sheen(tl, "#dayTo", R + 0.3, { dur: 0.75 });
            // hold: the day grows a touch while the morning plays
            tl.fromTo("#dayBox", { scale: 1 }, { scale: 1.025, duration: V.out - R - 0.3, ease: "none", immediateRender: false }, R + 0.3);

            // ---------- exit: digits drop and the weekday rises, both into the footage band; the month blurs out ----------
            const T = V.out;
            tl.fromTo(toD, { yPercent: 0 }, { yPercent: 110, duration: 0.44, ease: "power3.in", stagger: 0.06, immediateRender: false }, T);
            tl.fromTo("#wkTo", { y: 0 }, { y: -70, duration: 0.4, ease: "power3.in", immediateRender: false }, T + 0.06);
            Look.exit(tl, "#mo", T + 0.1, { to: "blur", dur: 0.34, blur: 10 });
          }

          Look.install(tl, { duration: D, grain: 0.15, vignette: V.style === "skip" ? 0.5 : 0.4, enabled: plate });
          tl.set({}, {}, D);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  </body>
</html>
