<!doctype html>
<!-- #44 Minimap route — GTA HUD kit. 1080x1920 (9:16), 30 fps, 7 s.
     Variables: variant "0" Corner minimap (in-game translucent blue HUD map, bottom-left of the safe zone)
                        "1" GPS card (smoked-glass route card with destination title and trip stats)
                bg      "plate" (sample GTA VI footage) / "none" (transparent overlay).
     Safe zone: everything sits inside x 72–936, y 230–1480. -->
<html lang="en" data-composition-variables='[
  {"id":"variant","type":"enum","label":"Variant","default":"0","options":[{"value":"0","label":"Corner minimap"},{"value":"1","label":"GPS card"}]},
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/kit/motion/motion.js"></script>
    <style>
      @font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 700; font-display: block; src: url("assets/fonts/BarlowCondensed-Bold.ttf") format("truetype"); }
      @font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 800; font-display: block; src: url("assets/fonts/BarlowCondensed-ExtraBold.ttf") format("truetype"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; font-feature-settings: "tnum" 1, "ss01" 1; }
      .plate { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #ov { position: absolute; inset: 0; }
      :root {
        --ink: #0B0B0E; --paper: #FFFFFF; --teal: #2EC4B6;
        --shadow-card: 0 1px 2px rgba(0,0,0,.25), 0 30px 80px -24px rgba(0,0,0,.65);
        --shadow-type: 0 2px 2px rgba(0,0,0,.35), 0 6px 24px rgba(0,0,0,.45);   /* DESIGN.md layered type shadow */
      }
      .hide { display: none !important; }
      svg { display: block; overflow: hidden; }

      /* ---------- v0: Corner minimap (in-game HUD) ---------- */
      .mm { position: absolute; left: 72px; top: 912px; width: 820px; height: 520px; color: #fff; }
      /* flat HUD blue, as on Rockstar's minimap: no vignette, no top shade */
      .mm-frame { position: absolute; inset: 0; border-radius: 20px; overflow: hidden; background: rgba(48,92,196,.94);
        -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
        box-shadow: 0 1px 2px rgba(0,0,0,.30), 0 26px 60px -22px rgba(0,0,0,.55); }
      .mm-map { position: absolute; inset: 0; }
      /* 80 px header: the status sits ~33 px below the top edge (sides 28 px); the map's strokes fade out under it (#mmHeadFade) */
      .mm-head { position: absolute; left: 0; top: 0; width: 820px; height: 80px; display: flex; align-items: center; justify-content: space-between;
        padding: 12px 28px 0; text-shadow: var(--shadow-type); }
      .mm-area { font-weight: 600; font-size: 26px; line-height: 1; letter-spacing: .3em; text-transform: uppercase; }
      .mm-dist { display: flex; align-items: baseline; transform-origin: 100% 60%; }
      #mmDist { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
      .mm-dist .u { font-weight: 600; font-size: 26px; line-height: 1; letter-spacing: .2em; margin-left: 10px; color: rgba(255,255,255,.86); }
      /* arrived state: 44 px Barlow 800 in Vice teal, one step up from the 40 px distance, so it fits the header with air */
      .mm-dist.arr #mmDist { color: var(--teal); font-weight: 800; font-size: 44px; letter-spacing: .04em; }
      .mm-dist.arr .u { display: none; }
      .mm-edge { position: absolute; inset: 0; border-radius: 20px; pointer-events: none;
        box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.16); }
      /* N disc centred on the panel's bottom edge, as on Rockstar's HUD (40 px disc, 24 px glyph: DESIGN's type floor) */
      .mm-north { position: absolute; left: 390px; top: 500px; width: 40px; height: 40px; border-radius: 50%;
        background: rgba(11,11,14,.92); color: #fff; font-weight: 700; font-size: 24px; line-height: 40px; text-align: center;
        box-shadow: 0 0 0 1.5px rgba(255,255,255,.85), 0 3px 10px rgba(0,0,0,.4); }

      /* ---------- v1: GPS card (smoked glass) ---------- */
      .gc { position: absolute; left: 72px; top: 452px; width: 864px; padding: 36px 40px 40px; border-radius: 36px; color: #fff;
        background: rgba(14,14,20,.78); -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), var(--shadow-card); }
      .gc-top { display: flex; align-items: center; justify-content: space-between; height: 40px; }
      .gc-label { font-weight: 600; font-size: 26px; line-height: 32px; letter-spacing: .3em; text-transform: uppercase; color: rgba(255,255,255,.68); white-space: nowrap; }
      /* optional chip (CONFIG tag), hidden by default; a confirmed state, so Vice teal ring */
      .gc-tag { height: 40px; padding: 0 12px 0 17px; border-radius: 20px; box-shadow: inset 0 0 0 1px var(--teal);
        font-weight: 600; font-size: 26px; line-height: 40px; letter-spacing: .2em; text-transform: uppercase; color: #fff; white-space: nowrap; }
      /* title row: destination title left, the ARRIVED pill right (shown on arrival only) */
      .gc-titlerow { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 10px; }
      .gc-title { font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-size: 100px; line-height: .95; letter-spacing: .02em;
        text-transform: uppercase; min-width: 0; }
      /* arrival pill: solid Vice teal (success state), ink type, 44 px tall */
      .gc-pill { flex: none; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 20px 0 16px; border-radius: 22px; margin-top: 4px;
        background: var(--teal); color: var(--ink); font-weight: 700; font-size: 26px; line-height: 1; letter-spacing: .2em; text-transform: uppercase;
        white-space: nowrap; opacity: 0; box-shadow: 0 1px 2px rgba(0,0,0,.25), 0 10px 24px -10px rgba(46,196,182,.55); }
      .gc-pill svg { width: 22px; height: 22px; overflow: visible; }
      .gc-pill span { margin-right: -.2em; }
      .gc-map { position: relative; margin-top: 28px; width: 784px; height: 500px; border-radius: 20px; overflow: hidden; background: #0C1430; }
      .gc-map .edge { position: absolute; inset: 0; border-radius: 20px; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.10), inset 0 0 50px rgba(0,0,0,.30); }
      /* equal columns aligned left / centre / right, so the last stat sits flush with the map's right edge
         and the columns never shift while the numbers count down */
      .gc-stats { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; margin-top: 30px; padding-top: 26px; border-top: 1px solid rgba(255,255,255,.14); }
      .gc-stat:not(:first-child):not(:last-child) { text-align: center; }
      .gc-stat:not(:first-child):not(:last-child) .k { padding-left: .3em; }   /* balance the trailing tracking */
      .gc-stat:last-child:not(:first-child) { text-align: right; }
      .gc-stat:last-child:not(:first-child) .k { margin-right: -.3em; }      /* tracked label flush with the value */
      .gc-stat .k { font-weight: 600; font-size: 26px; line-height: 32px; letter-spacing: .3em; text-transform: uppercase; color: rgba(255,255,255,.6); }
      .gc-stat .v { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 56px; line-height: 1; letter-spacing: .02em;
        margin-top: 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .gc-stat .v .u { opacity: .55; margin-left: 8px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1080" data-height="1920">
      <video id="plateA" class="clip plate" src="assets/plates/p10-police-car-v.mp4" muted playsinline data-start="0" data-duration="7" data-track-index="0"></video>
      <video id="plateB" class="clip plate" src="assets/plates/p07-convertible-v.mp4" muted playsinline data-start="0" data-duration="7" data-track-index="0"></video>

      <div id="ov" class="clip" data-start="0" data-duration="7" data-track-index="1">
        <!-- v0 -->
        <div class="mm" id="mm">
          <div class="mm-frame">
            <div class="mm-map">
              <svg id="mmSvg" width="820" height="520" viewBox="0 0 820 520" data-layout-allow-overflow>
                <defs id="mmDefs"></defs>
                <g id="mmWorld" data-layout-allow-overflow></g>
                <g mask="url(#mmHeadFade)"><g id="mmLines" data-layout-allow-overflow></g></g>
                <g id="mmTop" data-layout-allow-overflow></g>
              </svg>
            </div>
            <div class="mm-head">
              <span class="mm-area" id="mmArea"></span>
              <span class="mm-dist" id="mmDistWrap"><span id="mmDist"></span><span class="u" id="mmUnit"></span></span>
            </div>
            <div class="mm-edge"></div>
          </div>
          <div class="mm-north">N</div>
        </div>

        <!-- v1 -->
        <div class="gc" id="gc">
          <div class="gc-top">
            <div class="gc-label" id="gcLabel"></div>
            <div class="gc-tag" id="gcTag"></div>
          </div>
          <div class="gc-titlerow">
            <div class="gc-title" id="gcTitle"></div>
            <div class="gc-pill" id="gcPill"><svg viewBox="0 0 22 22"><path id="gcCheck" d="M 3 11.5 L 9 17 L 19 5" fill="none" stroke="#0B0B0E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="gcPillTxt"></span></div>
          </div>
          <div class="gc-map">
            <svg id="gcSvg" width="784" height="500" viewBox="0 0 784 500" data-layout-allow-overflow>
              <defs id="gcDefs"></defs>
              <g id="gcWorld" data-layout-allow-overflow></g>
            </svg>
            <div class="edge"></div>
          </div>
          <div class="gc-stats" id="gcStats"></div>
        </div>
      </div>
    </div>

    <script>
      const CONFIG = {
        variants: {
          // Corner minimap: the in-game look. The route draws, then the map pans under a fixed player arrow until it arrives.
          "0": {
            style: "corner",
            plate: "assets/plates/p10-police-car-v.mp4",
            area: "Vice City",          // zone name, top-left inside the blue panel
            distance: 1.2, unit: "MI",  // remaining distance at the start; counts down as the player drives
            arrived: "Arrived",         // slides in over the distance when the arrow reaches the blip (Vice teal, 44 px)
            // in: the panel rises (y +24 -> 0, scale .96 -> 1, 0.32 s expo.out; opacity on power2.out so it fades, not pops).
            // drawStart-drawEnd: the route draws from the arrow to the blip.
            // driveStart-arrive: the map pans under the fixed arrow (speed ramps up over `ramp` s, then holds: no crawl on the last 0.1 MI).
            // arrive: the arrow's nose touches the blip. The map stops and the arrow docks into the blip over `dock` s (power3.out),
            //   sliding under it; on the same frame the blip pops, one ring fires (scale 1 -> burstScale over burstDur)
            //   and a white highlight sweeps the finished route (doneSweep s).
            // settle: after the burst the map eases so the finished trip sits in the panel with the blip at x settleX.
            timing: { in: 0, blip: 0.12, drawStart: 0.2, drawEnd: 0.65, driveStart: 0.85, ramp: 0.4, arrive: 4.6, dock: 0.25,
                      burstDur: 0.5, burstScale: 2.4, doneSweep: 0.35,
                      settle: [5.0, 5.7], settleX: 560, pulses: [0.8, 2.0, 3.2, 5.75], out: 6.6, outDur: 0.35 }
          },
          // GPS card: destination title + map + trip stats.
          // HONESTY NOTE: DISTANCE / ETA / ARRIVE below are EXAMPLE numbers. Replace them with your own trip before posting.
          // tag: optional chip at the top right. "" hides it (default). "Route set" shows it with a 1 px Vice-teal ring.
          "1": {
            style: "card",
            plate: "assets/plates/p07-convertible-v.mp4",
            label: "GPS · from Vice City",
            tag: "",
            destination: "Leonida Keys",
            arrived: "Arrived",         // teal pill beside the title on arrival ("" = no pill)
            mapLabels: [["Vice City", 584, 248, "end"], ["Grassrivers", 182, 84, "middle"]],   // [text, x, y, anchor] on the 784x500 map
            stats: [
              { label: "Distance", value: 24.6, decimals: 1, unit: "MI", live: true },   // full value from the entrance; live: counts to 0 in step with the arrow, then dims to 62% on arrival
              { label: "ETA", value: 19, decimals: 0, unit: "MIN", live: true },
              { label: "Arrive", text: "6:42", unit: "PM" }                              // static; stays put on arrival (the pill carries ARRIVED)
            ],
            // the arrow drives the whole route from travelStart to arrive (speed ramps up over `ramp` s, then holds), touches the blip,
            // then docks into it over `dock` s (power3.out, under the blip). On the same frame the blip pops, one ring fires,
            // a white highlight sweeps the finished route (doneSweep s) and the ARRIVED pill pops in.
            timing: { in: 0, blip: 0.12, drawStart: 0.2, drawEnd: 0.9,
                      sweepStart: 1.0, sweepDur: 0.8, travelStart: 1.2, ramp: 0.4, arrive: 5.2, dock: 0.25,
                      burstDur: 0.5, burstScale: 2.4, doneSweep: 0.35, push: [1.1, 6.5, 1.06],
                      pulses: [0.2, 1.05, 2.4, 3.7, 5.75], out: 6.6, outDur: 0.35 }
          }
        },
        colors: {
          route: ["#F84FA4", "#FE8E4E", "#FEB747"],   // Leonida sunset core: the one accent
          blip: "#FEB747",
          arrived: "#2EC4B6"                           // Vice teal, success state only
        },
        end: 7.0
      };

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const vKey = CONFIG.variants[String(VARS.variant)] ? String(VARS.variant) : "0";
        const showPlate = VARS.bg !== "none";
        const V = CONFIG.variants[vKey], T = V.timing, C = CONFIG.colors;
        const $ = (s) => document.querySelector(s);
        const NS = "http://www.w3.org/2000/svg";
        const S = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

        document.querySelectorAll("video.plate").forEach((v) => {
          if (!showPlate || v.getAttribute("src") !== V.plate) v.style.display = "none";
        });
        $(V.style === "corner" ? "#gc" : "#mm").classList.add("hide");

        // ---- deterministic helpers ----
        const clamp01 = (x) => Math.max(0, Math.min(1, x));
        const p2io = (x) => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
        const sineIO = (x) => -(Math.cos(Math.PI * x) - 1) / 2;
        const expoOut = (x) => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
        const p2out = (x) => 1 - (1 - x) * (1 - x);
        const p3out = (x) => 1 - Math.pow(1 - x, 3);
        const backOut = (x) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
        const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
        const prog = (t, a, b) => clamp01((t - a) / (b - a));
        const f1 = (n) => n.toFixed(1);
        // drive ease: speed ramps up linearly over the first kd of the time, then holds constant into contact (no crawl, no dead start)
        const rampEase = (kd) => { const vd = 1 / (1 - kd / 2);
          return (x) => x <= 0 ? 0 : x >= 1 ? 1 : x < kd ? vd * x * x / (2 * kd) : vd * (kd / 2 + x - kd); };

        function gradient(defs, id, x1, y1, x2, y2) {
          const g = S("linearGradient", { id, gradientUnits: "userSpaceOnUse", x1, y1, x2, y2 }, defs);
          C.route.forEach((c, i) => S("stop", { offset: (i / (C.route.length - 1)).toFixed(2), "stop-color": c }, g));
        }
        // Catmull-Rom spline through points -> smooth SVG path (coastlines, islands)
        function smooth(pts, closed) {
          const n = pts.length, get = (i) => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
          let d = `M ${f1(pts[0][0])} ${f1(pts[0][1])}`;
          for (let i = 0; i < (closed ? n : n - 1); i++) {
            const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
            d += ` C ${f1(p1[0] + (p2[0] - p0[0]) / 6)} ${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)} ${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])} ${f1(p2[1])}`;
          }
          return closed ? d + " Z" : d;
        }
        const poly = (pts) => "M " + pts.map((p) => f1(p[0]) + " " + f1(p[1])).join(" L ") + " Z";
        const line = (pts) => "M " + pts.map((p) => f1(p[0]) + " " + f1(p[1])).join(" L ");
        // destination blip: pulse ring + arrival burst (unscaled, under the blip) + the blip itself (scales on pop / bump)
        function blip(parent, x, y, r) {
          const ring = S("circle", { cx: x, cy: y, r, fill: "none", stroke: C.blip, "stroke-width": 3, opacity: 0 }, parent);
          const burst = S("circle", { cx: x, cy: y, r: r + 10, fill: "none", stroke: C.blip, "stroke-width": 4, opacity: 0 }, parent);
          const g = S("g", { transform: `translate(${x} ${y}) scale(0)` }, parent);
          S("circle", { cx: 0, cy: 2, r: r + 2, fill: "rgba(0,0,0,.35)" }, g);
          S("circle", { cx: 0, cy: 0, r, fill: C.blip, stroke: "#fff", "stroke-width": 3.5 }, g);
          return { g, ring, burst, x, y, r };
        }
        function arrowShape(parent, k) {
          k = k || 1;
          return S("path", { d: `M0 ${-20 * k} L${15 * k} ${16 * k} L0 ${8 * k} L${-15 * k} ${16 * k} Z`, fill: "#fff", stroke: "rgba(6,10,28,.7)", "stroke-width": 2.5, "stroke-linejoin": "round" }, parent);
        }
        function routePaths(parent, d, grad, w) {
          const casing = S("path", { d, fill: "none", stroke: "rgba(8,12,34,.45)", "stroke-width": w + 6, "stroke-linecap": "round", "stroke-linejoin": "round" }, parent);
          const route = S("path", { d, fill: "none", stroke: `url(#${grad})`, "stroke-width": w, "stroke-linecap": "round", "stroke-linejoin": "round" }, parent);
          return { casing, route, L: route.getTotalLength() };
        }
        function setSeg(p, a, b, L) {
          const len = b - a;
          if (len < 0.5) { p.setAttribute("opacity", 0); return; }
          p.setAttribute("opacity", p.dataset.op || 1);
          p.setAttribute("stroke-dasharray", `${len.toFixed(2)} ${(L * 3).toFixed(0)}`);
          p.setAttribute("stroke-dashoffset", (-a).toFixed(2));
        }
        function heading(path, a, L) {
          const P1 = path.getPointAtLength(Math.max(0, Math.min(a, L - 3))), P2 = path.getPointAtLength(Math.min(L, Math.max(a, 0) + 3));
          return Math.atan2(P2.y - P1.y, P2.x - P1.x) * 180 / Math.PI + 90;
        }
        // pop: 1 -> peak in 0.08 s, then back to 1 on back.out(1.5) over 0.22 s (0.3 s total)
        function bumpScale(dt, peak) {
          if (dt < 0 || dt >= 0.3) return 1;
          if (dt < 0.08) return 1 + (peak - 1) * p2out(dt / 0.08);
          return peak + (1 - peak) * backOut((dt - 0.08) / 0.22);
        }
        // o: { beat, peak } pops the blip; { burstAt, burstDur, scale } fires one arrival ring at the blip
        // (radius r+10 scaled 1 -> scale, opacity .9 -> 0, cubic out)
        function drawBlip(B, t, o) {
          o = o || {};
          let k = t < T.blip ? 0 : backOut(clamp01((t - T.blip) / 0.3));
          if (o.beat !== undefined) k *= bumpScale(t - o.beat, o.peak || 1.35);
          B.g.setAttribute("transform", `translate(${B.x} ${B.y}) scale(${k.toFixed(3)})`);
          if (o.burstAt !== undefined && t >= o.burstAt && t < o.burstAt + o.burstDur) {
            const bp = (t - o.burstAt) / o.burstDur, e = p3out(bp);
            B.burst.setAttribute("r", ((B.r + 10) * (1 + ((o.scale || 2.4) - 1) * e)).toFixed(2));
            B.burst.setAttribute("stroke-width", (4 - 2.5 * e).toFixed(2));     // 4 -> 1.5
            B.burst.setAttribute("opacity", (0.9 * (1 - bp)).toFixed(3));       // .9 -> 0
          } else B.burst.setAttribute("opacity", 0);
          let ps = -1;
          for (const s of T.pulses) if (t >= s && t < s + 0.9) ps = s;
          if (ps < 0) { B.ring.setAttribute("opacity", 0); return; }
          const p = (t - ps) / 0.9;
          B.ring.setAttribute("r", (B.r + 26 * expoOut(p)).toFixed(2));          // r 14 -> 40
          B.ring.setAttribute("opacity", (0.9 * (1 - p)).toFixed(3));            // .9 -> 0
        }

        // =====================================================================
        // v0 — Corner minimap
        // Flat HUD blue like Rockstar's minimap; the GPS route is the only bright line.
        // World: mainland (west) with a marina cove and a headland, solid deep-blue bay (east) with two filled keys (no outline).
        // Roads: three major roads at white .28 / 5 px; a sparse minor grid at .08 / 3 px;
        // three block districts (2 px at .10) give the land texture without turning into graph paper.
        // Every stroke is clipped to the land, and all strokes fade out under the 80 px header (#mmHeadFade).
        // Layers (all share one pan transform): #mmWorld water fill / #mmLines strokes (masked) / #mmTop route, arrow, blip.
        // =====================================================================
        function buildCorner() {
          $("#mmArea").textContent = V.area;
          $("#mmUnit").textContent = V.unit;
          const defs = $("#mmDefs"), world = $("#mmWorld"), lines = $("#mmLines"), top = $("#mmTop");
          // header fade: strokes are invisible above y 56 and full from y 100, so nothing crosses the zone name or ARRIVED
          const hg = S("linearGradient", { id: "mmHeadGrad", gradientUnits: "userSpaceOnUse", x1: 0, y1: 0, x2: 0, y2: 520 }, defs);
          S("stop", { offset: (56 / 520).toFixed(4), "stop-color": "#000" }, hg);
          S("stop", { offset: (100 / 520).toFixed(4), "stop-color": "#fff" }, hg);

          S("line", { x1: 524, y1: -60, x2: 524, y2: 360, stroke: "rgba(255,255,255,.28)", "stroke-width": 5 }, cityIn);
          S("line", { x1: 400, y1: 64, x2: 760, y2: 64, stroke: "rgba(255,255,255,.28)", "stroke-width": 5 }, cityIn);
          const MAJ = { fill: "none", stroke: "rgba(255,255,255,.28)", "stroke-width": 5, "stroke-linecap": "round" };
          // expressway across Grassrivers: clipped to the mainland so it stops at the coast (no causeway stubs in the water)
          const roads = S("g", { "clip-path": "url(#gcLand)" }, world);
          S("path", { d: "M 728 146 L 470 146 C 380 148 300 168 200 176 C 120 182 40 184 -40 186", ...MAJ }, roads);

          // map labels: a land-coloured halo plus a mask that knocks the streets out behind them
          const mask = S("mask", { id: "gcLabelMask", maskUnits: "userSpaceOnUse", x: -100, y: -100, width: 1000, height: 700 }, defs);
          S("rect", { x: -100, y: -100, width: 1000, height: 700, fill: "#fff" }, mask);
          city.setAttribute("mask", "url(#gcLabelMask)");
          const labels = V.mapLabels.map(([txt, x, y, anchor]) => {
            const lab = S("text", { x, y, "text-anchor": anchor || "middle", fill: "rgba(255,255,255,.66)", stroke: LAND, "stroke-width": 4, "paint-order": "stroke",
              "stroke-linejoin": "round", "font-family": "Inter", "font-weight": 600, "font-size": 26, "letter-spacing": "7.8" }, world);
            lab.textContent = txt.toUpperCase();
            return lab;
          });

          const RD = "M 600 64 L 600 160 Q 600 196 614 226 L 626 256 Q 636 284 628 316 C 616 392 520 436 420 448 C 320 460 210 452 112 432";
          gradient(defs, "gcRouteGrad", 600, 64, 112, 432);
          S("path", { d: RD, fill: "none", stroke: "rgba(255,255,255,.34)", "stroke-width": 5, "stroke-linecap": "round", "stroke-linejoin": "round" }, world); // highway + bridges
          // trail: the part already driven stays as a muted sunset line (lifted on arrival), like v0
          const trailG = S("g", { opacity: 0.42 }, world);
          const trail = routePaths(trailG, RD, "gcRouteGrad", 10);
          const R = routePaths(world, RD, "gcRouteGrad", 10);
          const sweep = S("path", { d: RD, fill: "none", stroke: "#fff", "stroke-width": 10, "stroke-linecap": "round", opacity: 0 }, world);
          // the arrow sits UNDER the blip, so it can dock into it on arrival
          const ag = S("g", { transform: "translate(600 64) rotate(180)" }, world);
          arrowShape(ag);
          const B = blip(world, 112, 432, 14);
          const GAP = 34, LC = R.L - GAP;   // contact: the arrow's nose (20 px) touches the blip's outline
          // drive: speed ramps up over the first `ramp` s, then holds constant into contact (no dead start, no crawl)
          const driveEase = rampEase(T.ramp / (T.arrive - T.travelStart));

          const frame = function (t) {
            const dp = p2io(prog(t, T.drawStart, T.drawEnd));
            const tp = driveEase(prog(t, T.travelStart, T.arrive));
            const a = LC * tp, b = R.L * dp;
            // dock: from contact the arrow slides the last 34 px into the blip's centre (power3.out) and shrinks to .6, under the blip
            const dk = p3out(prog(t, T.arrive, T.arrive + T.dock));
            const ar = a + GAP * dk;
            setSeg(R.casing, ar, b, R.L); setSeg(R.route, ar, b, R.L);
            setSeg(trail.casing, 0, ar, R.L); setSeg(trail.route, 0, ar, R.L);
            trailG.setAttribute("opacity", (0.42 + 0.3 * p2out(prog(t, T.arrive, T.arrive + 0.3))).toFixed(3));
            const P = R.route.getPointAtLength(ar);
            ag.setAttribute("transform", `translate(${P.x.toFixed(2)} ${P.y.toFixed(2)}) rotate(${heading(R.route, ar, R.L).toFixed(2)}) scale(${(1 - 0.4 * dk).toFixed(3)})`);
            ag.setAttribute("opacity", t < T.arrive + T.dock ? 1 : 0);   // fully under the blip by then
            // highlight sweeps: one along the route ahead of the arrow before the drive, one along the finished route on arrival
            const sp = prog(t, T.sweepStart, T.sweepStart + T.sweepDur), sa = prog(t, T.arrive, T.arrive + T.doneSweep);
            if (sp > 0 && sp < 1) {
              const head = (R.L + 80) * p2io(sp), s0 = Math.max(a, head - 80), e = Math.min(R.L, head);
              setSeg(sweep, s0, e, R.L);
              if (e - s0 >= 0.5) sweep.setAttribute("opacity", (0.85 * Math.sin(Math.PI * sp)).toFixed(3));
            } else if (sa > 0 && sa < 1) {
              const head = (R.L + 80) * sineIO(sa);
              setSeg(sweep, Math.max(0, head - 80), Math.min(R.L, head), R.L);
              if (Math.min(R.L, head) - Math.max(0, head - 80) >= 0.5) sweep.setAttribute("opacity", 0.6);
            } else sweep.setAttribute("opacity", 0);
            const k = 1 + (T.push[2] - 1) * sineIO(prog(t, T.push[0], T.push[1]));
            world.setAttribute("transform", `translate(392 250) scale(${k.toFixed(4)}) translate(-392 -250)`);
            // arrival: the blip pops 1 -> 1.25 -> 1 and one ring fires (scale 1 -> 2.4, opacity .9 -> 0, 0.5 s)
            drawBlip(B, t, { beat: T.arrive, peak: 1.25, burstAt: T.arrive, burstDur: T.burstDur, scale: T.burstScale });
            // arrival: the ARRIVED pill pops in beside the title (scale .86 -> 1, back.out 1.5, 0.3 s) and its check draws
            const pa = prog(t, T.arrive, T.arrive + 0.3);
            pill.style.opacity = p2out(prog(t, T.arrive, T.arrive + 0.12)).toFixed(3);
            pill.style.transform = `scale(${(0.86 + 0.14 * (pa > 0 ? backOut(pa) : 0)).toFixed(4)})`;
            check.setAttribute("stroke-dashoffset", (CHK * (1 - p3out(prog(t, T.arrive + 0.08, T.arrive + 0.33)))).toFixed(2));
            // live numbers count down in step with the arrow's real path progress, reaching 0 at contact, then step back to 62%
            // (values stay at white .62, so they read as finished, not disabled)
            const dim = 1 - 0.38 * p2out(prog(t, T.arrive + 0.1, T.arrive + 0.4));
            vals.forEach((o) => {
              if (o.s.text !== undefined) return;   // static (ARRIVE 6:42 PM) stays as it is
              // rounded UP, so nothing reads 0 until the arrow actually touches the blip
              const left = o.s.live ? 1 - tp : 1, q = Math.pow(10, o.s.decimals);
              const txt = (Math.ceil(o.s.value * left * q - 1e-6) / q).toFixed(o.s.decimals);
              if (o.n.textContent !== txt) o.n.textContent = txt;
              if (o.s.live) o.col.style.opacity = dim.toFixed(3);
            });
          };
          // once fonts are in, cut the label boxes out of the street layer
          frame.finalize = function () {
            labels.forEach((lab) => {
              const bb = lab.getBBox();
              S("rect", { x: (bb.x - 12).toFixed(1), y: (bb.y - 6).toFixed(1), width: (bb.width + 24).toFixed(1), height: (bb.height + 12).toFixed(1), rx: 8, fill: "#000" }, mask);
            });
          };
          return frame;
        }

        const frame = V.style === "corner" ? buildCorner() : buildCard();
        frame(0);

        document.fonts.ready.then(() => {
          if (frame.finalize) frame.finalize();
          const tl = gsap.timeline({ paused: true });
          const box = V.style === "corner" ? "#mm" : "#gc";
          // entrance from t = 0: rise y +24 -> 0 and scale .96 -> 1 over 0.32 s expo.out. Opacity runs on power2.out over the same
          // 0.32 s, so the panel fades in over ~7 frames instead of reaching 90% in 2 (no pop)
          tl.fromTo(box, { y: 24, scale: 0.96 }, { y: 0, scale: 1, duration: 0.32, ease: "expo.out", immediateRender: true }, T.in);
          tl.fromTo(box, { opacity: 0 }, { opacity: 1, duration: 0.32, ease: "power2.out", immediateRender: true }, T.in);
          KitMotion.drive(tl, 0, CONFIG.end, (p) => frame(p * CONFIG.end));
          tl.to(box, { opacity: 0, duration: T.outDur, ease: "power2.in" }, T.out);
          tl.set({}, {}, CONFIG.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  </body>
</html>
