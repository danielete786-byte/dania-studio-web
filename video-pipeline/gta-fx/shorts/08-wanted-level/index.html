<!-- GTA 6 component #8 "Wanted level" (GTA HUD kit), craft v2. 1080x1920 (9:16), 30 fps, 6.1 s.
     Five slim wanted stars light one by one (1→5), each on a cut of an escalating police edit; the fifth lands on the frame the
     police SUV's nose lifts off the road, and the whole flip then plays at full speed (real 30 fps, no slow-mo, no repeated frames)
     under the maxed row, on a 1.08 push. The hit takes an exposure flash, an RGB split, a row-wide lens streak and hard red/blue
     police light; the stars stay white and carry the police colour only in their bloom.
     Variables: variant "0" HUD corner (diegetic: the game HUD top-right over full-frame footage)
                        "1" Centre hero (full-bleed: one lockup up top — label, white level title, star row, reason badges);
                bg "plate" (sample footage + finishing layer) / "none" (transparent overlay).
     Safe zones: everything sits inside x 72–936, y 230–1480. -->
<html lang="en" data-composition-variables='[
  {"id":"variant","type":"enum","label":"Variant","default":"0","options":[{"value":"0","label":"HUD corner"},{"value":"1","label":"Centre hero"}]},
  {"id":"bg","type":"enum","label":"Background","default":"plate","options":[{"value":"plate","label":"Sample footage"},{"value":"none","label":"Transparent"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; color: #fff;
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }

      /* ---------- footage: full-bleed vertical cuts (both variants) ---------- */
      #stage { position: absolute; inset: 0; overflow: hidden; }
      #shake, #push { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #a0 { transform-origin: 50% 0; transform: scale(1.1); }     /* keeps the black car roof behind the empty slots */
      .v0 #c0 { transform: translateY(170px) scale(1.2); }        /* drops Lucia's eyes below the HUD badges */
      /* v1: the lockup fills y 262–818, so every shot is reframed to keep faces and the subject under it */
      .v1 #a1 { transform-origin: 50% 0; transform: scale(1.18); }
      .v1 #b1 { transform-origin: 50% 0; transform: scale(1.26); }
      #d0, #d1 { filter: contrast(1.14) saturate(1.12) brightness(.95); }  /* s119 is lifted grey daylight: grade it */
      /* overlay blend: highlights blow out to white while blacks stay black, so the hit reads as exposure, not haze */
      #hit { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 5; mix-blend-mode: overlay; }
      #ov { position: absolute; inset: 0; z-index: 10; }
      #hud { position: absolute; inset: 0; }

      /* ---------- the star (shared, our own drawing) ----------
         lit: a solid fill with a 2 px dark keyline outside (as in the GTA VI HUD), faint facets and a cool shade toward the
         bottom, a 1 px lit top edge, and a white bloom. Unlit: a thin 2 px white outline at 45% on a hairline dark edge. */
      .row { position: absolute; display: flex; }
      .s { position: relative; flex: none; }
      .s .in { position: absolute; inset: 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,.42)); }
      .s svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .s .slot .kl { fill: rgba(10,10,16,.12); stroke: rgba(10,10,16,.34); stroke-width: 5.6; stroke-linejoin: miter; }
      .s .slot .ol { fill: none; stroke: rgba(255,255,255,.45); stroke-width: 1.9; stroke-linejoin: miter; }
      /* HUD corner: the game's dim empty star, a .25 white body under a dark rim, so it reads on the bright s096 plate too */
      .v0 .s .slot .kl { fill: rgba(255,255,255,.25); stroke: rgba(10,10,16,.5); stroke-width: 4.4; }
      .v0 .s .slot .ol { stroke: rgba(255,255,255,.36); stroke-width: 1.3; }
      .s .core { position: absolute; inset: 0; opacity: 0; }
      .s .core .kl { fill: none; stroke: rgba(10,10,16,.55); stroke-width: 4; stroke-linejoin: miter; }
      .s .core .fl { fill: #fff; stroke: none; }
      .s .core .sh { fill: url(#wlShade); }
      .s .core .fx { fill: rgba(16,24,48,.045); }
      .s .core .hl { fill: none; stroke: url(#wlLit); stroke-width: 2.2; stroke-linejoin: miter; clip-path: url(#wlClip); }
      /* ignite light: a round flare and a thin anamorphic streak, both screen-blended */
      .flare { position: absolute; left: 50%; top: 52%; width: 240px; height: 240px; margin: -120px 0 0 -120px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,.35) 32%, rgba(255,255,255,0) 100%);
        mix-blend-mode: screen; opacity: 0; pointer-events: none; }
      .streak { position: absolute; left: 50%; top: 52%; width: 700px; height: 44px; margin: -22px 0 0 -350px; opacity: 0; pointer-events: none;
        mix-blend-mode: screen; }
      .streak::before { content: ""; position: absolute; left: 0; right: 0; top: 20px; height: 4px; border-radius: 2px;
        background: linear-gradient(90deg, rgba(190,215,255,0), rgba(220,235,255,.95) 38%, #fff 50%, rgba(220,235,255,.95) 62%, rgba(190,215,255,0)); }
      .streak::after { content: ""; position: absolute; left: 12%; right: 12%; top: 0; bottom: 0; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(200,225,255,.42), rgba(200,225,255,0)); }
      /* the payoff streak: one lens flare across the whole row on the fifth star */
      #rowStreak { position: absolute; left: 50%; top: 53%; width: 1500px; height: 70px; margin: -35px 0 0 -750px; opacity: 0;
        pointer-events: none; mix-blend-mode: screen; }
      #rowStreak::before { content: ""; position: absolute; left: 0; right: 0; top: 33px; height: 4px; border-radius: 2px;
        background: linear-gradient(90deg, rgba(120,160,255,0), rgba(150,185,255,.7) 22%, #fff 50%, rgba(255,150,150,.7) 78%, rgba(255,120,120,0)); }
      #rowStreak::after { content: ""; position: absolute; left: 18%; right: 18%; top: 0; bottom: 0; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(225,235,255,.5), rgba(225,235,255,0)); }

      /* reason badges (shared): flat oxblood discs with a 2 px dark rim, as in the GTA VI HUD (no gradient, no shadow),
         carrying our own 2.5 px stroke glyphs */
      #badges { position: absolute; display: flex; }
      .ic { flex: none; border-radius: 50%; display: grid; place-items: center; opacity: 0;
        background: #8E1620; border: 2px solid #3A0A0E; }
      .ic svg { overflow: visible; }
      .ic svg * { fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .ic svg .dot { fill: #fff; stroke: none; }

      /* police light: hard alternating red and blue washes from the top corners, screen-blended */
      #strobe { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; }
      #strobe i { position: absolute; display: block; width: 1500px; height: 1300px; top: -560px; border-radius: 50%; opacity: 0; }
      #strobe .red { left: -820px; background: radial-gradient(closest-side, rgba(255,59,59,.9), rgba(255,59,59,.32) 45%, rgba(255,59,59,0)); }
      #strobe .blue { right: -820px; background: radial-gradient(closest-side, rgba(59,130,255,.92), rgba(59,130,255,.34) 45%, rgba(59,130,255,0)); }

      /* ---------- variant 0: HUD corner (the game HUD, phone-sized) ---------- */
      #hudScrim { position: absolute; inset: 0; opacity: 0;
        background: radial-gradient(ellipse 860px 520px at 586px 340px, rgba(5,5,9,.56) 0%, rgba(5,5,9,.4) 28%, rgba(5,5,9,.17) 58%, rgba(5,5,9,.05) 80%, rgba(5,5,9,0) 100%); }
      .v0 #row { right: 150px; top: 252px; gap: 42px; }              /* 104 px stars on a 0.4× gap: x 242–930, centres 294 … 878 */
      .v0 .s { width: 104px; height: 104px; }
      .v0 #badges { right: 170px; top: 384px; gap: 82px; flex-direction: row-reverse; }   /* 64 px discs centred under the stars */
      .v0 .ic { width: 64px; height: 64px; }
      .v0 .ic svg { width: 32px; height: 32px; }

      /* ---------- variant 1: Centre hero (one lockup up top: label, title, stars, badges) ---------- */
      .scrim { position: absolute; left: 0; right: 0; opacity: 0; }
      #scrimT { top: 0; height: 1200px; }
      #label { position: absolute; left: 0; right: 0; top: 262px; text-align: center; color: rgba(255,255,255,.86);
        text-indent: .3em; font-size: 26px; }
      #label .lbl { display: inline-block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)) drop-shadow(0 4px 14px rgba(0,0,0,.4)); }
      #names { position: absolute; left: 0; right: 0; top: 306px; height: 250px; }
      .nm { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; align-items: center; }
      .nm .ln { display: block; width: max-content; font-size: 132px; font-stretch: 112%; line-height: .94; letter-spacing: .005em; white-space: nowrap;
        filter: drop-shadow(0 2px 2px rgba(0,0,0,.32)) drop-shadow(0 8px 26px rgba(0,0,0,.42)); }
      .v1 #row { left: 0; right: 0; top: 610px; justify-content: center; gap: 44px; }      /* 56 px under the title; 112 px stars, x 172–908 */
      .v1 .s { width: 112px; height: 112px; }
      .v1 #badges { left: 0; right: 0; top: 746px; justify-content: center; gap: 84px; }   /* 72 px discs on the 156 px star pitch, y 746–818 */
      .v1 .ic { width: 72px; height: 72px; }
      .v1 .ic svg { width: 36px; height: 36px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.1" data-width="1080" data-height="1920">
      <!-- Sample footage (official trailer shots, local preview only), full-bleed vertical. set0 = HUD corner, set1 = Centre hero.
           Both end on s119 at 1×, one unbroken shot to the last frame (no slow-mo, so every frame is a real, unique source frame):
           v0 d0 from source frame 29 (the gunman firing on the charging SUV), v1 d1 from frame 4. Both reach frame 68 (the SUV's nose
           lifting off the road in smoke) on the hit at 4.50; the roll, the upside-down apex (frame 94, ≈5.37 s) and the tumble out of
           frame (≈5.7 s) all play under the maxed row. -->
      <div id="stage"><div id="shake"><div id="push">
        <video id="a0" class="clip shot set0" src="assets/shots/s014-driveby-police-v.mp4" muted playsinline data-start="0" data-duration="1.3" data-media-start="1.1" data-track-index="0"></video>
        <video id="b0" class="clip shot set0" src="assets/shots/s096-police-street-v.mp4" muted playsinline data-start="1.3" data-duration="1.05" data-media-start="0.6" data-track-index="0"></video>
        <video id="c0" class="clip shot set0" src="assets/shots/s113-lucia-firing-v.mp4" muted playsinline data-start="2.35" data-duration="0.85" data-media-start="0" data-track-index="0"></video>
        <video id="a1" class="clip shot set1" src="assets/shots/s096-police-street-v.mp4" muted playsinline data-start="0" data-duration="1.3" data-media-start="0.47" data-track-index="1"></video>
        <video id="b1" class="clip shot set1" src="assets/shots/s014-driveby-police-v.mp4" muted playsinline data-start="1.3" data-duration="1.05" data-media-start="1.0" data-track-index="1"></video>
        <video id="d0" class="clip shot set0" src="assets/shots/s119-gameplay-shootout-v.mp4" muted playsinline data-start="3.2" data-duration="2.9" data-media-start="0.98" data-track-index="2"></video>
        <video id="d1" class="clip shot set1" src="assets/shots/s119-gameplay-shootout-v.mp4" muted playsinline data-start="2.35" data-duration="3.75" data-media-start="0.13" data-track-index="1"></video>
      </div></div><div id="hit"></div></div>

      <div id="ov" class="clip" data-start="0" data-duration="6.1" data-track-index="3">
        <!-- shared star paint: shade, lit top edge and the clip that keeps the lit edge inside the star -->
        <svg id="defs" width="0" height="0" style="position:absolute" aria-hidden="true">
          <defs>
            <linearGradient id="wlShade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#101830" stop-opacity="0" />
              <stop offset=".45" stop-color="#101830" stop-opacity="0" />
              <stop offset="1" stop-color="#101830" stop-opacity=".13" />
            </linearGradient>
            <linearGradient id="wlLit" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff" stop-opacity=".6" />
              <stop offset=".42" stop-color="#fff" stop-opacity=".6" />
              <stop offset=".62" stop-color="#fff" stop-opacity="0" />
            </linearGradient>
            <clipPath id="wlClip" clipPathUnits="userSpaceOnUse"><path id="wlClipPath" /></clipPath>
          </defs>
        </svg>
        <!-- v1 scrim (part of the graphic: it stays, softer, on a transparent overlay) -->
        <div id="scrimT" class="scrim lk-scrim-top"></div>
        <!-- v0 -->
        <div id="hudScrim"></div>
        <div id="strobe"><i class="red" data-layout-allow-overflow></i><i class="blue" data-layout-allow-overflow></i></div>
        <div id="hud"><div class="row" id="row"></div><div id="badges"></div></div>
        <!-- v1 -->
        <div id="label" class="t-label-wide"></div>
        <div id="names"></div>
      </div>
    </div>

    <script>
      const CONFIG = {
        // Seconds at which each star lights (1→5). Each one sits on a cut; the fifth sits on the in-shot hit
        // (s119 frame 68: the police SUV's nose lifts off the road), and the flip then plays at full speed under the maxed row.
        stars: [0.40, 1.30, 2.35, 3.20, 4.50],
        // One dark-red reason badge joins under each new star. Glyphs: witness, call, shots, vehicle, heli.
        reasons: ["witness", "call", "shots", "vehicle", "heli"],
        // police light after the fifth star: hard red/blue alternation in `stepFrames` (4 frames ≈ 0.13 s) steps, `first` on the hit.
        // `shape` is a step's per-frame intensity. It drives the top-corner washes (footage renders only) AND the stars' bloom
        // colour (both renders): the star fills stay white, only their light turns red or blue. Runs `from`–`to`, then fades.
        strobe: { from: 4.50, to: 5.50, fade: 0.30, stepFrames: 4, shape: [1, 0.94, 0.78, 0.48], first: "red" },
        // the lit stars' bloom (Look.bloom recipe as SVG drop-shadows): white at `rest`; police-coloured at `police` while the
        // strobe runs; both spike ×`spike` on the hit and settle over 0.9 s.
        starLight: { rest: 0.5, police: 0.6, spike: 1.6 },
        variants: {
          // HUD corner: the game HUD, phone-sized, top right. Stars light from the right (as in the game); stars 1–4 do the
          // game's double blink. Exit: the stars un-fill right to left (`unfill`), each badge drops with its star, then the
          // empty row blurs up and out (`exit`).
          "0": { strobePeak: { red: 0.95, blue: 0.95 },
                 unfill: { at: 5.50, stagger: 0.04, dur: 0.1 },
                 exit: { at: 5.68, dur: 0.3, blur: 6, y: -12, stagger: 0.012 },
                 // the hit: a 2-frame hot-white exposure (overlay-blended white + a brightness kick on the shot).
                 // grade = the shot's own grade (keep in sync with the #d0, #d1 CSS rule)
                 hit: { shot: "#d0", flash: 0.6, exposure: 2.2, grade: "contrast(1.14) saturate(1.12) brightness(.95)" },
                 // sample cut list (edit the matching <video class="set0"> tags): police lights → patrol car → Lucia firing → s119 at 1×
                 shots: ["s014-driveby-police-v", "s096-police-street-v", "s113-lucia-firing-v", "s119-gameplay-shootout-v"] },
          // Centre hero: full-bleed. One lockup up top: label, white level title, the star row 56 px under it, badges under that.
          "1": { label: "Wanted level",
                 names: [["Suspect", "spotted"], ["Shots", "fired"], ["Most", "wanted"]],
                 titleAt: [0, 2, 4],               // the star (index) each title lands on; each title holds ≥ 1.4 s
                 titleMax: 780,                    // widest title line in px (the size steps down from 132 px if a line is wider)
                 // the last title starts rising `slamLead` s before the hit, so it is up on the flash frame with star 5
                 slamLead: 0.16,
                 // on five stars WANTED takes a 3 px offset ghost in the strobe colour for the first 2 frames of each step, for `dur` s
                 ghost: { px: 3, frames: 2, dur: 0.6 },
                 strobePeak: { red: 0.8, blue: 0.8 },
                 hit: { shot: "#d1", flash: 0.6, exposure: 2.2, grade: "contrast(1.14) saturate(1.12) brightness(.95)" },
                 // sample cut list (<video class="set1">): patrol car → police lights → s119 at 1× from the gunman opening fire on
                 // the charging SUV, unbroken to the end (star 4 lands on the muzzle flash, star 5 on the lift)
                 shots: ["s096-police-street-v", "s014-driveby-police-v", "s119-gameplay-shootout-v"] }
        },
        newStarBlink: 0.1,                     // HUD corner: stars 1–4 blink on/off/on/off/on in 0.1 s (3-frame) steps
        payoff: { amp: 12, zoom: 1.045, chromaPx: 12 },   // fifth-star shake (px), punch zoom and RGB split; the flash is variants[*].hit
        // per-shot push-in (footage only): [start, duration, fromScale, toScale]. From the hit, s119 pushes on to 1.08 toward the
        // flip (origin `pushOrigin`), continuing the 1× shot's own push with no jump.
        pushes: { "0": [[0, 1.3, 1, 1.035], [1.3, 1.05, 1, 1.035], [2.35, 0.85, 1, 1.03], [3.2, 1.3, 1, 1.025], [4.5, 1.6, 1.025, 1.08]],
                  "1": [[0, 1.3, 1, 1.04], [1.3, 1.05, 1, 1.04], [2.35, 2.15, 1, 1.03], [4.5, 1.6, 1.03, 1.08]] },
        pushOrigin: "42% 34%",
        timing: { out: 5.58, outDur: 0.42, end: 6.1 }   // Centre hero exit; the HUD corner uses variants["0"].unfill / exit
      };

      (function () {
        const VARS = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const vKey = CONFIG.variants[String(VARS.variant)] ? String(VARS.variant) : "0";
        const plate = VARS.bg !== "none";
        const V = CONFIG.variants[vKey], T = CONFIG.timing, S = CONFIG.stars, P = CONFIG.payoff;
        const hero = vKey === "1";
        const $ = (s) => document.querySelector(s);
        const root = $("#root");
        root.classList.add("v" + vKey);
        if (plate) root.classList.add("plate");
        document.querySelectorAll("video.shot").forEach((v) => {
          if (!plate || !v.classList.contains("set" + vKey)) v.style.display = "none";
        });
        const hide = (sel) => document.querySelectorAll(sel).forEach((n) => (n.style.display = "none"));
        if (hero) hide("#hudScrim"); else hide(".scrim, #label, #names");
        if (!plate) hide("#strobe, #hit");

        // ---- our own slim five-point star (viewBox 100), optically centred, inner radius 0.40 ----
        const CX = 50, CY = 54.4, R = 46, RI = R * 0.40;
        const pt = (i, r) => { const a = -Math.PI / 2 + i * Math.PI / 5; return [CX + r * Math.cos(a), CY + r * Math.sin(a)]; };
        const f2 = (p) => p[0].toFixed(2) + " " + p[1].toFixed(2);
        const D = "M" + Array.from({ length: 10 }, (_, i) => f2(pt(i, i % 2 ? RI : R))).join("L") + "Z";
        // facets: the clockwise half of each point is shaded a touch, so the star reads as a bevelled object, not a glyph
        const FX = Array.from({ length: 5 }, (_, k) => "M" + CX + " " + CY + "L" + f2(pt(2 * k, R)) + "L" + f2(pt(2 * k + 1, RI)) + "Z").join("");
        $("#wlClipPath").setAttribute("d", D);
        const row = $("#row"), slots = [];
        for (let i = 0; i < 5; i++) {
          const s = document.createElement("div");
          s.className = "s";
          s.innerHTML = '<div class="in"><svg class="slot" viewBox="0 0 100 100"><path class="kl" d="' + D + '"/><path class="ol" d="' + D + '"/></svg>' +
            '<div class="core"><svg viewBox="0 0 100 100"><path class="kl" d="' + D + '"/><path class="fl" d="' + D + '"/>' +
            '<path class="sh" d="' + D + '"/><path class="fx" d="' + FX + '"/><path class="hl" d="' + D + '"/></svg></div></div>' +
            '<div class="flare"></div><div class="streak"></div>';
          row.appendChild(s); slots.push(s);
        }
        const rowStreak = document.createElement("div"); rowStreak.id = "rowStreak"; row.appendChild(rowStreak);
        // fill order: the HUD corner lights from the right (lit stars right-aligned, ghosts left, as in the game HUD);
        // the centre hero reads left to right.
        const stars = hero ? slots : slots.slice().reverse();
        const cores = stars.map((s) => s.querySelector(".core"));
        const flares = stars.map((s) => s.querySelector(".flare"));
        const streaks = stars.map((s) => s.querySelector(".streak"));

        // ---- reason badges: our own 2.5 px stroke glyphs on a 32-unit (8 px) grid ----
        const GLYPH = {
          witness: '<path d="M3 16C6.6 10.4 10.9 7.5 16 7.5S25.4 10.4 29 16C25.4 21.6 21.1 24.5 16 24.5S6.6 21.6 3 16Z"/><circle cx="16" cy="16" r="4.5"/><circle class="dot" cx="16" cy="16" r="1.4"/>',
          call: '<path d="M7.5 5H11.5L14 11L11 13.5C12.6 16.9 15.1 19.4 18.5 21L21 18L27 20.5V24.5C27 26.5 25.4 28 23.4 28C13.3 27.5 4.5 18.7 4 8.6C4 6.6 5.5 5 7.5 5Z"/>' +
                '<path d="M19 4.5A8.5 8.5 0 0 1 27.5 13"/><path d="M19 9A4 4 0 0 1 23 13"/>',
          shots: '<circle cx="16" cy="16" r="9"/><path d="M16 3V9M16 23V29M3 16H9M23 16H29"/><circle class="dot" cx="16" cy="16" r="1.6"/>',
          vehicle: '<path d="M13 4.5H19"/><path d="M8.5 16L10.6 9.6C10.9 8.6 11.8 8 12.8 8H19.2C20.2 8 21.1 8.6 21.4 9.6L23.5 16"/>' +
                   '<path d="M5 23.5V19C5 17.3 6.3 16 8 16H24C25.7 16 27 17.3 27 19V23.5Z"/><path d="M8.5 23.5V27M23.5 23.5V27"/>' +
                   '<circle class="dot" cx="9.6" cy="19.8" r="1.4"/><circle class="dot" cx="22.4" cy="19.8" r="1.4"/>',
          heli: '<path d="M4 5.5H24M14 5.5V9.5"/><path d="M5.5 15.5C5.5 12.2 8.2 9.5 11.5 9.5H16C19.3 9.5 22 12.2 22 15.5C22 18.3 19.8 20 17 20H10C7.5 20 5.5 18 5.5 15.5Z"/>' +
                '<path d="M22 14H28.5M28.5 10.5V16.5"/><path d="M10.5 20V24.5M17 20V24.5M7.5 24.5H21"/>'
        };
        const badges = CONFIG.reasons.map((k) => {
          const d = document.createElement("div");
          d.className = "ic";
          d.innerHTML = '<svg viewBox="0 0 32 32">' + (GLYPH[k] || GLYPH.witness) + "</svg>";
          $("#badges").appendChild(d);
          return d;
        });

        // ---- v1 level titles: two lines of wide white type each, one per titleAt star ----
        const nameEls = [];
        if (hero) {
          $("#label").innerHTML = '<span class="lbl"></span>'; $("#label .lbl").textContent = V.label;
          V.names.forEach((pair) => {
            const d = document.createElement("div");
            d.className = "nm";
            pair.forEach((txt) => { const l = document.createElement("div"); l.className = "ln t-wide"; l.textContent = txt; d.appendChild(l); });
            $("#names").appendChild(d); nameEls.push(d);
          });
        }
        const last = nameEls.length - 1;

        // ---- star light as a pure function of time (seek-safe) ----
        const NB = CONFIG.newStarBlink, EPS = 1e-4;
        const UF = V.unfill;
        function lit(i, time) {
          const dt = time - S[i];
          if (dt < 0) return 0;
          if (!hero && i < 4 && dt < 4 * NB) return Math.floor(dt / NB + EPS) % 2 === 0 ? 1 : 0;   // game double blink
          if (UF) { const u = time - (UF.at + i * UF.stagger); if (u >= 0) return Math.max(0, 1 - u / UF.dur); }   // un-fill, star 1 first
          return 1;
        }
        const rgbOf = (h) => { const n = parseInt(h.replace("#", ""), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
        // bloom on the lit cores: Look.bloom's recipe (strength s) written as drop-shadows for SVG
        const glow = (rgb, s) => "drop-shadow(0 0 1.5px rgba(" + rgb + "," + Math.min(1, 0.7 * s).toFixed(3) + ")) " +
          "drop-shadow(0 0 14px rgba(" + rgb + "," + Math.min(1, 0.84 * s).toFixed(3) + ")) " +
          "drop-shadow(0 0 42px rgba(" + rgb + "," + Math.min(1, 0.5 * s).toFixed(3) + "))";

        document.fonts.ready.then(() => {
          // v1: fit the title size (132 px) so the widest line stays inside titleMax
          if (hero) {
            const lines = Array.from(document.querySelectorAll(".nm .ln"));
            const widest = Math.max.apply(null, lines.map((l) => l.getBoundingClientRect().width));
            if (widest > V.titleMax) lines.forEach((l) => (l.style.fontSize = (132 * V.titleMax / widest).toFixed(1) + "px"));
          }

          const tl = gsap.timeline({ paused: true });
          const at = (target, from, to, t) => tl.fromTo(target, from, Object.assign({ immediateRender: false }, to), t);
          const onFrame = (t) => Math.ceil(t * 30 - 1e-3) / 30;
          const t5 = onFrame(S[4]);
          const tH = t5 - 1 / 60;   // half a frame early: an effect starting exactly on t5 first shows one frame late

          // footage: a gentle push on every shot (each cut resets it); from the hit, s119 pushes on to 1.08 toward the flip
          if (plate) {
            gsap.set("#push", { scale: 1, transformOrigin: CONFIG.pushOrigin });
            CONFIG.pushes[vKey].forEach((p) => at("#push", { scale: p[2] }, { scale: p[3], duration: p[1], ease: "none" }, p[0]));
          }

          // ---- entrance: five thin empty slots arrive in fill order (blur + scale), so "five stars, none lit" reads at once ----
          stars.forEach((s, i) => Look.enter(tl, s, 0.02 + i * 0.04, { from: "blur", scale: hero ? 1.18 : 1.12, blur: 10, dur: 0.5 }));
          const scrimMax = plate ? 1 : 0.5;   // softer on a transparent overlay, where the creator's own clip is unknown
          if (!hero) at("#hudScrim", { opacity: 0 }, { opacity: scrimMax, duration: 0.5, ease: "power2.out" }, 0);
          if (hero) {
            at("#scrimT", { opacity: 0 }, { opacity: 0.66 * scrimMax, duration: 0.5, ease: "power2.out" }, 0);
            Look.enter(tl, "#label", 0.06, { from: "blur", blur: 10, dur: 0.6 });
          }

          // ---- each star: ignite (scale + flare + streak) and a reason badge; star 5 hits harder (bigger, overshoots) ----
          gsap.set(flares, { opacity: 0, scale: 0.4 });
          gsap.set(streaks, { opacity: 0, scaleX: 0.15 });
          S.forEach((t0, i) => {
            const t = onFrame(t0), big = i === 4;
            const s0 = big ? (hero ? 1.75 : 1.6) : (hero ? 1.35 : 1.2);   // star 5 ignites much bigger than stars 1–4
            gsap.set(cores[i], { scale: s0 });
            at(cores[i], { scale: s0 }, { scale: 1, duration: big ? 0.45 : 0.32, ease: "expo.out" }, t);
            at(flares[i], { opacity: big ? 1 : 0.8, scale: 0.4 }, { opacity: 0, scale: big ? 2.4 : 1.4, duration: big ? 0.75 : 0.45, ease: "power2.out" }, t);
            if (!big) at(streaks[i], { opacity: 1, scaleX: 0.15 }, { opacity: 0, scaleX: 1, duration: 0.5, ease: "power3.out" }, t);
            gsap.set(badges[i], { opacity: 0, scale: 0.6, filter: "blur(8px)" });
            at(badges[i], { opacity: 0, scale: 0.6, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, t + 0.1);
            tl.set(badges[i], { filter: "none" }, t + 0.5);
          });

          // v1 level titles (three): each rolls in through a mask on its star; the old one rises out just before.
          // The last (MOST WANTED) starts `slamLead` early with a fast, tight roll, so it is up on the flash frame with star 5.
          if (hero) {
            const tIn = (i) => i === last && V.titleAt[i] === 4 ? tH - V.slamLead : onFrame(S[V.titleAt[i]]);
            nameEls.forEach((nm, i) => {
              const fin = i === last;
              Array.from(nm.children).forEach((ln, j) => Look.reveal(tl, ln, tIn(i) + j * (fin ? 0.02 : 0.06),
                { by: "chars", stagger: fin ? 0.012 : 0.018, dur: fin ? 0.32 : 0.5 }));
            });
            nameEls.forEach((nm, i) => {
              const chars = nm.querySelectorAll(".lk-c");
              const tOut = i < last ? tIn(i + 1) - 0.13 : T.out;   // overlaps the next roll by a frame: never an empty slot
              at(chars, { yPercent: 0 }, { yPercent: -118, duration: i < last ? 0.15 : 0.32, ease: "power2.in", stagger: i < last ? 0.003 : 0.008 }, tOut);
            });
          }

          // star light + blink, driven per frame
          Look.drive(tl, 0, T.end, (p) => {
            const time = p * T.end + EPS;
            for (let i = 0; i < 5; i++) cores[i].style.opacity = lit(i, time);
          });

          // ---- the payoff: fifth star on the lift (s119 frame 68), the flip then plays at 1× ----
          // one lens streak across the whole row
          gsap.set(rowStreak, { opacity: 0, scaleX: 0.2 });
          at(rowStreak, { opacity: 1, scaleX: 0.2 }, { opacity: 0, scaleX: 1, duration: 0.9, ease: "power3.out" }, tH);
          Look.chroma(tl, hero ? "#names" : "#hud", tH, 0.42, { px: P.chromaPx });
          if (hero) Look.chroma(tl, "#row", tH, 0.42, { px: P.chromaPx });
          if (plate) {
            // the hit, frame-exact: a 2-frame hot-white exposure (overlay-blended white at flash, then half, then 0)
            // plus a brightness kick on the shot that decays over 4 frames; then shake and punch zoom
            Look.impact(tl, tH, { shake: "#shake", amp: P.amp, flash: 0, zoom: P.zoom });
            const H = V.hit, shot = $(H.shot), base = H.grade || "", hitEl = $("#hit"), KICK = [1, 0.5, 0.2, 0.06];
            Look.drive(tl, tH, 0.15, (p) => {
              const f = p <= 0 || p >= 1 ? -1 : Math.round((tH + p * 0.15 - t5) * 30);
              hitEl.style.opacity = f === 0 ? H.flash : f === 1 ? H.flash * 0.5 : 0;
              shot.style.filter = f >= 0 && f < KICK.length ?
                (base + " brightness(" + (1 + (H.exposure - 1) * KICK[f]).toFixed(3) + ")").trim() : (base || "none");
            });
          }

          // police light, one source of truth: hard red/blue steps after the fifth star. It drives the corner washes (footage
          // only) and the colour of the stars' bloom; the star fills stay white. Pure function of the frame (seek-safe).
          const SB = CONFIG.strobe, sA = onFrame(SB.from), sEndF = Math.round((SB.to + SB.fade - sA) * 30);
          function police(time) {
            const f = Math.round((time - sA) * 30);
            if (f < 0 || f >= sEndF) return null;
            const env = time <= SB.to ? 1 : Math.max(0, 1 - (time - SB.to) / SB.fade);
            const u = f % (2 * SB.stepFrames), on1 = u < SB.stepFrames, k = SB.shape[u % SB.stepFrames] * env;
            const firstRed = SB.first !== "blue", red = (on1 === firstRed) ? k : 0;
            return { f: f, step: Math.floor(f / SB.stepFrames), red: red, blue: red ? 0 : k, colour: red ? "#FF3B3B" : "#3B82FF", k: k };
          }

          // light on the stars: a resting white bloom; on the hit it spikes, and while the police light runs it takes the
          // strobe's colour (fills stay #FFFFFF). v1's WANTED takes a 2-frame offset ghost in the step colour.
          const SL = CONFIG.starLight, GH = V.ghost;
          const wantedLn = hero ? nameEls[last].children[1] : null;
          const TITLE_SHADOW = "drop-shadow(0 2px 2px rgba(0,0,0,.32)) drop-shadow(0 8px 26px rgba(0,0,0,.42))";
          const bE = gsap.parseEase("power2.out");
          Look.drive(tl, 0, T.end, (p) => {
            const time = p * T.end;
            const k = time < tH ? 1 : 1 + (SL.spike - 1) * (1 - bE(Math.min(1, (time - tH) / 0.9)));
            const pl = police(time);
            let g = glow("255,255,255", SL.rest * k), ghost = "";
            if (pl && pl.k > 0.02) {
              // white core light stays, the police colour carries the halo; its strength follows the step's flash shape
              const c = rgbOf(pl.colour).join(","), s = SL.police * k * (0.45 + 0.55 * pl.k);
              g = "drop-shadow(0 0 1.5px rgba(255,255,255," + Math.min(1, 0.7 * SL.rest).toFixed(3) + ")) " +
                  "drop-shadow(0 0 12px rgba(" + c + "," + Math.min(1, 0.95 * s).toFixed(3) + ")) " +
                  "drop-shadow(0 0 36px rgba(" + c + "," + Math.min(1, 0.7 * s).toFixed(3) + "))";
              if (GH && time - sA < GH.dur && pl.f % SB.stepFrames < GH.frames)
                ghost = "drop-shadow(" + (pl.red ? -GH.px : GH.px) + "px 0 0 " + pl.colour + ") ";
            }
            for (let i = 0; i < 5; i++) cores[i].style.filter = g;
            if (wantedLn) wantedLn.style.filter = ghost + TITLE_SHADOW;
          });

          // corner washes: the same red/blue steps as hard light from the top corners (red first, on the hit)
          if (plate && V.strobePeak) {
            const red = $("#strobe .red"), blue = $("#strobe .blue");
            Look.drive(tl, sA - 1 / 60, SB.to + SB.fade - sA + 1 / 60, (p) => {
              const time = (sA - 1 / 60) + p * (SB.to + SB.fade - sA + 1 / 60), pl = (p <= 0 || p >= 1) ? null : police(time);
              red.style.opacity = pl ? (pl.red * V.strobePeak.red).toFixed(3) : 0;
              blue.style.opacity = pl ? (pl.blue * V.strobePeak.blue).toFixed(3) : 0;
            });
          }

          // ---- designed exits, finishing on the last frame (≈6.05 s) so there's no empty tail and the loop is clean ----
          if (hero) {
            Look.exit(tl, "#label", T.out + 0.04, { to: "blur", dur: 0.34, ease: "power2.in" });
            Look.exit(tl, stars.concat(badges), T.out, { to: "blur", dur: T.outDur, stagger: 0.006, ease: "power2.in" });
            at("#scrimT", { opacity: 0.66 * scrimMax }, { opacity: 0, duration: T.outDur, ease: "power2.in" }, T.out);
          } else {
            // the game's "lost them": stars un-fill right to left (star 1 first, in lit()), each badge drops with its star,
            // then the empty row blurs up and out
            const X = V.exit;
            badges.forEach((b, i) => at(b, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.72, duration: 0.14, ease: "power2.in" }, UF.at + i * UF.stagger));
            stars.forEach((s, i) => at(s, { opacity: 1, y: 0, filter: "blur(0px)" },
              { opacity: 0, y: X.y, filter: "blur(" + X.blur + "px)", duration: X.dur, ease: "power3.in" }, X.at + i * X.stagger));
            at("#hudScrim", { opacity: scrimMax }, { opacity: 0, duration: X.dur + 0.04, ease: "power2.in" }, X.at);
          }

          Look.install(tl, { duration: T.end, grain: 0.16, vignette: 0.5, enabled: plate });
          tl.set({}, {}, T.end);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        });
      })();
    </script>
  </body>
</html>
